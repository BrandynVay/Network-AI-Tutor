 "Atomic oxygen (AO, O)":{c:"Up high there's no ozone to absorb UV, so UV splits O₂ into single atoms, and the air is too thin for them to find partners again. The result is a sea of hungry single atoms exactly where LEO satellites fly, and a satellite plowing through it at 7.5 km/s gets chemically sandblasted.",e:"Dominant gas 200–600 km. Bare Kapton on the ISS ram face erodes tens of micrometers per year; the LDEF experiment showed shredded samples after 5.8 years.",x:"Ozone (O₃, three atoms, stratosphere, protective) and O₂ (two atoms, what you breathe). AO is one atom, high up, destructive.",l:"Ram/wake, erosion yield × fluence, coatings, drag (same thin air)."},
 "Outgassing":{c:"Every material made in air has gas dissolved and trapped inside it. In vacuum there's nothing holding it in, so it slowly leaks out, and in vacuum vapor travels in straight lines to the coldest surface it can find: your lens. So materials are chosen and baked for low outgassing before launch.",e:"Limits: TML < 1%, CVCM < 0.1% (ASTM E595, 125 °C for 24 h). Bake-outs run days at 100+ °C.",x:"Leaks from tanks or cabins. Outgassing is from solid materials themselves: plastics, adhesives, paints.",l:"Contamination of optics, clean rooms, MLI material choice."},
 "Spacecraft charging":{c:"On Earth static bleeds off into air and ground. In space it can't, so charge collects: sunlight knocks electrons off lit surfaces (positive) while plasma electrons land on shaded ones (negative). Two surfaces can end up kilovolts apart and arc, which fries electronics. Every surface is therefore made conductive and strapped to every other.",e:"Differential potentials of several kV have been measured on GEO satellites during geomagnetic storms; arcs have killed solar-array strings.",x:"Radiation damage. Charging is static electricity; radiation is energetic particles passing through chips.",l:"Photoelectric effect, ESD, conductive coatings (ITO), bonding straps."},
 "Stefan–Boltzmann law":{c:"Radiation is the only way heat leaves a spacecraft, and this law says how fast: proportional to the fourth power of absolute temperature. The steep T⁴ means radiators work far better when hot, cold things barely radiate, and sizing a radiator is a one-line calculation.",e:"1 m² at 300 K, ε = 0.9: ~410 W. At 350 K: ~760 W. At 200 K: only ~80 W.",x:"Conduction/convection, which depend on a temperature difference, not an absolute temperature to the fourth.",l:"Radiator sizing, emissivity/absorptivity coatings, why hot spots persist."},
 "Centripetal force":{c:"Nothing moves in a circle on its own; something must pull it inward constantly, or it goes straight. For a satellite that something is gravity. Seeing gravity as the string, not the enemy, is the key to understanding why orbits need no engine.",e:"ISS: gravity provides 8.7 m/s² inward; at 7.67 km/s that's exactly the v²/r a 6,771 km circle requires.",x:"'Centrifugal force,' the outward feeling, which isn't a real force; it's your inertia resisting the inward pull.",l:"Circular velocity formula comes from setting gravity equal to the required centripetal pull."},
 "Station-keeping":{c:"Orbits aren't perfectly stable: drag, the Moon, the Sun and Earth's lumpy shape all nudge a satellite off its intended path. Station-keeping is the routine of small burns that cancel those nudges. It's maintenance, and it's what actually ends most satellites' lives, because it uses fuel.",e:"GEO: ~50 m/s per year, burns every few weeks. ISS: a reboost of a few m/s roughly monthly.",x:"'Holding the satellite up.' Nothing holds it up; station-keeping only corrects drift from where it would be anyway.",l:"Reboost, perturbations, graveyard orbit when fuel runs out."},
 "Geostationary orbit (GEO)":{c:"A satellite that doesn't move in the sky lets you point a fixed dish at it forever. That needs a lap time of exactly one Earth rotation, which happens at only one altitude, and it needs the orbit to lie over the equator, because the equator is the only ground circle centered on Earth's center.",e:"Altitude 35,786 km, radius 42,164 km, speed 3.07 km/s, period 23 h 56 m. Three satellites cover almost all of Earth except the poles.",x:"Geosynchronous: same period but tilted, so it traces a figure-8 instead of staying put.",l:"Kepler's third law gives the altitude; station-keeping holds the slot; GTO gets you there."},
 "Constellation":{c:"One satellite can only be in one place, and low ones move fast. For continuous coverage of the whole planet you need enough satellites, spread over enough orbital planes, that one is always overhead wherever you are. That coordinated swarm is a constellation.",e:"GPS 24+ in 6 planes. Iridium 66 in 6 polar planes. Starlink thousands in dozens of planes.",x:"A group of satellites that merely share an orbit. A constellation is designed as one system with coverage guarantees.",l:"Footprint per satellite, revisit time, orbital planes (Walker)."},
 "Ionosphere":{c:"Sunlight's UV and X-rays knock electrons off atoms in the upper atmosphere, leaving a charged layer. Charged layers bend and reflect radio waves, which is why AM radio reaches far at night, why GPS signals get delayed, and why the layer grows and shrinks with day and solar activity.",e:"~60–1,000 km. GPS delay error up to tens of meters uncorrected; receivers model it out.",x:"The ozone layer (much lower, chemical not electrical) and the magnetosphere (farther out, Earth's magnetic field).",l:"Space weather indices, radio comms section, GPS accuracy."},
 "Homosphere / heterosphere":{c:"Weather stirs the lower air so thoroughly that its recipe is the same everywhere. Above about 100 km the stirring stops and each gas settles at the height its weight allows: heavy low, light high. That boundary explains why the gas list changes with altitude.",e:"Below 100 km: N₂ 78%, O₂ 21% everywhere. 200–600 km: atomic O. 600–1,500: He. Above: H.",x:"The temperature layers (troposphere etc.). Homo/heterosphere is about composition; those are about temperature.",l:"Turbopause, atomic oxygen, geocorona."},
 "Reaction wheel / momentum wheel / control moment gyro (CMG)":{c:"In vacuum there's nothing to push against to turn, so you push against yourself: spin a wheel inside and the spacecraft turns the other way. No fuel, very precise. The catch is that constant one-way pushes make the wheels spin ever faster until they saturate.",e:"Hubble uses four reaction wheels for pointing to 0.007 arcseconds. The ISS uses four CMGs. Kepler lost two wheels and had to be reinvented.",x:"Thrusters, which push on expelled gas and use fuel. Wheels only trade angular momentum internally.",l:"Momentum dumping, disturbance torques, attitude sensors."},
 "Disturbance torque":{c:"Even in 'empty' space tiny twists never stop: gravity pulls the near end harder, sunlight pushes on big panels, leftover air drags unevenly, Earth's magnetism tugs. Each is tiny, none ever stops, nothing damps them. Attitude control exists because of them.",e:"Small satellite: ~10⁻⁵ N·m. ISS: several N·m, enough to tumble it within hours if uncontrolled.",x:"Orbital perturbations, which change the path. Disturbance torques change the pointing.",l:"Reaction wheels counter them; momentum dumping resets the wheels."},
 "Thrust (F)":{c:"An orbit only changes if a force acts on the spacecraft. Thrust is that force, made by throwing momentum away: every kilogram-metre-per-second the exhaust carries off backward, the ship gains forward.",e:"0.1 kg/s at 3,000 m/s = 300 N. NEXT ion thruster 0.236 N. Merlin Vacuum 981,000 N. One F-1: 6.77 million N.",x:"Δv. Thrust is the push; Δv is what the push adds up to over the burn. Also not Isp, which is efficiency.",l:"F = ṁ × vₑ; acceleration a = F ÷ m; rocket equation."},
 "Newton's third law":{c:"It answers the oldest objection to spaceflight: there is nothing to push against. You don't need anything. Forces come in pairs, so pushing gas backward is being pushed forward. Rockets work better in vacuum than in air.",e:"A 1,000 kg ship throws 1 kg backward at 3,000 m/s and gains 3 m/s. A 1920 New York Times editorial mocked Goddard for not knowing this; the paper printed a correction in 1969.",x:"'Pushing on the air.' Also Newton's first law (things keep moving), which is why you don't need thrust to keep coasting.",l:"Conservation of momentum, thrust, reaction engine."},
 "Propellant":{c:"A rocket can only push on what it brought, so 'what do I throw?' is the central design question. Propellant is the heaviest thing on almost every spacecraft, which is why efficiency (Isp) matters so much.",e:"Falling off a Saturn V at liftoff: 13 tonnes per second. An ion engine: a few milligrams per second.",x:"Fuel. Fuel is only the part that burns; propellant is everything thrown out, including the oxidizer, or xenon that never burns at all.",l:"Mass flow rate, rocket equation, specific impulse."},
 "Exhaust velocity (vₑ)":{c:"It is the engine's quality in one number. Each kilogram you throw gives a push proportional to how fast you throw it, so faster exhaust means more Δv from the same tank.",e:"Solid motor 2.6 km/s. Kerosene 3.4. Hydrogen 4.4. Nuclear thermal ~9. Ion engine 41.",x:"The spacecraft's speed. vₑ is the gas relative to the engine, and a ship can end up moving faster than its own exhaust.",l:"Isp = vₑ ÷ g₀; F = ṁ × vₑ; Δv = vₑ × ln(m₀/m_f)."},
 "Mass flow rate (ṁ)":{c:"Thrust needs both speed and amount. ṁ is the amount per second, and it is also how fast your tanks empty, so it sets burn time.",e:"Merlin Vacuum 287 kg/s. F-1 about 2,600 kg/s. NEXT ion thruster about 6 mg/s.",x:"Total propellant mass. ṁ is a rate; multiply by burn time to get the total.",l:"F = ṁ × vₑ; burn time = propellant mass ÷ ṁ; jet power = ½ṁvₑ²."},
 "Chemical propulsion":{c:"The propellant is both the energy source and the thing thrown, so power is essentially unlimited: just burn faster. That gives enormous thrust. The price is that the energy per kilo is capped by chemistry.",e:"Isp 250–450 s, ceiling about 460 s. Thrust from 1 N thrusters to 35 million N for the Saturn V first stage.",x:"'Rockets' in general. Electric and nuclear engines are rockets too; chemical is one way to power them.",l:"Bipropellant, combustion chamber, de Laval nozzle, rocket equation."},
 "Bipropellant":{c:"Fire needs fuel and oxygen, and space has no oxygen. So the rocket carries both and mixes them in the chamber. Which pair you choose sets the Isp and how hard the propellants are to store.",e:"LH₂ + LOX about 450 s. Kerosene + LOX about 350 s. Hydrazine-family + nitrogen tetroxide about 320 s. Hydrazine alone (monopropellant) 225 s.",x:"Monopropellant: one liquid, no combustion partner, simpler but lower Isp.",l:"Oxidizer, mixture ratio, hypergolic, combustion chamber."},
 "de Laval nozzle":{c:"Gas in the chamber is hot and squeezed but slow, and thrust needs it fast. The nozzle is the converter: it narrows to push the gas to the speed of sound, then widens, and supersonic gas speeds up as it expands.",e:"Mach 1 at the throat. Merlin Vacuum exit: 3.4 km/s. Its bell is about 3 m wide because in vacuum the gas can keep expanding.",x:"A garden-hose nozzle, which only narrows. That works for slow flow; past the speed of sound the rule reverses.",l:"Throat, expansion ratio, exhaust velocity, regenerative cooling."},
 "Electric propulsion (EP)":{c:"Chemistry caps exhaust speed near 4.5 km/s. Electricity has no such cap, so electric engines throw propellant ten times faster and use a tenth as much. But the power must come from solar panels, so the push is tiny.",e:"NEXT: 6.9 kW in, 0.236 N out, Isp 4,190 s. Dawn: 0–100 km/h in 4 days, yet 11.5 km/s total Δv from 425 kg of xenon.",x:"A weak engine in the sense of a bad one. It delivers more total Δv than chemical; it just takes months.",l:"Jet power ½ṁvₑ², ion thruster, Hall thruster, low-thrust trajectories."},
 "Nuclear thermal propulsion (NTP)":{c:"To beat the chemical ceiling with high thrust, heat the lightest possible gas with something hotter per kilo than fire. A reactor heats plain hydrogen: a little cooler than a chemical flame, but far lighter exhaust, so about twice the speed.",e:"Isp about 850–900 s. NERVA: about 246 kN, 841 s, ground-tested in Nevada in the 1960s; program ended in 1972. Never flown.",x:"An RTG (electricity only) and nuclear electric propulsion (reactor powering ion engines).",l:"vₑ ∝ √(T ÷ molecular mass), rocket equation, crewed Mars transfer."},
 "Ion thruster":{c:"A flame can only throw gas as fast as its heat allows. A charged atom can be grabbed by a voltage and thrown as fast as the voltage allows, which is ten times faster. So: charge the atoms, then pull them out with grids.",e:"Deep Space 1: +1,100 V, xenon ions at 40 km/s, 0.092 N from 2.3 kW, Isp 3,100 s.",x:"Hall-effect thruster, which accelerates ions with a magnetic-field trick and has no grids.",l:"Ionization, ion optics, neutralizer, v = √(2qV ÷ m)."},
 "Plasma":{c:"A neutral gas ignores electricity. Knock electrons off its atoms and it becomes a soup of charged particles you can push, steer and accelerate with fields. That is what makes an ion engine possible, and it is also what the ionosphere and the Sun are made of.",e:"Xenon needs 12.1 eV per atom to ionize. Inside the thruster roughly one atom in ten is ionized at any moment.",x:"'The positive particles'. Plasma is ions and free electrons together, neutral overall.",l:"Ionization, ionosphere, spacecraft charging."},
 "Ionization":{c:"Electric fields only act on charge. A neutral xenon atom has none, so step one of any electric engine is to give it some by removing an electron.",e:"Xenon: 12.1 eV. The thruster's electrons are sped up by about 30 V so each collision has enough energy.",x:"Breaking chemical bonds (the lecture's wording). Xenon is single atoms; an electron is removed from the atom itself.",l:"Hollow cathode, discharge chamber, plasma."},
 "Neutralizer":{c:"Fire out only positive ions and you have charged your own spacecraft negative. It would attract the ions straight back and the thrust would vanish. Sending out an equal current of electrons keeps ship and beam neutral.",e:"Deep Space 1: 1.76 A of ions out, 1.76 A of electrons out.",x:"The cathode inside the chamber, which makes electrons for ionizing. Same device, different job.",l:"Spacecraft charging, electron backstreaming, recombination."},
 "Accelerator grid":{c:"One grid would let the plasma leak. Two grids with a voltage between them make a short, intense electric field that grabs each ion and flings it out; making the outer grid slightly negative also bars the door to outside electrons.",e:"Screen grid +1,100 V, accelerator grid −180 V, about 0.5 mm apart, thousands of matched holes.",x:"A filter or mesh. The holes are aligned pairs that focus each little ion stream.",l:"Ion optics, v = √(2qV ÷ m), grid erosion sets engine life."},
 "Molecular mass (M)":{c:"Temperature is the average energy of the molecules. For the same energy a light molecule has to move faster than a heavy one. So for exhaust speed, what the gas is made of matters as much as how hot it is.",e:"Hydrogen 2, steam 18. Chemical: √(3,500 ÷ 13.6) ≈ 16. Nuclear: √(2,700 ÷ 2) ≈ 37. Ratio about 2.3.",x:"The total mass of propellant on board. M is the weight of one molecule.",l:"vₑ ∝ √(T ÷ M); why nuclear thermal doubles Isp; why ion engines can use heavy xenon (they don't rely on heat)."},
 "Payload":{c:"Everything on a spacecraft except the payload is overhead: engines, tanks and propellant exist only to deliver it. So engine efficiency is judged by how much payload it leaves room for.",e:"Mars departure, 4 km/s: 60% propellant at Isp 450 s, 36% at 900 s.",x:"The whole spacecraft, or the propellant load.",l:"Rocket equation, payload fraction, mission requirements."},
 "Enrichment":{c:"Only U-235 splits easily, and natural uranium is 99.3% the other kind. Enriching raises the U-235 share so a reactor can be small. Go too far and the material could be used for a bomb, which brings heavy security.",e:"Natural 0.7%. Power stations 3–5%. LEU limit 20%. 1960s rocket engines 93%.",x:"How radioactive something is. Enrichment is about composition, not radiation level.",l:"Fission, reactor core, programme cost and schedule."},
 "Nuclear pulse propulsion":{c:"If the limit of a nuclear thermal rocket is that the core must not melt, one way round it is to have no core: let the nuclear energy be released outside the ship and catch the blast on a plate.",e:"Project Orion, 1958–1965: paper Isp of 2,000–6,000 s with enormous thrust. Ended by the 1963 treaty banning nuclear explosions in space.",x:"A nuclear thermal rocket (the lecture mixes them up) and NASA's Orion crew capsule.",l:"Pusher plate, shock absorbers, test-ban treaty."},
 "Electromagnetic wave":{c:"Sound needs air and wires need to be connected. An electromagnetic wave needs neither, so it is the only practical way to move information across space.",e:"Speed 299,792 km/s. Earth to Moon 1.3 s; Earth to Mars 3 to 22 minutes.",x:"Sound: a pressure wave in air at 343 m/s that cannot cross a vacuum.",l:"c = λ × f, electromagnetic spectrum, antenna."},
 "Frequency (f)":{c:"Because the speed is fixed, choosing a frequency fixes the wavelength, and the wavelength decides how big the antenna is and how tightly a dish can focus. Frequency is the first design choice of any radio link.",e:"FM 100 MHz → 3 m. Wi-Fi 2.4 GHz → 12.5 cm. Deep space 8.4 GHz → 3.6 cm.",x:"Amplitude (the wave's height) and data rate (bits per second).",l:"c = λ × f, hertz, half-wave dipole, bands (S, X, Ka)."},
 "Half-wave dipole":{c:"A rod that is exactly half a wave long resonates with the wave, like a guitar string that fits its note, so it gives the strongest voltage for that frequency. That is the link between frequency and antenna size.",e:"100 MHz → 1.5 m. 2.4 GHz → 6 cm. 100 Hz → 1,500 km.",x:"A dish, which is a reflector many wavelengths wide and behaves differently.",l:"Omnidirectional pattern, monopole (λ ÷ 4), gain 1.6×."},
 "Modulation":{c:"The information you want to send is slow, and slow waves need impossibly large antennas. Modulation lets a fast wave, which fits a small antenna, carry the slow message. It also lets many users share the air on different carriers.",e:"AM radio: 1 MHz carrier. FM radio: 100 MHz carrier swinging ±75 kHz.",x:"Amplification, which only makes a signal stronger.",l:"Carrier signal, AM, FM, phase-shift keying."},
 "Antenna gain":{c:"A transmitter's power spread over a whole sphere is mostly wasted. Shape the antenna so the power goes one way and the receiver at that end gets far more, for no extra power.",e:"Dipole 1.6×. Cassini's 4 m dish about 50,000× (47 dBi). Dish gain ≈ ½ × (π × D ÷ λ)².",x:"Added power. An antenna is passive; it only redistributes.",l:"Directivity, beamwidth ≈ 70 × λ ÷ D, pointing accuracy, attitude control."},
 "High-gain antenna (HGA)":{c:"From deep space the signal is so weak that only a tightly focused beam can carry useful data. A big dish provides it, at the price of having to aim the whole spacecraft.",e:"Cassini: 4 m, about 0.6° beam, 20 W looks like 1 MW toward Earth.",x:"A more powerful transmitter. The power is the same; the dish aims it.",l:"Low-gain antenna for backup, attitude control, Deep Space Network."},
};


const NUMBERS = {
 formulas:[

const INTERVALS=[1,3,7,14,30];

// ---------------------------------------------------------------- STATE / STORAGE
let state={ mc:{}, why:{}, cards:{}, scenes:{}, sessions:[], runs:[] };
let store={mode:"local", doc:null};
const LS_KEY="sxs_progress_v1";
function todayKey(){ return new Date().toISOString().slice(0,10); }
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s) state=Object.assign(state, JSON.parse(s)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let saveTimer=null, saving=false, dirty=false;
function persist(){
  saveLocal();
  if(store.mode==="db" && store.doc){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,600); }
}
async function flush(){
  if(saving||!dirty) return; saving=true; dirty=false;
  try{ await store.doc.set({...state, updatedAt:new Date().toISOString()}); setBadge("Saved to your account","on"); }
  catch(e){ setBadge("Saved on this device only",""); }
  saving=false; if(dirty) flush();
}
function setBadge(t,cls){ const b=document.getElementById("syncBadge"); b.textContent=t; b.className="pill "+cls; }
async function initStore(){
  loadLocal(); setBadge("Saved on this device","");
  try{
    const [db,user]=await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const doc=db.doc("data/users/"+id+"/progress");
    const snap=await doc.get();
    if(snap.exists){ const d=snap.data(); const merged=mergeState(state, d); state=merged; saveLocal(); }
    store={mode:"db",doc};
    setBadge("Saved to your account","on");
    if(!snap.exists){ dirty=true; flush(); }
    render();
  }catch(e){ /* stay local */ }
}
function mergeState(a,b){ // prefer the record with more attempts per item
  const out=JSON.parse(JSON.stringify(a));
  for(const k of ["mc","why","cards"]){ out[k]=out[k]||{}; for(const id in (b[k]||{})){ const x=out[k][id], y=b[k][id]; if(!x||(y.seen||0)>(x.seen||0)) out[k][id]=y; } }
  out.scenes=Object.assign({},a.scenes||{},b.scenes||{});
  out.sessions=[...(a.sessions||[]),...(b.sessions||[])].slice(-60);
  out.runs=[...(a.runs||[]),...(b.runs||[])].slice(-30);
  return out;
}
function rec(kind,id,ok){
  const r=state[kind][id]||{seen:0,right:0,wrong:0,streak:0,last:null,due:null};
  r.seen++; if(ok){r.right++; r.streak++;} else {r.wrong++; r.streak=0;}
  r.last=ok?"right":"wrong";
  const days=ok?INTERVALS[Math.min(r.streak-1,INTERVALS.length-1)]:1;
  const d=new Date(); d.setDate(d.getDate()+days); r.due=d.toISOString().slice(0,10);
  state[kind][id]=r; persist();
}
function isDue(r){ return !r||!r.due||r.due<=todayKey(); }
function sceneMastery(sid){
  const ids=MC.map((q,i)=>["mc",String(i),q.s]).concat(WHY.map((q,i)=>["why",String(i),q.s])).concat(CARDS.map((c,i)=>["cards",String(i),c[2]])).filter(x=>x[2]===sid);
  let pts=0,max=0; for(const [k,id] of ids){ const r=state[k][id]; max+=3; if(r){ pts+=Math.min(3,r.streak); } }
  return max?Math.round(100*pts/max):0;
}

// ---- Quiz
let quizFilter="missed", quizSet=null, qi=0, qright=0, qwrongList=[];
function buildQuiz(){
  let pool=[];
  MC.forEach((q,i)=>pool.push({kind:"mc",i,q}));
  WHY.forEach((q,i)=>pool.push({kind:"why",i,q}));
  if(quizFilter==="missed"){ pool=pool.filter(p=>{const r=state[p.kind][String(p.i)]; return r&&r.last==="wrong";}); if(!pool.length){ quizFilter="due"; return buildQuiz(); } }
  else if(quizFilter==="due"){ pool=pool.filter(p=>isDue(state[p.kind][String(p.i)])); if(!pool.length){ quizFilter="all"; return buildQuiz(); } }
  else if(quizFilter!=="all"){ pool=pool.filter(p=>p.q.s===quizFilter); }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  quizSet=pool.slice(0, quizFilter==="all"?15:12); qi=0; qright=0; qwrongList=[];
}
function quiz(){
  if(!quizSet){ quizMenu(); return; }
  if(qi>=quizSet.length){ quizDone(); return; }
  const item=quizSet[qi]; const sc=SCENES.find(s=>s.id===item.q.s);
  const head=`<div class="row" style="justify-content:space-between"><span class="pill" style="border-color:${sc.color};color:${sc.color}">Scene ${sc.n} · ${esc(sc.name)}</span><span class="muted small">${qi+1} / ${quizSet.length} · ${qright} right</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${Math.round(100*qi/quizSet.length)}%"></i></div>`;
  if(item.kind==="mc"){
    const q=item.q; const order=[0,1,2,3].sort(()=>Math.random()-.5);
    view.innerHTML=`${head}<div class="card"><h3 style="font-size:1.15rem">${esc(q.q)}</h3><div id="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(q.o[k])}</button>`).join("")}</div><div id="fb"></div></div>`;
    view.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k; const ok=k===q.a;
      view.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("right"); else if(x===b&&!ok) x.classList.add("wrong"); });
      rec("mc",String(item.i),ok); if(ok) qright++; else qwrongList.push(item);
      document.getElementById("fb").innerHTML=`<div class="explain"><b>${ok?"Right.":"Not quite."}</b> ${esc(q.x)}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="next">Next</button></div>`;
      document.getElementById("next").addEventListener("click",()=>{ qi++; render(); });
    }));
  } else {
    const q=item.q;
    view.innerHTML=`${head}<div class="card"><div class="tag">Explain it out loud</div><h3 style="font-size:1.15rem">${esc(q.q)}</h3><p class="muted small">Say your answer before you reveal. Then grade yourself honestly: could a friend have followed it?</p><div id="fb"><button class="btn primary" id="reveal">Reveal answer</button></div></div>`;
    document.getElementById("reveal").addEventListener("click",()=>{
      document.getElementById("fb").innerHTML=`<div class="explain">${esc(q.a)}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-g="1">I had it</button><button class="btn" data-g="0">Not yet</button></div>`;
      view.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{ const ok=b.dataset.g==="1"; rec("why",String(item.i),ok); if(ok) qright++; else qwrongList.push(item); qi++; render(); }));
    });
  }
}
function quizMenu(){
  const missed=MC.filter((q,i)=>state.mc[String(i)]&&state.mc[String(i)].last==="wrong").length+WHY.filter((q,i)=>state.why[String(i)]&&state.why[String(i)].last==="wrong").length;
  const due=MC.filter((q,i)=>isDue(state.mc[String(i)])).length+WHY.filter((q,i)=>isDue(state.why[String(i)])).length;
  view.innerHTML=`<h2>Quiz</h2><p class="muted small">Multiple choice with instant feedback, plus "explain it out loud" questions you grade yourself. Every answer feeds the spaced-review schedule.</p>
  <div class="grid two">
    <div class="card"><h3>Missed last time</h3><div class="big">${missed}</div><button class="btn primary" data-f="missed" ${missed?"":"disabled"}>Fix these</button></div>
    <div class="card"><h3>Due for review</h3><div class="big">${due}</div><button class="btn primary" data-f="due">Review due</button></div>
    <div class="card"><h3>Mixed set</h3><p class="small muted">15 random across all scenes. Closest to the real conversation.</p><button class="btn" data-f="all">Mixed 15</button></div>
    <div class="card"><h3>One scene</h3><div class="row">${SCENES.map(s=>`<button class="pill" style="cursor:pointer;border-color:${s.color};color:${s.color}" data-f="${s.id}">${s.n} ${esc(s.name)}</button>`).join("")}</div></div>
  </div>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ quizFilter=b.dataset.f; buildQuiz(); render(); }));
}
function quizDone(){
  const total=quizSet.length; state.sessions=(state.sessions||[]).concat([{date:todayKey(),right:qright,total,filter:quizFilter}]).slice(-60); persist();
  const pct=Math.round(100*qright/total);
  view.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Set finished</div><div class="big" style="margin:8px 0">${qright} / ${total}</div><p class="muted">${pct>=85?"Solid. Rehearse it.":pct>=60?"Getting there. Redo the misses tomorrow.":"Weak spots found. Re-read those scenes, then retry."}</p>
  ${qwrongList.length?`<div style="text-align:left;margin-top:10px"><b>Missed:</b><ul class="clean small">${qwrongList.map(p=>`<li>${esc(p.q.q)}</li>`).join("")}</ul></div>`:""}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="again">${qwrongList.length?"Retry the misses":"Another set"}</button><button class="btn ghost" id="menu">Back to quiz menu</button></div></div>`;
  document.getElementById("again").addEventListener("click",()=>{ if(qwrongList.length){ quizSet=qwrongList.slice(); qi=0; qright=0; qwrongList=[]; } else { quizFilter="all"; buildQuiz(); } render(); });
  document.getElementById("menu").addEventListener("click",()=>{ quizSet=null; render(); });
}

// ---- Cards
let cardQueue=null, ci=0, flipped=false, cardMode="due";
function buildCards(){
  let idx=CARDS.map((c,i)=>i);
  if(cardMode==="due") idx=idx.filter(i=>isDue(state.cards[String(i)]));
  if(!idx.length){ cardMode="all"; idx=CARDS.map((c,i)=>i); }
  idx.sort(()=>Math.random()-.5); cardQueue=idx.slice(0,20); ci=0; flipped=false;
}
function cards(){
  if(!cardQueue) buildCards();
  if(ci>=cardQueue.length){
    view.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Cards done</div><div class="big" style="margin:8px 0">${cardQueue.length}</div><p class="muted">Cards you nailed come back in 1, 3, 7, 14, then 30 days. Misses come back tomorrow.</p><div class="row" style="justify-content:center"><button class="btn primary" id="more">More cards</button></div></div>`;
    document.getElementById("more").addEventListener("click",()=>{ cardMode="all"; buildCards(); render(); }); return;
  }
  const i=cardQueue[ci]; const c=CARDS[i]; const sc=SCENES.find(s=>s.id===c[2]); const r=state.cards[String(i)];
  view.innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill" style="border-color:${sc.color};color:${sc.color}">Scene ${sc.n}</span><span class="muted small">${ci+1} / ${cardQueue.length} · ${cardMode==="due"?"due today":"all cards"}${r?` · streak ${r.streak}`:""}</span></div>
  <div class="card flash" id="flash" role="button" tabindex="0" aria-label="Flip card">${flipped?`<div><div class="tag">${esc(c[0])}</div><div class="back" style="margin-top:8px">${esc(c[1])}</div></div>`:`<div><div class="tag">Term</div><div style="font-family:var(--f-head);font-weight:700;font-size:1.5rem;margin-top:6px">${esc(c[0])}</div><div class="note" style="margin-top:10px">Say the meaning out loud, then tap to flip</div></div>`}</div>
  <div class="row" style="justify-content:center;margin-top:12px">${flipped?`<button class="btn" data-g="0">Missed it</button><button class="btn primary" data-g="1">Got it</button>`:`<button class="btn primary" id="flip">Flip</button>`}</div>
  <p class="note" style="text-align:center;margin-top:10px">Grade honestly. "Sort of" counts as missed. <kbd>space</kbd> flips, <kbd>1</kbd> missed, <kbd>2</kbd> got it.</p>`;
  const flip=()=>{ flipped=!flipped; render(); };
  document.getElementById("flash").addEventListener("click",flip);
  const fb=document.getElementById("flip"); if(fb) fb.addEventListener("click",flip);
  view.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{ rec("cards",String(i),b.dataset.g==="1"); ci++; flipped=false; render(); }));
}
document.addEventListener("keydown",e=>{ if(tab!=="cards"||!cardQueue||ci>=cardQueue.length) return; if(e.key===" "){ e.preventDefault(); flipped=!flipped; render(); } if(flipped&&(e.key==="1"||e.key==="2")){ rec("cards",String(cardQueue[ci]),e.key==="2"); ci++; flipped=false; render(); } });


// ---- Terms (official vocabulary)
let termQ="", termScene="all";
function terms(){
  const q=termQ.trim().toLowerCase();
  const list=TERMS.filter(t=>(termScene==="all"||t[3]===termScene)&&(!q||t.join(" ").toLowerCase().includes(q)));
  view.innerHTML=`<h2>Terms: the real names</h2><p class="muted small">Every word the lectures used plus the official engineering terms. <b>Name · also called · meaning</b>, and for the core terms: <b>the concept (why it exists), an example with numbers, what not to confuse it with, and what it connects to.</b> ${TERMS.length} entries, ${Object.keys(ENRICH).length} with full concept detail.</p>
  <div class="row"><input id="tq" type="search" placeholder="Search terms…" value="${esc(termQ)}" style="flex:1;min-width:200px;padding:10px 12px;border:2px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--fg);font:500 1rem var(--f-body)"></div>
  <div class="row" style="margin:8px 0 12px"><button class="pill ${termScene==="all"?"on":""}" style="cursor:pointer" data-sc="all">All</button>${SCENES.map(s=>`<button class="pill ${termScene===s.id?"on":""}" style="cursor:pointer;${termScene===s.id?"":"border-color:"+s.color+";color:"+s.color}" data-sc="${s.id}">${s.n} ${esc(s.name)}</button>`).join("")}</div>
  <div class="grid" id="tl">${list.map(t=>{const sc=SCENES.find(x=>x.id===t[3]); const first=t[2].split(/(?<=[.!?])\s/)[0]; const rest=t[2].slice(first.length).trim(); const en=ENRICH[t[0]];
    const deep=en?`<div class="small" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">${mode==="eli5"?"":`<div style="margin-bottom:6px"><b>The concept:</b> ${esc(en.c)}</div>`}<div style="margin-bottom:6px"><b>Example with numbers:</b> ${esc(en.e)}</div><div style="margin-bottom:6px"><b>Don't confuse with:</b> ${esc(en.x)}</div><div><b>Connects to:</b> ${esc(en.l)}</div></div>`:"";
    const also=t[1]&&t[1]!=="—"?`<div class="small muted" style="margin:2px 0 6px"><b>Also called:</b> ${esc(t[1])}</div>`:"";
    if(mode==="eli5") return `<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3 style="margin:0;font-size:1.05rem">${esc(t[0])}</h3><span class="pill" style="border-color:${sc.color};color:${sc.color};flex:none">${sc.n}</span></div><div style="font-size:1rem;margin:4px 0">${esc(first)}</div>${en?`<div class="small" style="margin:4px 0"><b>Why it exists:</b> ${esc(en.c)}</div>`:""}<details><summary class="small muted">${en?"full entry":"more"}</summary>${rest?`<div class="small" style="margin-top:4px">${esc(rest)}</div>`:""}${also}${deep}</details></div>`;
    return `<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3 style="margin:0;font-size:1.05rem">${esc(t[0])}</h3><span class="pill" style="border-color:${sc.color};color:${sc.color};flex:none">${sc.n}</span></div>${also}<div class="small">${esc(t[2])}</div>${deep}</div>`;}).join("")||`<p class="muted">No matches.</p>`}</div>`;
  const inp=document.getElementById("tq"); inp.addEventListener("input",()=>{ termQ=inp.value; const pos=inp.selectionStart; terms(); const i2=document.getElementById("tq"); i2.focus(); try{i2.setSelectionRange(pos,pos)}catch(e){} });
  view.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>{ termScene=b.dataset.sc; terms(); }));
}

// ---- Numbers (equations, constants, mission numbers)
function numbers(){
  view.innerHTML=`<h2>Equations &amp; key numbers</h2><p class="muted small">This mirrors pages 3–4 of your notebook. Every formula with one worked number; the constants; the mission numbers worth knowing cold. In 🧒 mode the plain-English name comes first.</p>
  <div class="card"><h3>Formulas</h3>${NUMBERS.formulas.map(f=>{const sc=SCENES.find(x=>x.id===f[3]); return `<div class="stat" style="align-items:flex-start;gap:12px"><div style="flex:1;min-width:0">${mode==="eli5"?`<div><b>${esc(f[1])}</b></div><div style="font-family:ui-monospace,monospace;font-size:.95rem;margin:2px 0">${esc(f[0])}</div>`:`<div style="font-family:ui-monospace,monospace;font-size:1rem"><b>${esc(f[0])}</b></div><div class="small muted">${esc(f[1])}</div>`}<div class="small" style="color:var(--accent-strong)">${esc(f[2])}</div></div><span class="pill" style="border-color:${sc.color};color:${sc.color};flex:none">${sc.n}</span></div>`;}).join("")}</div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h3>Constants</h3>${NUMBERS.constants.map(c=>`<div class="stat small"><span>${esc(c[0])}</span><b style="text-align:right">${esc(c[1])}</b></div>`).join("")}</div>
    <div class="card"><h3>Mission numbers</h3>${NUMBERS.missions.map(c=>`<div class="stat small" style="flex-direction:column;align-items:flex-start;gap:2px"><b>${esc(c[0])}</b><span class="muted">${esc(c[1])}</span></div>`).join("")}</div>
  </div>`;
}

// ---- Teach (timer)
let tmr=null, tStart=null, tElapsed=0, tRunning=false;
let program="s1"; try{ program=localStorage.getItem("sxs_program")||"s1"; if(!PROGRAMS[program]) program="s1"; }catch(e){}
function stopTimer(){ if(tmr){ clearInterval(tmr); tmr=null; } tRunning=false; }
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function teach(){
  const P=PROGRAMS[program]; const TEACH=P.blocks;
  const total=TEACH.reduce((a,b)=>a+b.t,0);
  let acc=0, cur=TEACH.length-1, blockStart=0; for(let i=0;i<TEACH.length;i++){ if(tElapsed<acc+TEACH[i].t){ cur=i; blockStart=acc; break; } acc+=TEACH[i].t; }
  const b=TEACH[cur]; const left=Math.max(0,blockStart+b.t-tElapsed);
  const runs=(state.runs||[]).filter(r=>(r.program||"full")===program);
  view.innerHTML=`<h2>Teach it back</h2><p class="muted small">Practice one section at a time, then the full talk. Press start and talk; the screen shows the block you're in, its key line, and what to draw. When the color changes, hand off.</p>
  <div class="row" id="progs">${PROGRAM_ORDER.map(k=>`<button class="pill ${k===program?"on":""}" style="cursor:pointer" data-p="${k}">${esc(PROGRAMS[k].short)} · ${esc(PROGRAMS[k].mins)}</button>`).join("")}</div>
  <div class="card" style="margin-top:10px;border-color:${b.color}"><div class="tag">${esc(P.name)}</div><p class="small" style="margin:4px 0 8px"><b>Friend opens with:</b> ${esc(P.opener)}</p>
    <div class="row" style="justify-content:space-between"><span class="pill on" style="background:${b.color};border-color:${b.color};color:#fff">Block ${cur+1} of ${TEACH.length} · ${esc(b.name)}</span><span class="muted small">${fmt(left)} left in block</span></div>
    <div class="timer" style="margin:10px 0">${fmt(tElapsed)} <span class="muted" style="font-size:1.2rem">/ ${fmt(total)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,100*tElapsed/total)}%;background:${b.color}"></i></div>
    <div class="say" style="border-color:${b.color};font-size:1.15rem;margin-top:14px">${esc(b.key)}</div>
    ${b.draw?`<p class="small"><b>Draw:</b> ${esc(b.draw)}</p>`:""}
    ${b.hand?`<p class="small"><b>Hand-off:</b> “${esc(b.hand)}”</p>`:""}
    <div class="row" style="margin-top:10px"><button class="btn primary" id="startstop">${tRunning?"Pause":tElapsed?"Resume":"Start"}</button><button class="btn ghost" id="reset">Reset</button>${tElapsed>=total?`<button class="btn" id="log">Log this run</button>`:""}</div>
  </div>
  <h2>Blocks in this talk</h2>
  <div class="card small">${TEACH.map((x,i)=>`<div class="stat"><span><span class="pill on" style="background:${x.color};border-color:${x.color};color:#fff">${i+1}</span> <b>${esc(x.name)}</b> <span class="muted">· ${fmt(x.t)}</span><br><span class="muted">${esc(x.key)}</span></span></div>`).join("")}</div>
  <h2>Cue card · ${esc(P.short)}</h2>
  <div class="cue">${P.cue.map(esc).join("<br>")}</div>
  <p class="small" style="margin-top:8px"><b>Landing line:</b> “${esc(P.land)}”</p>
  <h2>Rehearsal plan</h2>
  <ul class="clean small"><li><b>Run 1:</b> with the Learn tab open. Feel the order.</li><li><b>Run 2:</b> cue card only, timer on. Note which block ate the time.</li><li><b>Run 3:</b> nothing in front of you, phone recording, timer on. Listen back for "um", unexplained words, and facts that weren't there.</li><li>Do Section 1, 2, 3 each to a clean run 3 before you attempt the full talk.</li><li>Stuck? Pivot to the picture: "The way I think about it is…"</li></ul>
  ${runs.length?`<h2>Logged runs · ${esc(P.short)}</h2><div class="card small">${runs.slice(-5).reverse().map(r=>`<div class="stat"><span>${r.date}</span><span>${fmt(r.seconds)}</span></div>`).join("")}</div>`:""}`;
  view.querySelectorAll("#progs [data-p]").forEach(x=>x.addEventListener("click",()=>{ stopTimer(); tElapsed=0; program=x.dataset.p; try{localStorage.setItem("sxs_program",program)}catch(e){} teach(); }));
  document.getElementById("startstop").addEventListener("click",()=>{ if(tRunning){ stopTimer(); } else { tRunning=true; tStart=Date.now()-tElapsed*1000; tmr=setInterval(()=>{ tElapsed=(Date.now()-tStart)/1000; if(tElapsed>=total){ tElapsed=total; stopTimer(); } teach(); },500); } teach(); });
  document.getElementById("reset").addEventListener("click",()=>{ stopTimer(); tElapsed=0; teach(); });
  const lg=document.getElementById("log"); if(lg) lg.addEventListener("click",()=>{ state.runs=(state.runs||[]).concat([{date:todayKey(),seconds:Math.round(tElapsed),program}]).slice(-30); persist(); stopTimer(); tElapsed=0; teach(); });
}

// ---- Progress
function progress(){
  const rows=SCENES.map(s=>{ const m=sceneMastery(s.id); return `<div class="stat"><span><span class="pill" style="border-color:${s.color};color:${s.color}">${s.n}</span> ${esc(s.name)}</span><span style="flex:1;max-width:220px"><span class="bar"><i style="width:${m}%;background:${m>=80?"var(--good)":m>=50?"var(--warn)":"var(--bad)"}"></i></span></span><b style="min-width:3ch;text-align:right">${m}%</b></div>`; }).join("");
  const missed=MC.map((q,i)=>[q,state.mc[String(i)]]).filter(x=>x[1]&&x[1].last==="wrong").map(x=>x[0]);
  const sessions=(state.sessions||[]).slice(-7).reverse();
  const dueCards=CARDS.filter((c,i)=>isDue(state.cards[String(i)])).length;
  const totalAttempts=Object.values(state.mc).concat(Object.values(state.why),Object.values(state.cards)).reduce((a,r)=>a+(r.seen||0),0);
  view.innerHTML=`<h2>Where you stand</h2><p class="muted small">Mastery = how many items in each scene you've gotten right three times running. 80% in a scene means you can hold that part of the conversation.</p>
  <div class="card">${rows}</div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h3>Still missing</h3>${missed.length?`<ul class="clean small">${missed.map(q=>`<li>${esc(q.q)}</li>`).join("")}</ul>`:`<p class="muted small">Nothing marked wrong right now.</p>`}</div>
    <div class="card"><h3>Recent quiz sets</h3>${sessions.length?sessions.map(s=>`<div class="stat small"><span>${s.date} · ${esc(s.filter)}</span><b>${s.right}/${s.total}</b></div>`).join(""):`<p class="muted small">No sets yet.</p>`}<p class="note" style="margin-top:8px">${totalAttempts} answers recorded · ${dueCards} cards due</p></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Reset</h3><p class="small muted">Wipes all progress on this account. There is no undo.</p><button class="btn ghost" id="reset1">Reset progress…</button><span id="confirm" hidden> <button class="btn" id="reset2" style="border-color:var(--bad);color:var(--bad)">Yes, wipe it</button></span></div>`;
  document.getElementById("reset1").addEventListener("click",()=>{ document.getElementById("confirm").hidden=false; });
  document.getElementById("reset2").addEventListener("click",()=>{ state={mc:{},why:{},cards:{},scenes:{},sessions:[],runs:[]}; persist(); render(); });
}

render();
initStore();
</script>
