/* Layout: one sticky tab bar, one scrolling pane; cards for items, no card for prose. */
:root{
  --bg:#faf4f1; --paper:#fffbf9; --paper2:#f7eeeb; --fg:#2b1d29; --mute:#74606d; --line:#ecdcd8; --line2:#dcc6c2;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#161118; --paper:#1d1720; --paper2:#241d28; --fg:#f3e8ee; --mute:#a58f9d; --line:#342a38; --line2:#4a3d4f; --accent:#f4a9c1; --accent-strong:#f6b4c9; --accent-ink:#161118; --navy:#f6b4c9; --good:#7fd1a0; --bad:#ff8a8a; --warn:#f0b65c; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#161118; --paper:#1d1720; --paper2:#241d28; --fg:#f3e8ee; --mute:#a58f9d; --line:#342a38; --line2:#4a3d4f; --accent:#f4a9c1; --accent-strong:#f6b4c9; --accent-ink:#161118; --navy:#f6b4c9; --good:#7fd1a0; --bad:#ff8a8a; --warn:#f0b65c; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-family:var(--f-head);font-size:1.6rem;margin:0;letter-spacing:0}
h1 span{color:var(--accent-strong)}
h2{font-family:var(--f-head);font-size:1.25rem;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-head);font-size:1.05rem;margin:0 0 6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:2px solid var(--line);background:var(--paper);color:var(--fg);font:600 .92rem var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
nav.tabs button:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.btn{border:2px solid var(--line2);background:var(--paper);color:var(--fg);font:600 .95rem var(--f-body);padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;border:2px solid var(--line);color:var(--mute)}
.pill.on{background:var(--accent-strong);color:var(--paper);border-color:var(--accent-strong)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.muted{color:var(--mute)}
.say{border-left:5px solid var(--accent-strong);padding:6px 10px;margin:8px 0;font-weight:600;background:var(--paper2)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--fg);padding:12px 14px;border-radius:12px;margin:8px 0;font:500 1rem var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--fg)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.opt:disabled{cursor:default}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--paper2);border:2px solid var(--line2)}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;padding:20px;cursor:pointer;user-select:none}
.flash .back{color:var(--mute)}
.big{font-family:var(--f-head);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer{font-family:var(--f-head);font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.block{border-radius:12px;padding:12px 14px;color:#fff}
.stat{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.small{font-size:.9rem}
.note{font-size:.85rem;color:var(--mute)}
.cue{font-family:var(--f-head);font-size:1rem;line-height:1.7;border:2px dashed var(--fg);border-radius:12px;padding:12px 14px;background:var(--paper)}
kbd{font:600 .8rem var(--f-body);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
ul.clean{margin:6px 0 0 18px;padding:0}
ul.clean li{margin:4px 0}
.sr{position:absolute;left:-9999px}
table.deep{border-collapse:collapse;width:100%;font-size:.86rem;min-width:560px}
table.deep th,table.deep td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

<script>

const SCENES = [
 {id:"fall", n:1, name:"Falling & missing", color:"#ff6b1a", sec:"S1 · S3",
  story:"Throw a ball sideways. It falls and lands. Throw it harder, it lands farther. Now throw it so hard that by the time it falls, the ground has curved away underneath it. It never lands. It just keeps falling around the Earth. That's an orbit. The space station isn't floating; it's falling, and missing, 16 times a day.",
  say:"An orbit is falling and missing. Go sideways fast enough and you never hit the ground.",
  draw:"A mountain, three throws, the third one wrapping all the way around.",
  why:[["So why do astronauts float?","Because they're falling too, together with the station. Like the drop on a roller coaster, but it never ends."],["Does the ISS ever need a push?","Yes. The thin air at 400 km slows it a little, so it loses about 2 km of height a month and fires thrusters to climb back."]]},
 {id:"shelf", n:2, name:"Three shelves", color:"#1e7cff", sec:"S1 · S3",
  story:"Satellites live on three shelves. Low shelf (LEO): 200–2,000 km up, laps Earth every 90 minutes, sees a tiny patch in sharp detail. Middle shelf (MEO): up to 36,000 km, 12-hour laps, GPS lives here. Top shelf (GEO): exactly 35,786 km, one lap takes exactly one day, so from the ground it hangs still. Higher means you see more, move slower, see less detail, and the radio takes longer. Low satellites only see one spot for minutes, so to cover the planet you fly a swarm: a constellation.",
  say:"Higher means you see more but move slower. One exact height hangs still, and it has to be over the equator.",
  draw:"Earth, three rings, a flashlight cone from each ring to show how big a patch it sees.",
  why:[["Why over the equator?","Every orbit is centered on the middle of the Earth, and the equator is the only ground circle that matches. Park it over New York and New York slides away underneath."],["Why does GPS need 24 satellites but TV needs 1?","GPS is low enough that each satellite sees a patch and keeps moving; you need many so four are always overhead. A GEO TV satellite sees a third of the planet and never moves."]]},
 {id:"hoop", n:3, name:"The hula hoop", color:"#7b3fe4", sec:"S3",
  story:"Earth is a basketball; the orbit is a hula hoop around it. To tell someone exactly how the hoop sits you need six things: how big (a), how squished (e), how tilted (i), which way the tilt faces (Ω, swivel), which way the squished end points (ω, spin), and where the ball is right now (ν). Five freeze the hoop; one moves. Most orbits are ovals with Earth off to one side, so there's a closest point (perigee) and a farthest point (apogee). Like a swing: fastest at the bottom, slowest at the top. Those are the two spots where you fire the engine.",
  say:"Six numbers describe any orbit: size, squash, tilt, swivel, spin, and where you are. Fastest at the low point, slowest at the high point.",
  draw:"An egg with Earth off-center, two dots labeled fast and slow. Then a tilted hoop over a flat disk.",
  why:[["Why six numbers, not three?","Size and shape don't tell you how the hoop is turned in space. That takes three more angles."],["What does firing the engine at perigee do?","It raises the far side of the orbit, apogee. Firing at apogee raises perigee. That's how you climb from a low orbit to a high one in two burns."]]},
 {id:"vac", n:4, name:"Five free services", color:"#19b36b", sec:"S2",
  story:"Down here, the air does five jobs you never notice: it's sunscreen (ozone blocks harsh UV), it's pressure (holds gas inside materials), it's a damper (a buzzing ruler stops because air steals its energy), it's a fan (hot air carries heat away), and it's a ground wire (static leaks away). Vacuum cancels all five. So in space UV snaps plastics, trapped gas pushes out and fogs your lenses (outgassing), vibrations never die, hot spots stay hot, and charge builds until it sparks. And it starts on the ground: clean rooms, because one speck can kill a sensor.",
  say:"Earth's air is doing five jobs for you right now. Space does none of them, so the spacecraft has to do all five itself.",
  draw:"A box labeled spacecraft with five arrows pointing in, each labeled with the missing service.",
  why:[["Why does the ISS have big white panels?","Radiators. It makes its own heat and there's no air to blow it away, so it glows the heat off into space. Radiation is the only exit left."],["What is outgassing really?","Gas trapped inside materials at one atmosphere pushes out into vacuum. It can crack the material and, worse, it lands on cold lenses and sensors and fogs them."]]},
 {id:"air", n:5, name:"The air bites back", color:"#d4a500", sec:"S2",
  story:"The air is a layer cake. Troposphere (0–11 km): weather, planes, colder going up. Stratosphere (to 50 km): warmer going up, because the ozone here soaks up UV and turns it into heat. Mesosphere (to 90 km): coldest, meteors burn. Thermosphere (to 500 km): the thermometer says 1000 °C but there's almost no air, so nothing can hand that heat to you. The ISS flies through it and doesn't melt. Up there UV also splits oxygen pairs into single oxygen atoms, which grab onto anything. The spacecraft plows into them at 7.5 km/s and they eat its plastics.",
  say:"The top of the atmosphere is 1000 degrees but can't burn you, because there's nothing there. What is there is loose oxygen atoms that eat plastic.",
  draw:"A stack of five bands with a zigzag temperature line beside it.",
  why:[["1000 degrees and nothing melts?","Temperature is how fast the molecules move; heat is how many there are to hit you. One sparkler is 1000 °C and won't warm a room."],["Who's moving at 7.5 km/s, the atom or the spacecraft?","The spacecraft. The atoms are nearly still. It plows into them, so each hit carries enough energy to break a chemical bond."],["What's actually IN the air at each height?","See 'Go deeper' below: a stirred mix of nitrogen and oxygen pairs near the ground, then single oxygen atoms, then helium, then hydrogen, lightest on top."]],
  deep:{title:"What the air is made of, floor by floor",
   intro:"Think of the atmosphere as a smoothie at the bottom and a layered drink at the top. Below about 100 km everything is stirred together, so the recipe is the same everywhere. Above about 100 km the stirring stops and the gases sort themselves by weight: heavy ones low, light ones high. Sunlight also starts breaking molecules apart up there.",
   rows:[["0–100 km","the stirred mix (homosphere)","N₂ 78% · O₂ 21% · Ar 0.9% · CO₂ 0.04% · water vapor 0–4% (mostly below 11 km) · trace neon, helium, methane · ozone O₃ is a few parts per million, peaking at 15–35 km","Same recipe at every height here. This is the air you breathe and the air planes fly in."],
    ["100–200 km","the breakup zone","N₂ still the main gas, but UV is now splitting O₂ into single O atoms; atomic O climbs fast","Where the atmosphere stops being 'air' as you know it. Meteors have already burned up below this."],
    ["200–600 km","atomic oxygen country","atomic O is the number-one gas; N₂ fading; a little N and He","LEO. The ISS, Hubble and Starlink fly here. Atomic O erodes polymers; what's left of the density causes drag."],
    ["600–1,500 km","helium shell","He takes over from O (the boundary moves up and down with the Sun's activity)","Too thin to matter much for drag; GPS and GEO are far above this."],
    ["1,500 km and up","hydrogen fringe (exosphere / geocorona)","mostly single H atoms, so thin they can escape Earth entirely","A faint hydrogen halo glows in UV out to tens of thousands of km."]],
   notes:["Why the order: nitrogen pairs and oxygen pairs are heavy, single oxygen atoms are half an O₂, helium is lighter still, hydrogen is the lightest thing there is. Once the stirring stops, each gas settles at the height its weight allows, like oil over water.",
    "Where ozone fits: ozone is just three oxygen atoms stuck together. It forms in the stratosphere when UV hits O₂ and the loose atoms grab onto other O₂. It's rare (a few molecules per million) but it absorbs so well that it blocks most harmful UV. Above the stratosphere there isn't enough air for it to form, so UV comes through raw.",
    "The ionosphere overlaps all of this, roughly 60–1,000 km: sunlight knocks electrons off atoms, leaving charged particles. It bends and reflects radio, which is why AM radio travels far at night and why GPS signals get slightly delayed. It also grows and shrinks between day and night.",
    "'Anomalous O' on the lecture's chart: a small population of extra-hot oxygen atoms the model adds above ~300 km. Still oxygen; not a separate thing to memorize.",
    "Why a spacecraft cares, in one line each: atomic O eats plastics (LEO); the thin air causes drag that the Sun's activity can double or triple; the ionosphere messes with radio and GPS; helium and hydrogen are too thin to matter."]}},
 {id:"fuel", n:6, name:"The fuel bill", color:"#e5338f", sec:"S1 · S3",
  story:"First, the ladder of ways to visit a planet: fly past, orbit, drop a probe into its air, land, drive, or crash on purpose. Each rung costs more fuel to slow down and brings back more science. Now, getting there. You don't aim at Mars; you aim at where Mars will be. The cheapest route is a lazy half-ellipse that meets Mars halfway around the Sun: the Hohmann transfer, about 8.5 months, two burns. Faster costs wildly more fuel. Lambert's problem is the calculator: two points plus a time in, orbit and fuel bill out. And you can only launch when Earth and Mars line up, every 26 months.",
  say:"Fast is expensive, slow is cheap. The lazy throw takes eight and a half months and you can only do it every two years.",
  draw:"Two circles around a dot, a dashed half-oval connecting them, a burn at each end.",
  why:[["Why not just go whenever?","Mars has to be in the right spot when you arrive. That lineup happens every 26 months."],["Why can't we do Mars in 20 days?","The math gives you an orbit for it, but the speed change needed is enormous. No rocket can carry that fuel."]]},
 {id:"flyby", n:7, name:"The free lunch", color:"#555555", sec:"S1 · S3",
  story:"For really far places the lazy throw is still too expensive. So you cheat. Swing close past a planet. In the planet's eyes you come in and go out at the same speed, just bent. But the planet is moving around the Sun, and the bend lines you up to carry some of that motion along. You leave faster than you arrived, for free: a flyby, or gravity assist. A ball bouncing off the front of a moving truck. More speed means a bigger orbit, so you reach farther. Pass in front of the planet instead and you slow down. The price is time: Rosetta took 10 years and four flybys to reach a comet.",
  say:"Bounce off a moving planet and you leave faster than you came. It's free, but it takes years.",
  draw:"A planet with a thick arrow showing it moving, a dashed path bending around it.",
  why:[["Isn't that free energy?","No. It comes from the planet, which slows down by an amount nobody could ever measure."],["Why couldn't New Horizons stop at Pluto?","It left Earth so fast, plus a Jupiter boost, that no fuel could brake it into orbit. Speed bought the trip; speed cost the orbit."]]},
];

const WHY = [
 {s:"fall", q:"Explain to a friend in two sentences why the ISS doesn't fall down.", a:"It is falling. It's also moving sideways at 7.7 km/s, so the ground curves away under it as fast as it drops. Falling and missing, forever."},
 {s:"shelf", q:"Why is 35,786 km not a round number?", a:"It's the one altitude where a lap takes exactly one Earth rotation. It's calculated from gravity, not chosen. Lower is too fast, higher is too slow."},
 {s:"shelf", q:"Why does GEO have to be over the equator?", a:"Every orbit's plane passes through Earth's center. The equator is the only ground circle centered the same way, so it's the only place a satellite can keep pace with the ground."},
 {s:"hoop", q:"Walk through the six parameters using the hula hoop.", a:"Size (a), squish (e), tilt (i), swivel of the tilt (Ω), spin of the squished end within the plane (ω), and where the bead is now (ν). Five describe the hoop, one describes the ball."},
 {s:"hoop", q:"Why do you fire the engine at perigee to go higher?", a:"A speed-up at the low point raises the opposite side of the orbit, the apogee. The orbit stretches away from where you pushed. A second burn at apogee then rounds it off."},
 {s:"vac", q:"Name the five free services and what goes wrong without each.", a:"Sunscreen → UV snaps plastics. Pressure → trapped gas outgasses and fogs sensors. Damper → vibrations never die. Fan → hot spots stay hot. Ground wire → charge builds and sparks."},
 {s:"vac", q:"Why does the ISS need radiators if space can't heat it up?", a:"The station makes its own heat: electronics, people, sunlight. With no air to blow it away, radiating it from big panels into cold space is the only way out."},
 {s:"air", q:"Explain 'hot but not heat' for the thermosphere.", a:"Temperature is how fast molecules move; the few up there move very fast. Heat is how much energy actually gets delivered, which needs many molecules. There are almost none, so nothing cooks."},
 {s:"air", q:"How is atomic oxygen made and why is it dangerous?", a:"UV splits O₂ into single O atoms up high. They're desperate to bond. A spacecraft at 7.5 km/s slams into them and each hit breaks bonds in plastics, eroding them."},
 {s:"fuel", q:"Explain the Hohmann transfer like the lazy throw.", a:"Don't hurl the ball at your friend on the far merry-go-round; lob it gently so it drifts outward on a long curve and arrives as they come around. Least effort, longer wait. Half an ellipse, 180°, two burns, 8.5 months to Mars."},
 {s:"fuel", q:"What does Lambert's problem do for a mission planner?", a:"Give it where you are, where you want to be, and how long you'll take; it returns the single orbit that works and therefore the Δv. It's the 'can I get there by then, and what will it cost' calculator."},
 {s:"flyby", q:"Explain a gravity assist with the moving truck.", a:"A ball off a wall comes back at the same speed. Off the front of a moving truck it comes back faster because the truck is moving. The planet is the truck: in its frame your speed doesn't change, but in the Sun's frame you leave faster."},
 {s:"flyby", q:"Why is the price of flybys time?", a:"Each assist needs the planets lined up, so you loop around the inner solar system for years collecting boosts instead of carrying fuel. Rosetta: 10 years, four flybys."},

// ---------------------------------------------------------------- STATE / STORAGE
let state={ mc:{}, why:{}, cards:{}, scenes:{}, sessions:[], runs:[] };
let store={mode:"local", doc:null};
const LS_KEY="sxs_progress_v1";
function todayKey(){ return new Date().toISOString().slice(0,10); }
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s) state=Object.assign(state, JSON.parse(s)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let saveTimer=null, saving=false, dirty=false;
function persist(){
  saveLocal();
  if(store.mode==="db" && store.doc){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,600); }
}
async function flush(){
  if(saving||!dirty) return; saving=true; dirty=false;
  try{ await store.doc.set({...state, updatedAt:new Date().toISOString()}); setBadge("Saved to your account","on"); }
  catch(e){ setBadge("Saved on this device only",""); }
  saving=false; if(dirty) flush();
}
function setBadge(t,cls){ const b=document.getElementById("syncBadge"); b.textContent=t; b.className="pill "+cls; }
async function initStore(){
  loadLocal(); setBadge("Saved on this device","");
  try{
    const [db,user]=await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const doc=db.doc("data/users/"+id+"/progress");
    const snap=await doc.get();
    if(snap.exists){ const d=snap.data(); const merged=mergeState(state, d); state=merged; saveLocal(); }
    store={mode:"db",doc};
    setBadge("Saved to your account","on");
    if(!snap.exists){ dirty=true; flush(); }
    render();
  }catch(e){ /* stay local */ }
}
function mergeState(a,b){ // prefer the record with more attempts per item
  const out=JSON.parse(JSON.stringify(a));
  for(const k of ["mc","why","cards"]){ out[k]=out[k]||{}; for(const id in (b[k]||{})){ const x=out[k][id], y=b[k][id]; if(!x||(y.seen||0)>(x.seen||0)) out[k][id]=y; } }
  out.scenes=Object.assign({},a.scenes||{},b.scenes||{});
  out.sessions=[...(a.sessions||[]),...(b.sessions||[])].slice(-60);
  out.runs=[...(a.runs||[]),...(b.runs||[])].slice(-30);
  return out;
}
function rec(kind,id,ok){
  const r=state[kind][id]||{seen:0,right:0,wrong:0,streak:0,last:null,due:null};
  r.seen++; if(ok){r.right++; r.streak++;} else {r.wrong++; r.streak=0;}
  r.last=ok?"right":"wrong";
  const days=ok?INTERVALS[Math.min(r.streak-1,INTERVALS.length-1)]:1;
  const d=new Date(); d.setDate(d.getDate()+days); r.due=d.toISOString().slice(0,10);
  state[kind][id]=r; persist();
}
function isDue(r){ return !r||!r.due||r.due<=todayKey(); }
function sceneMastery(sid){
  const ids=MC.map((q,i)=>["mc",String(i),q.s]).concat(WHY.map((q,i)=>["why",String(i),q.s])).concat(CARDS.map((c,i)=>["cards",String(i),c[2]])).filter(x=>x[2]===sid);
  let pts=0,max=0; for(const [k,id] of ids){ const r=state[k][id]; max+=3; if(r){ pts+=Math.min(3,r.streak); } }
  return max?Math.round(100*pts/max):0;
}

// ---- Quiz
let quizFilter="missed", quizSet=null, qi=0, qright=0, qwrongList=[];
function buildQuiz(){
  let pool=[];
  MC.forEach((q,i)=>pool.push({kind:"mc",i,q}));
  WHY.forEach((q,i)=>pool.push({kind:"why",i,q}));
  if(quizFilter==="missed"){ pool=pool.filter(p=>{const r=state[p.kind][String(p.i)]; return r&&r.last==="wrong";}); if(!pool.length){ quizFilter="due"; return buildQuiz(); } }
  else if(quizFilter==="due"){ pool=pool.filter(p=>isDue(state[p.kind][String(p.i)])); if(!pool.length){ quizFilter="all"; return buildQuiz(); } }
  else if(quizFilter!=="all"){ pool=pool.filter(p=>p.q.s===quizFilter); }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  quizSet=pool.slice(0, quizFilter==="all"?15:12); qi=0; qright=0; qwrongList=[];
}
function quiz(){
  if(!quizSet){ quizMenu(); return; }
  if(qi>=quizSet.length){ quizDone(); return; }
  const item=quizSet[qi]; const sc=SCENES.find(s=>s.id===item.q.s);
  const head=`<div class="row" style="justify-content:space-between"><span class="pill" style="border-color:${sc.color};color:${sc.color}">Scene ${sc.n} · ${esc(sc.name)}</span><span class="muted small">${qi+1} / ${quizSet.length} · ${qright} right</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${Math.round(100*qi/quizSet.length)}%"></i></div>`;
  if(item.kind==="mc"){
    const q=item.q; const order=[0,1,2,3].sort(()=>Math.random()-.5);
    view.innerHTML=`${head}<div class="card"><h3 style="font-size:1.15rem">${esc(q.q)}</h3><div id="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(q.o[k])}</button>`).join("")}</div><div id="fb"></div></div>`;
    view.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k; const ok=k===q.a;
      view.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("right"); else if(x===b&&!ok) x.classList.add("wrong"); });
      rec("mc",String(item.i),ok); if(ok) qright++; else qwrongList.push(item);
      document.getElementById("fb").innerHTML=`<div class="explain"><b>${ok?"Right.":"Not quite."}</b> ${esc(q.x)}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="next">Next</button></div>`;
      document.getElementById("next").addEventListener("click",()=>{ qi++; render(); });
    }));
  } else {
    const q=item.q;
    view.innerHTML=`${head}<div class="card"><div class="tag">Explain it out loud</div><h3 style="font-size:1.15rem">${esc(q.q)}</h3><p class="muted small">Say your answer before you reveal. Then grade yourself honestly: could a friend have followed it?</p><div id="fb"><button class="btn primary" id="reveal">Reveal answer</button></div></div>`;
    document.getElementById("reveal").addEventListener("click",()=>{
      document.getElementById("fb").innerHTML=`<div class="explain">${esc(q.a)}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-g="1">I had it</button><button class="btn" data-g="0">Not yet</button></div>`;
      view.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{ const ok=b.dataset.g==="1"; rec("why",String(item.i),ok); if(ok) qright++; else qwrongList.push(item); qi++; render(); }));
    });
  }
}
function quizMenu(){
  const missed=MC.filter((q,i)=>state.mc[String(i)]&&state.mc[String(i)].last==="wrong").length+WHY.filter((q,i)=>state.why[String(i)]&&state.why[String(i)].last==="wrong").length;
  const due=MC.filter((q,i)=>isDue(state.mc[String(i)])).length+WHY.filter((q,i)=>isDue(state.why[String(i)])).length;
  view.innerHTML=`<h2>Quiz</h2><p class="muted small">Multiple choice with instant feedback, plus "explain it out loud" questions you grade yourself. Every answer feeds the spaced-review schedule.</p>
  <div class="grid two">
    <div class="card"><h3>Missed last time</h3><div class="big">${missed}</div><button class="btn primary" data-f="missed" ${missed?"":"disabled"}>Fix these</button></div>

    <div class="card"><h3>One scene</h3><div class="row">${SCENES.map(s=>`<button class="pill" style="cursor:pointer;border-color:${s.color};color:${s.color}" data-f="${s.id}">${s.n} ${esc(s.name)}</button>`).join("")}</div></div>
  </div>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ quizFilter=b.dataset.f; buildQuiz(); render(); }));
}
function quizDone(){
  const total=quizSet.length; state.sessions=(state.sessions||[]).concat([{date:todayKey(),right:qright,total,filter:quizFilter}]).slice(-60); persist();
  const pct=Math.round(100*qright/total);
  view.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Set finished</div><div class="big" style="margin:8px 0">${qright} / ${total}</div><p class="muted">${pct>=85?"Solid. Rehearse it.":pct>=60?"Getting there. Redo the misses tomorrow.":"Weak spots found. Re-read those scenes, then retry."}</p>
  ${qwrongList.length?`<div style="text-align:left;margin-top:10px"><b>Missed:</b><ul class="clean small">${qwrongList.map(p=>`<li>${esc(p.q.q)}</li>`).join("")}</ul></div>`:""}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="again">${qwrongList.length?"Retry the misses":"Another set"}</button><button class="btn ghost" id="menu">Back to quiz menu</button></div></div>`;
  document.getElementById("again").addEventListener("click",()=>{ if(qwrongList.length){ quizSet=qwrongList.slice(); qi=0; qright=0; qwrongList=[]; } else { quizFilter="all"; buildQuiz(); } render(); });
  document.getElementById("menu").addEventListener("click",()=>{ quizSet=null; render(); });
}

// ---- Cards
let cardQueue=null, ci=0, flipped=false, cardMode="due";
function buildCards(){
  let idx=CARDS.map((c,i)=>i);
  if(cardMode==="due") idx=idx.filter(i=>isDue(state.cards[String(i)]));
  if(!idx.length){ cardMode="all"; idx=CARDS.map((c,i)=>i); }
  idx.sort(()=>Math.random()-.5); cardQueue=idx.slice(0,20); ci=0; flipped=false;
}
function cards(){
  if(!cardQueue) buildCards();
  if(ci>=cardQueue.length){
    view.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Cards done</div><div class="big" style="margin:8px 0">${cardQueue.length}</div><p class="muted">Cards you nailed come back in 1, 3, 7, 14, then 30 days. Misses come back tomorrow.</p><div class="row" style="justify-content:center"><button class="btn primary" id="more">More cards</button></div></div>`;
    document.getElementById("more").addEventListener("click",()=>{ cardMode="all"; buildCards(); render(); }); return;
  }
  const i=cardQueue[ci]; const c=CARDS[i]; const sc=SCENES.find(s=>s.id===c[2]); const r=state.cards[String(i)];
  view.innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill" style="border-color:${sc.color};color:${sc.color}">Scene ${sc.n}</span><span class="muted small">${ci+1} / ${cardQueue.length} · ${cardMode==="due"?"due today":"all cards"}${r?` · streak ${r.streak}`:""}</span></div>
  <div class="card flash" id="flash" role="button" tabindex="0" aria-label="Flip card">${flipped?`<div><div class="tag">${esc(c[0])}</div><div class="back" style="margin-top:8px">${esc(c[1])}</div></div>`:`<div><div class="tag">Term</div><div style="font-family:var(--f-head);font-weight:700;font-size:1.5rem;margin-top:6px">${esc(c[0])}</div><div class="note" style="margin-top:10px">Say the meaning out loud, then tap to flip</div></div>`}</div>
  <div class="row" style="justify-content:center;margin-top:12px">${flipped?`<button class="btn" data-g="0">Missed it</button><button class="btn primary" data-g="1">Got it</button>`:`<button class="btn primary" id="flip">Flip</button>`}</div>
  <p class="note" style="text-align:center;margin-top:10px">Grade honestly. "Sort of" counts as missed. <kbd>space</kbd> flips, <kbd>1</kbd> missed, <kbd>2</kbd> got it.</p>`;
  const flip=()=>{ flipped=!flipped; render(); };
  document.getElementById("flash").addEventListener("click",flip);
  const fb=document.getElementById("flip"); if(fb) fb.addEventListener("click",flip);
  view.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{ rec("cards",String(i),b.dataset.g==="1"); ci++; flipped=false; render(); }));
}
document.addEventListener("keydown",e=>{ if(tab!=="cards"||!cardQueue||ci>=cardQueue.length) return; if(e.key===" "){ e.preventDefault(); flipped=!flipped; render(); } if(flipped&&(e.key==="1"||e.key==="2")){ rec("cards",String(cardQueue[ci]),e.key==="2"); ci++; flipped=false; render(); } });

// ---- Teach (timer)
let tmr=null, tStart=null, tElapsed=0, tRunning=false;
let program="s1"; try{ program=localStorage.getItem("sxs_program")||"s1"; if(!PROGRAMS[program]) program="s1"; }catch(e){}
function stopTimer(){ if(tmr){ clearInterval(tmr); tmr=null; } tRunning=false; }
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function teach(){
  const P=PROGRAMS[program]; const TEACH=P.blocks;
  const total=TEACH.reduce((a,b)=>a+b.t,0);
  let acc=0, cur=TEACH.length-1, blockStart=0; for(let i=0;i<TEACH.length;i++){ if(tElapsed<acc+TEACH[i].t){ cur=i; blockStart=acc; break; } acc+=TEACH[i].t; }
  const b=TEACH[cur]; const left=Math.max(0,blockStart+b.t-tElapsed);
  const runs=(state.runs||[]).filter(r=>(r.program||"full")===program);
  view.innerHTML=`<h2>Teach it back</h2><p class="muted small">Practice one section at a time, then the full talk. Press start and talk; the screen shows the block you're in, its key line, and what to draw. When the color changes, hand off.</p>
  <div class="row" id="progs">${PROGRAM_ORDER.map(k=>`<button class="pill ${k===program?"on":""}" style="cursor:pointer" data-p="${k}">${esc(PROGRAMS[k].short)} · ${esc(PROGRAMS[k].mins)}</button>`).join("")}</div>
  <div class="card" style="margin-top:10px;border-color:${b.color}"><div class="tag">${esc(P.name)}</div><p class="small" style="margin:4px 0 8px"><b>Friend opens with:</b> ${esc(P.opener)}</p>
    <div class="row" style="justify-content:space-between"><span class="pill on" style="background:${b.color};border-color:${b.color};color:#fff">Block ${cur+1} of ${TEACH.length} · ${esc(b.name)}</span><span class="muted small">${fmt(left)} left in block</span></div>
    <div class="timer" style="margin:10px 0">${fmt(tElapsed)} <span class="muted" style="font-size:1.2rem">/ ${fmt(total)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,100*tElapsed/total)}%;background:${b.color}"></i></div>
    <div class="say" style="border-color:${b.color};font-size:1.15rem;margin-top:14px">${esc(b.key)}</div>
    ${b.draw?`<p class="small"><b>Draw:</b> ${esc(b.draw)}</p>`:""}
    ${b.hand?`<p class="small"><b>Hand-off:</b> “${esc(b.hand)}”</p>`:""}
    <div class="row" style="margin-top:10px"><button class="btn primary" id="startstop">${tRunning?"Pause":tElapsed?"Resume":"Start"}</button><button class="btn ghost" id="reset">Reset</button>${tElapsed>=total?`<button class="btn" id="log">Log this run</button>`:""}</div>
  </div>
  <h2>Blocks in this talk</h2>
  <div class="card small">${TEACH.map((x,i)=>`<div class="stat"><span><span class="pill on" style="background:${x.color};border-color:${x.color};color:#fff">${i+1}</span> <b>${esc(x.name)}</b> <span class="muted">· ${fmt(x.t)}</span><br><span class="muted">${esc(x.key)}</span></span></div>`).join("")}</div>
  <h2>Cue card · ${esc(P.short)}</h2>
  <div class="cue">${P.cue.map(esc).join("<br>")}</div>
  <p class="small" style="margin-top:8px"><b>Landing line:</b> “${esc(P.land)}”</p>
  <h2>Rehearsal plan</h2>
  <ul class="clean small"><li><b>Run 1:</b> with the Learn tab open. Feel the order.</li><li><b>Run 2:</b> cue card only, timer on. Note which block ate the time.</li><li><b>Run 3:</b> nothing in front of you, phone recording, timer on. Listen back for "um", unexplained words, and facts that weren't there.</li><li>Do Section 1, 2, 3 each to a clean run 3 before you attempt the full talk.</li><li>Stuck? Pivot to the picture: "The way I think about it is…"</li></ul>
  ${runs.length?`<h2>Logged runs · ${esc(P.short)}</h2><div class="card small">${runs.slice(-5).reverse().map(r=>`<div class="stat"><span>${r.date}</span><span>${fmt(r.seconds)}</span></div>`).join("")}</div>`:""}`;
  view.querySelectorAll("#progs [data-p]").forEach(x=>x.addEventListener("click",()=>{ stopTimer(); tElapsed=0; program=x.dataset.p; try{localStorage.setItem("sxs_program",program)}catch(e){} teach(); }));
  document.getElementById("startstop").addEventListener("click",()=>{ if(tRunning){ stopTimer(); } else { tRunning=true; tStart=Date.now()-tElapsed*1000; tmr=setInterval(()=>{ tElapsed=(Date.now()-tStart)/1000; if(tElapsed>=total){ tElapsed=total; stopTimer(); } teach(); },500); } teach(); });
  document.getElementById("reset").addEventListener("click",()=>{ stopTimer(); tElapsed=0; teach(); });
  const lg=document.getElementById("log"); if(lg) lg.addEventListener("click",()=>{ state.runs=(state.runs||[]).concat([{date:todayKey(),seconds:Math.round(tElapsed),program}]).slice(-30); persist(); stopTimer(); tElapsed=0; teach(); });
}

// ---- Progress
function progress(){
  const rows=SCENES.map(s=>{ const m=sceneMastery(s.id); return `<div class="stat"><span><span class="pill" style="border-color:${s.color};color:${s.color}">${s.n}</span> ${esc(s.name)}</span><span style="flex:1;max-width:220px"><span class="bar"><i style="width:${m}%;background:${m>=80?"var(--good)":m>=50?"var(--warn)":"var(--bad)"}"></i></span></span><b style="min-width:3ch;text-align:right">${m}%</b></div>`; }).join("");
  const missed=MC.map((q,i)=>[q,state.mc[String(i)]]).filter(x=>x[1]&&x[1].last==="wrong").map(x=>x[0]);
  const sessions=(state.sessions||[]).slice(-7).reverse();
  const dueCards=CARDS.filter((c,i)=>isDue(state.cards[String(i)])).length;
  const totalAttempts=Object.values(state.mc).concat(Object.values(state.why),Object.values(state.cards)).reduce((a,r)=>a+(r.seen||0),0);
  view.innerHTML=`<h2>Where you stand</h2><p class="muted small">Mastery = how many items in each scene you've gotten right three times running. 80% in a scene means you can hold that part of the conversation.</p>
  <div class="card">${rows}</div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h3>Still missing</h3>${missed.length?`<ul class="clean small">${missed.map(q=>`<li>${esc(q.q)}</li>`).join("")}</ul>`:`<p class="muted small">Nothing marked wrong right now.</p>`}</div>
    <div class="card"><h3>Recent quiz sets</h3>${sessions.length?sessions.map(s=>`<div class="stat small"><span>${s.date} · ${esc(s.filter)}</span><b>${s.right}/${s.total}</b></div>`).join(""):`<p class="muted small">No sets yet.</p>`}<p class="note" style="margin-top:8px">${totalAttempts} answers recorded · ${dueCards} cards due</p></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Reset</h3><p class="small muted">Wipes all progress on this account. There is no undo.</p><button class="btn ghost" id="reset1">Reset progress…</button><span id="confirm" hidden> <button class="btn" id="reset2" style="border-color:var(--bad);color:var(--bad)">Yes, wipe it</button></span></div>`;
  document.getElementById("reset1").addEventListener("click",()=>{ document.getElementById("confirm").hidden=false; });
  document.getElementById("reset2").addEventListener("click",()=>{ state={mc:{},why:{},cards:{},scenes:{},sessions:[],runs:[]}; persist(); render(); });
}

render();
initStore();
</script>
