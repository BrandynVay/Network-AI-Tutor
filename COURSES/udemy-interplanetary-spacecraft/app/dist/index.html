const TERMS = [
 // --- mechanisms (added 2026-11-11)
 ["Centripetal force","center-seeking force","The inward force that bends straight-line motion into a curve. For a satellite, gravity is the centripetal force; for a ball on a string, the string's tension. Without it, motion continues in a straight line (Newton's first law).","fall"],
 ["Station-keeping","orbit maintenance","Small periodic burns that cancel perturbations (drag in LEO, the Moon's and Sun's gravity in GEO) so the orbit stays where the mission needs it. Sets a GEO satellite's useful life. Not what 'holds the satellite up'; nothing does.","fall"],
 ["Reboost","altitude raise","A short prograde burn to regain altitude lost to atmospheric drag. The ISS does one about monthly, using its own thrusters or a docked cargo ship.","fall"],
 ["Free fall","—","Motion under gravity alone, with nothing pushing back. Everything in orbit is in free fall; that, not absence of gravity, is why things float.","fall"],
 ["Graveyard orbit","disposal orbit","Where retired GEO satellites are parked, ~300 km above GEO, so they don't drift through working slots.","shelf"],
 ["State vector","position and velocity","The six numbers x, y, z, vx, vy, vz at one instant. Measured by tracking; converted by geometry into the six orbital elements.","hoop"],
 ["Two-Line Element set (TLE)","—","The standard public text format for a satellite's orbital elements plus their epoch, published for every tracked object.","hoop"],
 ["Oberth effect","—","A given Δv adds more orbital energy when applied at high speed, i.e. deep in a gravity well at periapsis. Why departure burns happen from LEO and flybys dip low.","fuel"],
 ["Specific impulse (Isp)","—","An engine's fuel efficiency, in seconds: exhaust speed divided by g₀. Chemical rockets 300–450 s; ion engines 3,000+ s with tiny thrust.","fuel"],
 ["Porkchop plot","—","A contour map of required Δv versus departure date and arrival date, produced by solving Lambert's problem thousands of times. How launch dates are chosen.","fuel"],
 ["Stefan–Boltzmann law","—","Radiated power per area = σ·ε·T⁴. Doubling absolute temperature radiates 16× more. The physics behind radiator sizing.","vac"],
 ["Emissivity / absorptivity (ε / α)","—","How well a surface radiates heat / how much sunlight it absorbs. Radiators want high ε, low α: white paint, silvered Teflon.","vac"],
 ["Heat pipe","—","A sealed tube whose working fluid boils at the hot end, condenses at the cold end, and wicks back. Moves kilowatts with no pump; the spacecraft's replacement for convection.","vac"],
 ["Photoelectric effect","—","UV light knocking electrons off a surface. Makes sunlit spacecraft surfaces go positive; one half of spacecraft charging.","vac"],
 ["Geostationary transfer orbit (GTO) burns","apogee kick","+2.42 km/s at perigee (LEO 300 km) then +1.47 km/s at apogee: the worked Hohmann to GEO, 5.3 h apart.","shelf"],
 // --- orbits & elements
 ["Classical Orbital Elements (COEs)","Keplerian elements · orbital parameters · the six elements","The six numbers that completely describe an orbit: a, e, i, Ω, ω, ν. Five fix the shape and orientation; the sixth says where the body is. The hula hoop's six settings.","hoop"],
 ["Semi-major axis (a)","half the major axis · 'size' of the orbit","Half the longest width of the ellipse; the average of perigee and apogee distances from the center of the body. Sets the orbit's size and, through Kepler's third law, its period.","hoop"],
 ["Semi-minor axis (b)","—","Half the shortest width of the ellipse. Related to a and e by b = a·√(1−e²). Rarely quoted; a and e carry the information.","hoop"],
 ["Eccentricity (e)","'shape' of the orbit","How far the ellipse departs from a circle. 0 = circle, 0 < e < 1 = ellipse, e = 1 = parabola (escape), e > 1 = hyperbola (flyby).","hoop"],
 ["Inclination (i)","tilt","Angle between the orbital plane and the reference plane (Earth's equator for Earth satellites). 0° equatorial, 90° polar, > 90° retrograde.","hoop"],
 ["Right ascension of the ascending node (Ω, RAAN)","longitude of the ascending node · 'swivel'","Angle, measured in the reference plane from the vernal equinox (♈), to the point where the orbit crosses the plane heading north.","hoop"],
 ["Argument of periapsis (ω)","argument of perigee · 'spin in plane'","Angle, measured in the orbital plane, from the ascending node to periapsis. Says which way the long axis of the ellipse points.","hoop"],
 ["True anomaly (ν or θ)","—","Angle from periapsis to the body's current position, measured at the central body. The only element that changes quickly as the orbit proceeds.","hoop"],
 ["Mean anomaly (M) and eccentric anomaly (E)","—","Two other ways of saying 'where along the orbit.' Mean anomaly grows evenly with time (useful for computing); eccentric anomaly is a geometric helper between the two. Course doesn't cover them; you'll see them in real data.","hoop"],
 ["Epoch","—","The timestamp the elements are valid for. Elements drift, so a set of COEs always comes with an epoch.","hoop"],
 ["Orbital plane","—","The flat sheet the orbit lies in. Always passes through the center of the body being orbited. Why GEO must be over the equator.","hoop"],
 ["Reference plane","fundamental plane","The plane you measure inclination from: Earth's equator for Earth orbits, the ecliptic for Sun orbits.","hoop"],
 ["Vernal equinox direction (♈)","First Point of Aries · reference direction","Fixed direction in space, toward where the Sun sits on the March equinox. The zero point for measuring Ω. Not 'toward the Sun,' which moves daily.","hoop"],
 ["Ecliptic","—","The plane of Earth's orbit around the Sun. Reference plane for heliocentric (Sun-centered) orbits. Tilted 23.4° to the equator.","hoop"],
 ["Equatorial plane","—","The plane through Earth's equator. Reference plane for geocentric (Earth-centered) orbits.","hoop"],
 ["Line of nodes","—","The line where the orbital plane cuts the reference plane; it joins the ascending and descending nodes.","hoop"],
 ["Ascending / descending node","—","The two points where an inclined orbit pierces the reference plane: ascending going north, descending going south.","hoop"],
 ["Apsis (plural apsides)","—","Either extreme point of an orbit: the nearest or the farthest.","hoop"],
 ["Periapsis / apoapsis","perigee/apogee (Earth) · perihelion/aphelion (Sun) · perilune/apolune (Moon) · periareion/apoareion (Mars)","The closest and farthest points of an orbit from the central body. Fastest at periapsis, slowest at apoapsis.","hoop"],
 ["Line of apsides","major axis","The straight line through periapsis and apoapsis, passing through the central body. Its half-length is a.","hoop"],
 ["Geocentric / heliocentric","Earth-centered / Sun-centered","Which body sits at the focus. Satellites are geocentric; interplanetary cruise is heliocentric.","hoop"],
 ["Prograde / retrograde","posigrade / —","Prograde: moving in the same direction as the body's rotation (east for Earth) or along your own velocity. Retrograde: opposite. Also used for burns: prograde speeds up, retrograde slows down.","hoop"],
 ["Kepler's laws","—","1: orbits are ellipses with the central body at a focus. 2: equal areas in equal times (fast near, slow far). 3: T² ∝ a³ (bigger orbit, longer period).","hoop"],
 ["Orbital period (T)","—","Time for one revolution: T = 2π√(a³/μ). Depends only on a and the central body.","shelf"],
 ["Standard gravitational parameter (μ)","GM · 'mu'","The body's mass times the gravitational constant, in one number: Earth μ = 398,600 km³/s². Shows up in every orbit formula.","hoop"],
 ["Vis-viva equation","orbital energy equation","v² = μ(2/r − 1/a). Speed anywhere on any orbit from distance and semi-major axis. Gives circular speed (a = r) and escape speed (a → ∞).","hoop"],
 ["Specific orbital energy (ε)","—","Kinetic plus potential energy per kilogram: ε = −μ/(2a). Negative = bound orbit, zero = escape, positive = hyperbolic. More speed at a given r → higher ε → bigger a.","flyby"],
 ["Circular velocity","—","v = √(μ/r). The speed that keeps you at constant height. LEO ≈ 7.7 km/s.","shelf"],
 ["Escape velocity","—","v = √(2μ/r), exactly √2 × circular. Reach it and you never come back. From LEO ≈ 11 km/s.","shelf"],
 ["Two-body problem","Kepler problem","The idealization behind all of this: one body, one central mass, nothing else. Real orbits add perturbations on top.","hoop"],
 ["Perturbation (orbital)","—","Any small extra force that bends the ideal two-body orbit: Earth's bulge (J₂), drag, Moon and Sun, sunlight pressure. Causes elements to drift over time.","hoop"],
 ["J₂ / nodal precession","—","Earth's equatorial bulge slowly swivels an inclined orbit's Ω. Engineers exploit it to make sun-synchronous orbits.","shelf"],
 // --- orbit regimes
 ["Low Earth Orbit (LEO)","—","~200–2,000 km altitude; period 1.5–2 h. ISS, Hubble, Starlink, most Earth imaging.","shelf"],
 ["Very Low Earth Orbit (VLEO)","—","Below ~250–300 km. Sharper imaging, heavy drag, short life without constant reboost.","shelf"],
 ["Medium Earth Orbit (MEO)","—","~2,000–35,786 km; 2–24 h periods. Navigation constellations (GPS 20,200 km, 12 h).","shelf"],
 ["Geosynchronous orbit (GSO)","—","Any orbit with a one-sidereal-day period (23 h 56 min). The satellite returns to the same sky position daily; if inclined it traces a figure-8 ground track.","shelf"],
 ["Geostationary orbit (GEO)","Clarke orbit","The special geosynchronous orbit that is also circular and equatorial (i = 0), at 35,786 km altitude (42,164 km radius), so the satellite appears fixed. TV and weather satellites.","shelf"],
 ["Geostationary transfer orbit (GTO)","—","The elliptical Hohmann leg from LEO up to GEO: perigee ~200–300 km, apogee 35,786 km. Circularized by an apogee kick burn.","fuel"],
 ["Highly elliptical orbit (HEO)","Molniya · Tundra","Very stretched orbits that linger near apogee over high latitudes for hours. Used for Russian comms and some early-warning satellites.","shelf"],
 ["Sun-synchronous orbit (SSO)","—","A near-polar LEO (~98° inclination) whose plane precesses once a year (via J₂) so it passes over any spot at the same local solar time. Consistent lighting for cameras.","shelf"],
 ["Polar orbit","—","Inclination near 90°; passes over both poles, so Earth rotates underneath and the whole surface is eventually covered.","shelf"],
 ["Ground track","—","The path a satellite's sub-point traces on the Earth's surface. A sinusoid for inclined LEO, a point for GEO, a figure-8 for inclined GSO.","shelf"],
 ["Sidereal day","—","Earth's true rotation relative to the stars: 23 h 56 min 4 s. The GSO period. The 24-h solar day includes Earth's progress around the Sun.","shelf"],
 ["Footprint / coverage area","field of view (FOV) · swath","The patch of Earth a satellite can see or communicate with at one moment. Grows with altitude.","shelf"],
 ["Constellation","—","A set of satellites in coordinated orbits that function as one system (GPS, Iridium, Starlink). Arranged in several orbital planes so coverage is continuous.","shelf"],
 ["Orbital plane (constellation sense) · Walker constellation","—","Constellations spread satellites over several planes at the same inclination; 'Walker' is the standard way of describing that arrangement (e.g. GPS ≈ 6 planes × 4 satellites).","shelf"],
 ["Revisit time","—","How long until a satellite (or constellation) sees the same spot again. Shorter with more satellites or higher altitude.","shelf"],
 // --- transfers & flybys
 ["Delta-v (Δv)","velocity change · 'the fuel bill'","Total change in speed a maneuver or mission requires (km/s). Converts to propellant mass through the rocket equation.","fuel"],
 ["Impulsive burn","impulsive maneuver","An engine firing treated as instantaneous. Hohmann assumes two of them.","fuel"],
 ["Hohmann transfer","minimum-energy two-impulse transfer","Half an ellipse tangent to both the starting and target orbit, 180° apart, two prograde burns. Cheapest two-burn transfer between coplanar circular orbits (for radius ratios under ~11.9).","fuel"],
 ["Bi-elliptic transfer","—","A three-burn alternative that goes far out and comes back. Beats Hohmann only for very large radius ratios. Named so you recognize it.","fuel"],
 ["Circularization burn","apogee kick","The second burn of a Hohmann: at apoapsis, speed up to round the ellipse into the target circle.","fuel"],
 ["Plane change","inclination change","A burn to tilt the orbital plane. Very expensive: Δv = 2v·sin(Δi/2). Done at apogee where v is small.","fuel"],
 ["Lambert's problem","—","Given two position vectors and the time of flight between them, find the orbit that connects them (and so the Δv). The core of trajectory design.","fuel"],
 ["Time of flight (TOF)","transfer time","Duration of a transfer. For a Hohmann, half the transfer ellipse's period: π√(a³/μ).","fuel"],
 ["Synodic period","launch-window spacing","Time between successive identical Earth–target alignments: Earth–Mars ≈ 780 days (26 months).","fuel"],
 ["Launch window","—","The span of dates when a transfer is possible within the available Δv. Opens roughly every synodic period.","fuel"],
 ["Phase angle","lead angle","How far ahead (or behind) the target planet must be at departure so it's there on arrival. Mars Hohmann: ~44° ahead.","fuel"],
 ["Patched conics","conic approximation","Approximating an interplanetary trajectory as a chain of two-body conics: Earth-centered hyperbola → Sun-centered ellipse → target-centered hyperbola, 'patched' at the sphere-of-influence boundaries.","fuel"],
 ["Sphere of influence (SOI)","—","The region around a planet where its gravity dominates the Sun's for trajectory purposes. Earth's ≈ 925,000 km.","fuel"],
 ["Hyperbolic excess velocity (v∞)","—","Your speed relative to a planet when far from it, before capture or after escape. The 'in' and 'out' speed of a flyby, equal in magnitude in the planet's frame.","flyby"],
 ["Characteristic energy (C3)","launch energy","C3 = v∞² at Earth departure (km²/s²). C3 = 0 is bare escape; Mars needs ~10–15.","fuel"],
 ["Gravity assist","flyby · swing-by · slingshot","Passing close to a moving planet so its gravity bends your path; in the Sun's frame you gain (pass behind) or lose (pass in front) speed, borrowed from the planet's orbital motion.","flyby"],
 ["Turning angle (δ)","deflection angle","How much a flyby bends your direction. Larger for slower approaches and closer passes.","flyby"],
 ["Periapsis of the flyby","closest approach · flyby altitude","How close you pass the planet during a gravity assist. Closer = more bend, up to the atmosphere limit.","flyby"],
 ["Capture burn","orbit insertion · OI","The retrograde burn at arrival that slows a spacecraft enough for the planet's gravity to hold it. Flybys skip it.","fuel"],
 ["Aerobraking / aerocapture","—","Using a planet's upper atmosphere to shed speed instead of fuel (gradually, over many passes = aerobraking; in one pass = aerocapture, not yet flown).","fuel"],
 ["Tsiolkovsky rocket equation","ideal rocket equation","Δv = Iₛₚ·g₀·ln(m₀/m_f). Links fuel fraction to Δv; why fast transfers are impossible. Coming in the propulsion section.","fuel"],
 // --- mission design & spacecraft
 ["Payload","—","The part of the spacecraft that does the mission: instrument, camera, antenna, experiment.","fall"],
 ["Bus (spacecraft bus)","platform","Everything that keeps the payload alive and pointed: structure, power, thermal, propulsion, attitude control, comms, computer.","fall"],
 ["Subsystem","—","One functional slice of the bus: EPS (power), TCS (thermal), ADCS (attitude), C&DH (computer), TT&C (telemetry, tracking & command), propulsion, structure.","fall"],
 ["ADCS","attitude determination and control system · AOCS (with orbit control)","Sensors and actuators that find and hold the spacecraft's pointing. Section 6.","fall"],
 ["Attitude","orientation · pointing","Which way the spacecraft is facing. Not altitude (height).","fall"],
 ["Mission requirements / constraints","—","Requirements: what the mission must achieve. Constraints: limits it must live within (mass, cost, launch vehicle, schedule).","fall"],
 ["Mass / power / Δv / link budget","budgets","Ledgers of how much of a resource you have versus need. Every subsystem draws on them.","fall"],
 ["Flyby / orbiter / atmospheric probe / lander / rover / penetrator (impactor)","mission types · spacecraft classes","The ladder of ways to visit a body, in order of increasing Δv, risk and science return.","fuel"],
 ["Entry, descent and landing (EDL)","—","The sequence from atmospheric entry to touchdown for a lander or rover.","fuel"],
 ["Observatory spacecraft","space telescope","A spacecraft whose target is the sky rather than a body: Hubble, JWST, Kepler.","shelf"],
 ["Relay satellite","data relay · comms relay","A spacecraft that forwards signals between other spacecraft and Earth: Mars orbiters for rovers, TDRS for the ISS, Queqiao for the far side of the Moon.","shelf"],
 // --- environment
 ["Vacuum (hard vacuum)","—","Pressure so low that gas effects vanish: no convection, no pressure support, no damping, no discharge path.","vac"],
 ["Outgassing","—","Release of trapped gas and volatiles from materials in vacuum. Measured as TML (total mass loss) and CVCM (collected volatile condensable material); spacecraft materials must stay under 1% and 0.1%.","vac"],
 ["Bake-out","—","Heating components in a vacuum chamber before launch so they outgas on the ground instead of in orbit.","vac"],
 ["Contamination (molecular / particulate)","—","Outgassed films (molecular) and dust (particulate) landing on optics and sensors. The real reason to keep outgassing materials away from instruments.","vac"],
 ["Clean room (ISO class)","—","A filtered-air facility rated by particles per cubic meter: ISO 8 is ordinary spacecraft assembly, ISO 5–6 for sensitive optics.","vac"],
 ["Ultraviolet (UV) photodegradation","UV degradation","Breaking of chemical bonds in polymers by UV photons whose energy exceeds the bond energy (~4 eV at 300 nm vs ~3.6 eV for C–C).","vac"],
 ["Photon","—","A packet of light. Energy rises as wavelength shortens; UV photons carry enough to break bonds, visible ones don't.","vac"],
 ["Bond dissociation energy","bond energy","Energy needed to snap one chemical bond, a few eV. The threshold UV and atomic oxygen have to beat.","vac"],
 ["Polymer","plastic · organic material","Long-chain carbon-based material: Kapton, Mylar, Teflon, epoxies, paints. Vulnerable to UV and atomic oxygen.","vac"],
 ["Kapton","polyimide film","The gold-colored insulation film all over spacecraft. The textbook atomic-oxygen victim unless coated.","air"],
 ["Multilayer insulation (MLI)","thermal blanket","Stacks of thin reflective film that slow radiative heat loss. The crinkly gold/silver wrapping on spacecraft.","vac"],
 ["Radiator","—","A panel that dumps the spacecraft's waste heat into space by radiation, the only heat exit in vacuum.","vac"],
 ["Conduction / convection / radiation","three modes of heat transfer","Through solids by contact / by moving fluid / by electromagnetic emission. Vacuum removes convection.","vac"],
 ["Damping","energy dissipation","Anything that drains a vibration's energy. Air does it for free on Earth; in vacuum only internal material damping remains, and it's small.","vac"],
 ["Spacecraft charging","surface charging · electrostatic discharge (ESD)","Build-up of electric charge on surfaces with no path to bleed it off, until it arcs. Mitigated by conductive coatings and bonding (grounding straps).","vac"],
 ["Newton's first law","law of inertia","An object keeps its state of motion unless a net force acts. In vacuum there's nothing to supply that force, so motion and rotation persist.","vac"],
 // --- atmosphere
 ["Troposphere / stratosphere / mesosphere / thermosphere / exosphere","atmospheric layers","Temperature-defined layers: 0–11 km / 11–50 / 50–90 / 90–500 / 500+. Boundaries are the 'pauses' (tropopause etc.).","air"],
 ["Homosphere / heterosphere","—","Below ~100 km the air is mixed to a uniform composition (homosphere). Above, gases separate by molecular weight (heterosphere).","air"],
 ["Turbopause","homopause","The ~100 km boundary where turbulent mixing stops and diffusive separation begins.","air"],
 ["Ozone (O₃) / ozone layer","—","Three-atom oxygen, concentrated 15–35 km in the stratosphere, absorbing UV below ~0.3 µm. Earth's sunscreen and the stratosphere's heater.","air"],
 ["Atomic oxygen (AO, O)","—","Single oxygen atoms produced by UV photodissociation of O₂ above ~100 km; the dominant species ~200–600 km. Highly reactive; erodes polymers at orbital velocity.","air"],
 ["Photodissociation","—","Light breaking a molecule apart. O₂ + UV → O + O.","air"],
 ["Erosion yield","—","Volume of material removed per incoming atomic-oxygen atom (cm³/atom). Kapton ≈ 3×10⁻²⁴; used as the reference material.","air"],
 ["Fluence","—","Total number of atoms (or particles) that hit a surface over time, per cm². Erosion = fluence × erosion yield.","air"],
 ["Ram / wake","—","Ram: the side facing the direction of motion, which takes the atomic-oxygen and drag hits. Wake: the sheltered trailing side.","air"],
 ["Atmospheric drag","aerodynamic drag","Resistance from residual air in LEO that slowly lowers the orbit. Grows with solar activity; the ISS reboosts to counter it.","air"],
 ["Ionosphere","—","~60–1,000 km, overlapping the upper layers: solar UV and X-rays ionize atoms, leaving free electrons that refract and reflect radio and delay GPS signals.","air"],
 ["Number density","numerical density","Particles per unit volume (m⁻³). The y-axis of the composition chart, on a log scale.","air"],
 ["Solar activity (F10.7, Ap)","space weather indices","Measures of the Sun's radio output and geomagnetic disturbance. High activity heats and puffs up the thermosphere, increasing drag.","air"],
 ["Anomalous oxygen","hot oxygen","A minor population of extra-energetic O atoms included in atmosphere models above ~300 km.","air"],
 ["Geocorona","—","The faint hydrogen halo of the exosphere, glowing in UV, extending tens of thousands of km.","air"],
 // --- course vocabulary (every word the lectures used)
 ["altitude","—","height above the ground, not from Earth's center. GEO is 35,786 km altitude ; its distance from the center is that plus Earth's 6,371 km radius.","shelf"],
 ["astronomical satellite","space telescope","a telescope in space pointed away from Earth (Hubble, JWST). Looks out.","shelf"],
 ["Earth observation (EO)","—","cameras and radar pointed down at Earth for mapping, farming, disasters (Landsat). Looks down.","shelf"],
 ["weather satellite","—","looks down at clouds and storms, usually from GEO so it watches the same region nonstop (GOES).","shelf"],
 ["reconnaissance satellite","spy sat","a military spy satellite. Same idea as Earth observation, different customer and classified detail.","shelf"],
 ["navigation satellite","—","broadcasts a precise time signal; your phone hears four of them and works out where it is (GPS, Galileo). Tells you where you are.","shelf"],
 ["communication satellite","comms / relay","a radio relay in the sky: receives a signal from one place on Earth and sends it back down somewhere else (Starlink, DirecTV). A mirror for radio.","shelf"],
 ["biosatellite","—","carries living things (plants, animals, cells) to study how they cope with space. Sputnik 2 carried Laika the dog in 1957.","shelf"],
 ["space station","—","a satellite people live in (ISS, China's Tiangong).","shelf"],
 ["eclipse (orbital)","—","when Earth blocks the Sun from the satellite. LEO sats get ~15 a day; batteries have to cover them.","shelf"],
 ["interplanetary","—","between planets. An interplanetary spacecraft leaves Earth's neighborhood entirely, as opposed to a satellite that stays in Earth orbit.","fuel"],
 ["communications spacecraft","relay","a relay whose job is passing messages between other spacecraft and Earth. Mars orbiters relay for the rovers; China's Queqiao relays for the far side of the Moon.","fuel"],
 ["braking burn","capture burn","firing the engine against your direction of travel when you arrive, to slow down enough for the planet's gravity to hold you. A flyby skips this; an orbiter can't.","fuel"],
 ["EDL","entry, descent, landing","Entry, Descent, Landing: the sequence a lander or rover goes through from hitting the top of the atmosphere to touching down. On Mars it's ~7 minutes and fully automatic. \"Seven minutes of terror.\"","fuel"],
 ["C3","characteristic / launch energy","a number for how hard you have to throw a spacecraft to leave Earth and reach a target, in km²/s². Bigger C3 = bigger rocket. Earth escape is C3 = 0; Mars needs ~10–15; Pluto direct needed far more.","fuel"],
 ["Kuiper Belt","—","the ring of icy bodies beyond Neptune. Pluto is the biggest known member. New Horizons kept flying into it after Pluto.","fuel"],
 ["comet vs asteroid","—","a chunk of ice and dust that grows a tail when it nears the Sun. Rosetta orbited one and dropped the Philae lander onto it.","fuel"],
 ["wavelength","—","the size of one ripple of a light wave. Shorter wavelength = more energy = more damage. UV is shorter than visible light. Small ripples hit harder.","vac"],
 ["µm (micrometer)","micron","one millionth of a meter. 0.3 µm = 300 nm. A human hair is ~70 µm. The caption said \"millimeters\": wrong by 1,000×.","vac"],
 ["organic chemical bond","bond energy","the \"glue\" between carbon atoms that holds those chains together. Takes a certain amount of energy to break. UV has more than that amount, so it snaps the glue.","vac"],
 ["degradation / decomposition","—","the material slowly falling apart: going brittle, yellowing, cracking, flaking. Like a garden hose left in the sun for 5 years.","vac"],
 ["corrosion","—","chemical attack on a material, like rust on iron. The instructor used it loosely for UV damage; strictly, UV damage is bond-breaking, not corrosion. Rust = corrosion. Sun-rotted plastic = degradation.","vac"],
 ["UV photodegradation","UV degradation","Breaking of chemical bonds in polymers by UV photons whose energy exceeds the bond energy (~4 eV at 300 nm vs ~3.6 eV for C–C). Also called: UV degradation","vac"],
 ["TML / CVCM","—","Total Mass Loss and Collected Volatile Condensable Material: the two numbers a material gets from a standard outgassing test (heated in vacuum for 24 hours). TML is how much of its mass escapes as gas; CVCM is how much of that gas condenses on a cold plate nearby, which is what would fog a lens. Spacecraft materials must stay under 1% TML and 0.1% CVCM. The 'how much will this thing sweat in space' report card.","vac"],
 ["void","—","a tiny bubble or pocket inside a material left over from manufacturing, usually full of air. A bubble in a cake.","vac"],
 ["pressure difference","—","one side pushing harder than the other. Air trapped in a void pushes out at 1 atmosphere; vacuum pushes back with nothing. A balloon taken up a mountain swells for the same reason.","vac"],
 ["dissipation","damping","energy leaking away into the surroundings until the motion stops. The reason a plucked guitar string goes quiet.","vac"],
 ["Newton's 1st law","inertia","a thing keeps doing what it's doing (moving or sitting still) unless something pushes on it. On Earth, air and friction are the \"something.\" In space, there isn't one.","vac"],
 ["MLI","multilayer insulation","Stacks of thin reflective film that slow radiative heat loss. The crinkly gold/silver wrapping on spacecraft. Also called: thermal blanket","vac"],
 ["equilibrium / hot spot","—","Thermal equilibrium is when heat has spread out so everything sits at the same temperature. A hot spot is a place where heat has piled up and not spread yet. On Earth convection evens hot spots out; in vacuum they stay hot until conduction or radiation slowly moves the heat. A pan on the stove: the whole pan warms evenly in air; in vacuum only the spot over the flame would glow.","vac"],
 ["electrical discharge","ESD","built-up charge suddenly jumping somewhere: a spark. The zap from a doorknob after walking on carpet.","vac"],
 ["passive vs active system","—","Passive: works with no power and no decisions, by its nature (a coating, a grounding strap, a radiator, a thermal blanket). Active: does something on command, using power (a heater, a reaction wheel, a thruster, a charge-bleeding device). Engineers prefer passive where possible because it can't fail by losing power. A window shade vs. air conditioning.","vac"],
 ["atmosphere","—","the blanket of gas held around a planet by gravity. Thick at the bottom, fading to nothing a few hundred km up. Earth's air, all of it.","air"],
 ["log scale","—","the chart's vertical axis where each tick (10¹⁰, 10¹⁵, 10²⁰) is 100,000× the one below. Used when numbers span huge ranges. Zooming out so a mountain and a pebble fit on one page.","air"],
 ["constituent","component","one of the gases the air is made of. Ingredients.","air"],
 ["N₂ / O₂ / Ar / CO₂","—","nitrogen gas (two N atoms), oxygen gas (two O atoms), argon. The three main ingredients of normal air: 78%, 21%, 1%.","air"],
 ["O / N / H / He","atomic forms","single atoms of oxygen, nitrogen, hydrogen, and helium gas. The \"atomic\" forms. Up high, radiation breaks the paired molecules into these singles. Loose Lego bricks instead of snapped-together pairs.","air"],
 ["reactive","—","eager to bond chemically with other stuff. Sticky.","air"],
 ["oxidation","—","oxygen bonding to a material and changing it. Rust is iron oxidizing. Atomic oxygen oxidizes spacecraft surfaces; here \"corrosion\" is the right word. Rust, but in orbit, and fast.","air"],
 ["kinetic energy / relative velocity","—","kinetic energy = energy of motion. Relative velocity = how fast two things approach each other; it doesn't matter which one is \"really\" moving. The s/c at 7.5 km/s hitting a still atom is the same as the atom hitting a still s/c at 7.5 km/s.","air"],
 ["eV (electron-volt)","—","a tiny unit of energy used for single atoms and bonds. A chemical bond is a few eV; an atomic-oxygen hit at 7.5 km/s carries ~5 eV. Enough to snap the bond.","air"],
 ["F10.7 / Ap","space weather indices","two numbers on the chart title describing how active the Sun and Earth's magnetic field were for the model run. The atmosphere puffs up when the Sun is active. Ignore the values.","air"],
 ["celestial body","—","any big natural object in space: planet, moon, Sun, asteroid, comet. The thing you orbit.","hoop"],
 ["perihelion / aphelion","—","The closest and farthest points of an orbit around the Sun. Same idea as perigee and apogee, with the suffix changed for the body: -gee for Earth, -helion for the Sun, -lune for the Moon, -apsis for anything. Earth's own perihelion is in early January, about 147 million km from the Sun; aphelion in early July, about 152 million km. Perigee and apogee, Sun edition.","hoop"],
 ["plane of reference","—","the flat sheet you measure tilt from. Equator for Earth orbits, ecliptic for Sun orbits.","hoop"],
 ["RAAN (Ω)","longitude of ascending node","Angle, measured in the reference plane from the vernal equinox (♈), to the point where the orbit crosses the plane heading north. Also called: longitude of the ascending node · 'swivel'","hoop"],
 ["circular / elliptical / hyperbolic","—","orbit shapes by e: circle (e = 0), ellipse (0 1, an open swing-past like a flyby).","hoop"],
 ["μ (gravitational parameter)","GM","The body's mass times the gravitational constant, in one number: Earth μ = 398,600 km³/s². Shows up in every orbit formula. Also called: GM · 'mu'","hoop"],
 ["rotation period","—","how long one full trip around takes. LEO ~90 min, GPS 12 h, GEO 24 h. Higher = longer. Bigger circle, slower runner.","shelf"],
 ["altitude vs distance from center","—","height above the ground, not from Earth's center. GEO is 35,786 km altitude ; its distance from the center is that plus Earth's 6,371 km radius.","shelf"],
 ["coverage / global coverage","—","Coverage is the patch of Earth a satellite can see or talk to at a given moment (its footprint). Global coverage means every point on Earth is covered all the time, which one satellite can never do and a constellation can. A flashlight's circle of light vs. a stadium's floodlights.","shelf"],
 ["resolution","—","How much detail an instrument can make out: the smallest thing it can tell apart. Depends on the optics and on distance, so a LEO camera can see a car while a GEO weather camera sees whole storm systems. Higher orbit = bigger coverage but lower resolution. Reading a street sign from 10 feet vs. from a mile.","shelf"],
 ["Iridium","—","A company and its satellite constellation: 66 active satellites at about 780 km in six near-polar orbital planes, giving satellite-phone and data coverage everywhere on Earth including the poles and oceans. Named for element 77 because the original plan had 77 satellites. The swarm that makes a sat phone work in the middle of the ocean.","shelf"],
 ["data relay / transfer time","—","Data relay is passing information from one spacecraft to another or down to Earth, often through a dedicated relay satellite. Transfer time is how long the signal takes; radio travels at light speed, so it grows with distance: ~0.12 s one way to GEO, 4–24 minutes to Mars. Higher orbits mean longer delay. A game of telephone across the solar system, with real lag.","shelf"],
 ["trade-off","compromise","Giving up some of one good thing to get more of another, because you can't have all of both. Orbit choice is a trade-off: higher gets you coverage and costs you detail and delay; lower gets you detail and costs you coverage and lifetime. Engineering is mostly choosing trade-offs on purpose. A big truck vs. a sports car: you don't get both.","shelf"],
 ["input / constraint","—","what you feed into a calculation / a limit you can't break (rocket size, fuel mass, time). Repeat.","flyby"],
 ["tangent","—","just touching, not crossing. The Hohmann ellipse is tangent to both circles, which is why the burns are small: you're already moving along the right line.","flyby"],
 ["optimal / efficient","—","in this lecture, always means \"least Δv,\" i.e. least fuel. Not fastest.","flyby"],
 ["gravity field","—","the region around a planet where its pull matters. It's what bends the flyby path.","flyby"],
 ["relative velocity","—","your speed as seen from something else (Mars, say) rather than from the Sun. The flyby doesn't change your speed relative to Mars, only relative to the Sun. Repeat.","flyby"],
 ["vector / magnitude / direction","—","an arrow: a quantity with both a size and a direction. Velocity is a vector. The slide's arrow pictures are vector addition: spacecraft-relative-to-Mars plus Mars-relative-to-Sun equals spacecraft-relative-to-Sun. Two pushes added tip to tail.","flyby"],
 ["v∞ (hyperbolic excess velocity)","—","Your speed relative to a planet when far from it, before capture or after escape. The 'in' and 'out' speed of a flyby, equal in magnitude in the planet's frame.","flyby"],
 ["deep space","—","far beyond Earth and the Moon; the outer planets and beyond.","flyby"],
 // --- attitude (preview)
 ["Disturbance torque","perturbing torque","A small twisting force on a spacecraft: gravity-gradient, solar radiation pressure, aerodynamic, magnetic.","vac"],
 ["Reaction wheel / momentum wheel / control moment gyro (CMG)","—","Internal spinning masses used to turn or stabilize a spacecraft without fuel; CMGs tilt a spinning wheel for much larger torque.","vac"],
 ["Momentum dumping","desaturation · momentum unloading","Using thrusters or magnetorquers to let saturated reaction wheels spin back down.","vac"],
 ["Star tracker / sun sensor / magnetometer / gyroscope","attitude sensors","Instruments that determine pointing: star patterns, Sun direction, Earth's field, rotation rate.","vac"],
 ["Magnetorquer","torque rod","An electromagnet that pushes against Earth's magnetic field to produce small torques. LEO only, no propellant.","vac"],
 // --- Section 4 · propulsion (added 2026-11-12)
 ["Space propulsion","spacecraft propulsion · in-space propulsion","Any system that changes a spacecraft's velocity. Almost always by throwing mass backward to make thrust.","prop"],
 ["Thrust (F)","—","The force an engine produces, in newtons. F = ṁ × vₑ: mass thrown per second times exhaust speed.","prop"],
 ["Newton's third law","action–reaction · the reaction principle","Every force has an equal and opposite partner. Push gas backward and the gas pushes the ship forward. The reason rockets work in vacuum.","prop"],
 ["Conservation of momentum","—","Mass × velocity, added up over ship and exhaust, never changes. The bookkeeping behind thrust.","prop"],
 ["Propellant","reaction mass · working fluid","The material an engine throws out to make thrust. In a chemical rocket it is fuel plus oxidizer.","prop"],
 ["Reaction engine","—","Any engine that works by throwing mass backward: rockets, ion thrusters, jets.","prop"],
 ["Exhaust velocity (vₑ)","velocity of ejection · effective exhaust velocity","How fast the propellant leaves the engine, relative to the ship. The engine's quality in one number.","prop"],
 ["Mass flow rate (ṁ)","m-dot · propellant flux","Kilograms of propellant leaving per second.","prop"],
 ["Standard gravity (g₀)","g-zero · g-nought","9.80665 m/s², the pull of gravity at Earth's surface, used as a fixed constant to turn exhaust speed into seconds.","prop"],
 ["Chemical propulsion","chemical rocket · 'chemical internal heat engine'","Engines whose energy comes from burning the propellant itself. Huge thrust, Isp 250–450 s.","prop"],
 ["Bipropellant","biprop · fuel + oxidizer","An engine that burns two propellants together. Hydrogen + oxygen, kerosene + oxygen, hydrazine fuel + nitrogen tetroxide.","prop"],
 ["Monopropellant","monoprop","One liquid that breaks down on a catalyst and makes hot gas with no burning partner. Hydrazine is the classic; Isp about 225 s.","prop"],
 ["Fuel / oxidizer","oxidiser","The part that burns / the part that supplies the oxygen. Together they are the propellant.","prop"],
 ["LH₂ / LOX","liquid hydrogen / liquid oxygen","The highest-performing common propellant pair (Isp ~450 s). Both cryogenic: −253 °C and −183 °C.","prop"],
 ["RP-1","rocket-grade kerosene","Refined kerosene. Dense, room temperature, Isp around 300–350 s with LOX. Burned by Saturn V's first stage and Falcon 9.","prop"],
 ["Cryogenic propellant","cryogen","A propellant that must be kept extremely cold to stay liquid. Boils off over days, so rarely used on long missions.","prop"],
 ["Hypergolic propellants","storable propellants","Fuel and oxidizer that ignite on contact and keep for years in tanks. What most spacecraft carry for their main engine.","prop"],
 ["Hydrazine","N₂H₄","The standard storable spacecraft propellant, used alone as a monopropellant or as the fuel half of a bipropellant. Toxic.","prop"],
 ["Turbopump","the slide's 'pressure pump'","A turbine-driven pump that forces propellant into the high-pressure chamber. The F-1's was 41 MW.","prop"],
 ["Pressure-fed","—","No pump: high-pressure gas in the tanks pushes the propellant into the engine. Simple; used on small engines.","prop"],
 ["Combustion chamber","thrust chamber","Where the propellants mix and burn, at roughly 3,300 K and 100–300 bar.","prop"],
 ["Throat","—","The narrowest point of the nozzle. The gas reaches exactly the speed of sound there.","prop"],
 ["de Laval nozzle","converging–diverging nozzle · bell nozzle","Narrows to a throat, then widens into a bell. Turns the chamber's pressure and heat into exhaust speed.","prop"],
 ["Regenerative cooling","regen cooling","Running the cold fuel through channels in the chamber and nozzle walls before burning it, so the walls survive.","prop"],
 ["Solid rocket motor (SRM)","solid booster","Fuel and oxidizer cast together as one solid block (the grain). Simple and powerful; lights once and can't be shut off.","prop"],
 ["Booster","strap-on","A rocket attached to help at liftoff. A job description, not a propellant type: boosters can be solid or liquid.","prop"],
 ["Staging","stages","Dropping empty tanks and engines on the way up so the rest has less mass to push. A direct consequence of the rocket equation.","prop"],
 ["Thrust-to-weight ratio","T/W","Thrust divided by weight. Above 1, a rocket can lift itself. Chemical engines win this by a wide margin.","prop"],
 ["Electric propulsion (EP)","low-thrust propulsion · solar electric propulsion (SEP)","Engines that use electricity to accelerate propellant. Exhaust at tens of km/s, thrust under a newton, runs for years.","prop"],
 ["Ion thruster","gridded ion engine","Ionizes xenon and fires the ions through charged grids at 30–40 km/s. Isp 3,000–4,000+ s.","prop"],
 ["Hall-effect thruster","Hall thruster","The other main electric engine; uses a magnetic field instead of grids. More thrust than an ion engine, somewhat lower Isp. On Starlink and Psyche.","prop"],
 ["Xenon","Xe","Heavy, non-reactive gas. The usual propellant for ion engines because it ionizes easily and stores densely.","prop"],
 ["Nuclear thermal propulsion (NTP)","nuclear thermal rocket","A fission reactor heats hydrogen, which leaves through a nozzle. Isp about 900 s with high thrust. Ground-tested (NERVA), never flown.","prop"],
 ["Nuclear electric propulsion (NEP)","—","A reactor makes electricity that runs ion or Hall thrusters. Useful far from the Sun, where solar panels fade.","prop"],
 ["Radioisotope thermoelectric generator (RTG)","nuclear battery","Turns the decay heat of plutonium into electricity. Powers Voyager and New Horizons. It is not propulsion.","prop"],
 ["Trade study","trade-off analysis","A formal comparison of design options against the mission's requirements. Here: thrust against specific impulse.","prop"],
 // --- Section 4 · electric propulsion (added 2026-11-12)
 ["Solar electric propulsion (SEP)","—","Electric propulsion powered by solar panels. Nearly all electric propulsion flown so far.","ion"],
 ["Ion","positive ion · cation","An atom with a net electric charge. An atom that has lost an electron is a positive ion, and an electric field can now push it.","ion"],
 ["Ionization","electron-impact ionization · electron bombardment","Knocking an electron off a neutral atom. In an ion thruster a fast electron does it by collision.","ion"],
 ["Ionization energy","ionization potential","The energy needed to remove one electron from an atom. Xenon: 12.1 eV.","ion"],
 ["Plasma","ionized gas · fourth state of matter","Gas in which many atoms have been split into ions and free electrons. Neutral overall, but it responds to electric and magnetic fields.","ion"],
 ["Discharge chamber","ionization chamber","The can inside an ion thruster where the propellant gas is ionized.","ion"],
 ["Hollow cathode","discharge cathode · the slide's 'electron gun'","The device that emits the electrons used to ionize the gas. A second one outside serves as the neutralizer.","ion"],
 ["Cathode / anode","negative / positive electrode","The electrode that gives off electrons and the one that collects them. In the thruster the chamber wall is the anode.","ion"],
 ["Potential difference","voltage (V)","Electrical 'height' between two points. A charge speeds up as it falls through it: energy gained = charge × voltage.","ion"],
 ["Electric field","—","The region around charges where another charge feels a force. Between the thruster's grids it is thousands of volts per millimetre.","ion"],
 ["Ion optics","the grids · grid set","The pair of perforated plates at the end of the chamber that extract and accelerate the ions.","ion"],
 ["Screen grid","the slide's 'positive grid'","The inner grid, held at high positive voltage (about +1,100 V). Ions leave the plasma through its holes.","ion"],
 ["Accelerator grid","accel grid · the slide's 'negative grid'","The outer grid, slightly negative (about −180 V). Pulls the ions through and stops outside electrons flowing back in.","ion"],
 ["Neutralizer","neutralizer cathode · 'neutralizing electron gun'","A cathode outside the engine that emits electrons into the ion beam, matching the ion current so the spacecraft stays uncharged.","ion"],
 ["Electron backstreaming","—","Electrons from outside being pulled back into the engine through the grids. The negative accelerator grid blocks it.","ion"],
 ["Recombination","—","An ion and an electron rejoining into a neutral atom. It happens out in the beam and has no effect on thrust.","ion"],
 ["Ion beam","plume","The stream of fast ions (plus neutralizing electrons) leaving the thruster.","ion"],
 ["Primary propulsion","main propulsion","The system that delivers the mission's main Δv, as opposed to small corrections or pointing.","ion"],
 ["Thrust-to-power ratio","mN per kW","How much thrust an electric engine makes per kilowatt. About 40 mN/kW for an ion engine; higher for Hall thrusters.","ion"],
 ["Low-thrust trajectory","spiral transfer","The path flown under a small continuous push: a slow spiral outward, quite unlike the two short burns of a Hohmann transfer.","ion"],
 ["All-electric satellite","—","A satellite with no chemical main engine; it climbs from transfer orbit to GEO on electric thrusters over about six months.","ion"],
 // --- Section 4 · nuclear propulsion (added 2026-11-12)
 ["Nuclear fission","fission","A heavy atom such as uranium-235 splitting into two lighter ones and releasing a large amount of heat.","nuke"],
 ["Reactor core","core · fuel elements","The hot heart of a reactor, made of fuel elements that hold the uranium. In a nuclear rocket the hydrogen flows through holes in it.","nuke"],
 ["Nuclear fuel","fissile fuel","The uranium that produces the heat. It stays in the reactor; it is not burned and not thrown out.","nuke"],
 ["Working fluid","—","The substance an engine heats and expands to do work. In a nuclear thermal rocket it is the hydrogen, which is also the propellant.","nuke"],
 ["Molecular mass (M)","molar mass · molecular weight","How heavy one molecule is. Hydrogen gas 2, water 18. Lighter exhaust molecules move faster at the same temperature.","nuke"],
 ["Enrichment","uranium enrichment","The share of uranium that is the fissile kind, U-235. Natural uranium has 0.7%.","nuke"],
 ["Low-enriched uranium (LEU)","HALEU for the 5–20% range","Uranium with under 20% U-235. Not bomb-grade, so cheaper and easier to license.","nuke"],
 ["Highly enriched uranium (HEU)","weapons-grade when ~90%+","Uranium with 20% or more U-235. The 1960s nuclear rocket engines used about 93%.","nuke"],
 ["Payload fraction","payload mass fraction","Payload mass divided by total mass. Usually a few percent; higher Isp raises it.","nuke"],
 ["Lift-off mass","gross lift-off mass (GLOW)","Total mass of a rocket as it leaves the pad. For in-space stages the useful figure is the mass placed in low Earth orbit.","nuke"],
 ["Bimodal nuclear thermal rocket","BNTR","A nuclear thermal rocket whose reactor also generates electricity between burns.","nuke"],
 ["Liquid-core / gas-core nuclear rocket","the slide's 'mixing nuclear fuel and the working fluid'","Designs in which the uranium is molten or gaseous, lifting the temperature limit. Isp 1,500–5,000 s on paper; never built.","nuke"],
 ["Nuclear pulse propulsion","Project Orion","Propelling a ship by exploding small nuclear charges behind a pusher plate. Studied 1958–1965; never built.","nuke"],
 ["Radiation exposure","dose","The amount of damaging radiation a crew absorbs. In deep space it comes from cosmic rays and solar storms.","nuke"],
 ["Shadow shield","—","A slab of dense material between a reactor and the rest of the spacecraft, casting a 'shadow' free of its radiation.","nuke"],
 ["Project Rover / NERVA","Nuclear Engine for Rocket Vehicle Application","The US nuclear thermal rocket programme, 1955–1973. About 20 reactors ground-tested in Nevada; none flown.","nuke"],
 ["Interstellar","—","Between stars. The nearest is 4.2 light years, about 40 trillion km, far beyond any engine in this course.","nuke"],
 // --- Section 5 · communications (added 2026-11-12)
 ["Telecommunications","comms · TT&C when it includes tracking and commanding","Sending information over a distance. For a spacecraft: radio links to and from the ground.","comm"],
 ["Electromagnetic wave","EM wave · electromagnetic radiation","A travelling ripple of electric and magnetic field. Needs no medium and moves at the speed of light.","comm"],
 ["Electromagnetic spectrum","—","All electromagnetic waves ordered by frequency: radio, microwave, infrared, visible light, ultraviolet, X-rays, gamma rays.","comm"],
 ["Frequency (f)","—","How many waves pass a point each second, measured in hertz.","comm"],
 ["Hertz (Hz)","kHz · MHz · GHz","One cycle per second. Kilo-, mega- and gigahertz are a thousand, a million and a billion per second.","comm"],
 ["Speed of light (c)","—","299,792 km/s. The speed of every electromagnetic wave in vacuum. c = λ × f.","comm"],
 ["Sinusoid","sine wave","The smooth, endlessly repeating wave shape that a pure single-frequency signal has.","comm"],
 ["Amplitude","—","The height of a wave; how strong the signal is at its peak.","comm"],
 ["Antenna","aerial","A conductor that turns an electrical signal into a radio wave and a radio wave back into an electrical signal.","comm"],
 ["Transmitter / receiver","TX / RX","The electronics that drive the antenna with a signal, and the electronics that amplify and decode what it picks up.","comm"],
 ["Half-wave dipole","dipole antenna","Two rods end to end, half a wavelength long in total. The basic antenna; radiates all around itself.","comm"],
 ["Monopole","quarter-wave antenna · whip","Half of a dipole, a quarter-wavelength rod over a metal surface. Car aerials and Wi-Fi router stubs.","comm"],
 ["Modulation","—","Changing some property of a carrier wave in step with an information signal so the carrier carries it.","comm"],
 ["Carrier signal","carrier wave","The fast, steady wave that is modulated. Its frequency is what you tune to.","comm"],
 ["Information signal","baseband · message signal","The slow signal you actually want to send: voice, picture, data.","comm"],
 ["Amplitude modulation (AM)","—","The carrier's height follows the information signal. Simple, but noise changes height too.","comm"],
 ["Frequency modulation (FM)","—","The carrier's frequency follows the information signal while its height stays constant. Resists static.","comm"],
 ["Phase-shift keying (PSK)","phase modulation · BPSK / QPSK","Sending digital bits by shifting the carrier's timing. What deep-space links and Wi-Fi are built on.","comm"],
 ["Radiation pattern","antenna pattern","The three-dimensional shape of where an antenna sends, or hears from, most strongly.","comm"],
 ["Isotropic antenna","isotropic radiator","An ideal antenna that radiates equally in every direction. Cannot be built; it is the reference for gain.","comm"],
 ["Omnidirectional antenna","omni","Radiates equally in all directions around one axis: a donut pattern. A dipole is one.","comm"],
 ["Directional antenna","—","Sends most of its power one way. Dishes and rooftop TV (Yagi) antennas.","comm"],
 ["Directivity","—","How strongly an antenna concentrates its radiation in its best direction.","comm"],
 ["Antenna gain","gain · dBi","How many times stronger the signal is in the best direction than from an isotropic antenna with the same power.","comm"],
 ["Decibel (dB)","dBi when relative to isotropic","A way of counting multiplications: 3 dB is ×2, 10 dB is ×10, 20 dB is ×100, 30 dB is ×1,000.","comm"],
 ["Main lobe / side lobes","—","The big beam where most of the power goes, and the small unwanted beams beside it.","comm"],
 ["Beamwidth","half-power beamwidth · 3 dB beamwidth","The angle across the main lobe between the points where power has fallen to half.","comm"],
 ["Aperture","—","An antenna's collecting area. The bigger it is in wavelengths, the narrower the beam and the higher the gain.","comm"],
 ["Parabolic antenna","dish · parabolic reflector","A curved reflector that focuses radio waves into a narrow beam, or collects them onto a feed.","comm"],
 ["High-gain antenna (HGA)","—","A spacecraft's narrow-beam dish for high data rates. Must be pointed at Earth.","comm"],
 ["Low-gain antenna (LGA)","—","A wide-beam antenna that works in almost any attitude at a low data rate. Used for backup and safe mode.","comm"],
 ["Polarization","—","The direction in which a wave's electric field swings. The receiving antenna must match it.","comm"],
 ["CubeSat","—","A very small satellite built from 10 cm cubes, typically with deployable rod antennas.","comm"],
 // --- Section 5 · atmosphere + bands (added 2026-11-12)
 ["Atmospheric opacity","its opposite: transmittance","The share of incoming radiation the atmosphere stops, as a function of wavelength.","win"],
 ["Atmospheric window","optical window · radio window","A range of wavelengths the atmosphere lets through. Visible light is one; radio from about 1 cm to 10 m is the other.","win"],
 ["Photon energy","E = h × f","The energy of one photon: the Planck constant times frequency. It decides what the wave can do to matter.","win"],
 ["Planck constant (h)","—","6.626 × 10⁻³⁴ joule-seconds. The fixed number that converts a frequency into an energy.","win"],
 ["Absorption","—","A photon handing its energy to an atom or molecule and ceasing to exist.","win"],
 ["Gamma rays / X-rays","—","The highest-frequency electromagnetic waves. Completely absorbed by the upper atmosphere.","win"],
 ["Infrared (IR)","thermal radiation","Wavelengths just longer than red light. Mostly absorbed by water vapour and carbon dioxide.","win"],
 ["Microwave","—","The short-wavelength end of radio, roughly 1 to 100 GHz. Where satellites and Wi-Fi operate.","win"],
 ["Ionospheric reflection","skywave · skip","Long radio waves being turned back by the free electrons of the ionosphere.","win"],
 ["Critical frequency","plasma frequency of the ionosphere","The frequency below which the ionosphere reflects radio waves. About 9 × √(electron density) hertz, typically near 10 MHz.","win"],
 ["Radio-frequency bands","ITU bands · VLF to EHF","The decade-by-decade names: VLF, LF, MF, HF, VHF, UHF, SHF, EHF. Each covers ten times the frequency of the one before.","win"],
 ["Super high frequency (SHF)","centimetre waves","3 to 30 GHz. The band where most satellite and deep-space links operate.","win"],
 ["Letter bands","IEEE radar bands","L, S, C, X, Ku, K, Ka: named slices between 1 and 40 GHz. The letters are historical code names with no meaning.","win"],
 ["S-band","—","2 to 4 GHz. Spacecraft command and telemetry near 2.1–2.3 GHz; Wi-Fi and Bluetooth at 2.4 GHz.","win"],
 ["X-band","—","8 to 12 GHz. The standard deep-space band: uplink about 7.2 GHz, downlink 8.4 GHz.","win"],
 ["Ka-band","K-above","27 to 40 GHz. The newest deep-space band, about 32 GHz down: more gain and data, more weather loss.","win"],
 ["Uplink","forward link","The radio link from Earth to the spacecraft: commands.","win"],
 ["Downlink","return link","The radio link from the spacecraft to Earth: telemetry and science data.","win"],
 ["Deep space (radio definition)","—","In the frequency rules, anything farther than 2 million km from Earth. It has its own protected bands.","win"],
 ["International Telecommunication Union (ITU)","—","The United Nations agency that coordinates who may use which radio frequencies.","win"],
 ["Frequency allocation","spectrum allocation","The international assignment of each band to particular uses, so users do not interfere.","win"],
 ["Rain fade","rain attenuation","The weakening of radio signals by rain and water vapour. Small at S and X-band, serious at Ka-band.","win"],
 ["Greenhouse effect","—","Infrared radiated by the ground being absorbed by water vapour and CO₂. The same absorption that closes the infrared window.","win"],
 // --- Section 5 · links (added 2026-11-12)
 ["Communications link","radio link","One complete radio path from a transmitter to a receiver.","link"],
 ["Space segment / ground segment","—","The satellite part of a system and the Earth-station part.","link"],
 ["Encoder / decoder","codec","Turns information into a compact, protected digital code, and turns it back at the far end.","link"],
 ["Source coding","compression","Removing repetition and waste so the same information takes fewer bits.","link"],
 ["Channel coding","forward error correction (FEC) · error-correcting code","Adding structured spare bits so the receiver can detect and repair errors without a resend.","link"],
 ["Modem","modulator + demodulator","The pair of devices that write a signal onto a carrier and recover it.","link"],
 ["Up-converter","frequency converter · mixer","Shifts a modulated signal to a higher frequency for transmission without altering what it carries.","link"],
 ["Down-converter","—","Shifts a received signal back down to an easy frequency for demodulation.","link"],
 ["Intermediate frequency (IF)","—","The convenient fixed frequency where modulation and demodulation are done, such as 70 MHz.","link"],
 ["High-power amplifier (HPA)","power amplifier · TWTA when it is a travelling-wave tube","The final amplifier before the transmit antenna. Its job is output power.","link"],
 ["Low-noise amplifier (LNA)","—","The first amplifier after the receive antenna, designed to add as little noise as possible.","link"],
 ["Free-space path loss (Lₛ)","spreading loss · space loss","The reduction in received power because the wave spreads over a growing sphere: (4πd ÷ λ)².","link"],
 ["Atmospheric loss (Lₐ)","atmospheric attenuation","Signal weakening by the air and rain. Small in the radio window, larger at Ka-band.","link"],
 ["Transponder","satellite repeater","Equipment that receives a signal, shifts its frequency, amplifies it and retransmits it.","link"],
 ["Bent-pipe relay","transparent repeater","A satellite that only relays what it hears without decoding it.","link"],
 ["Thermal noise","Johnson noise","Random electrical noise produced by heat in every circuit and every warm object in view.","link"],
 ["Noise power density (N₀)","N-zero","Noise power in each hertz of bandwidth: k × T.","link"],
 ["Boltzmann constant (k)","—","1.38 × 10⁻²³ joules per kelvin. Converts a temperature into a noise power.","link"],
 ["System noise temperature (T)","T_sys","One temperature that stands for all the noise in a receiving station. About 20 K for a Deep Space Network dish.","link"],
 ["Signal-to-noise ratio (S/N₀)","SNR · C/N₀","Received signal power compared with noise. It decides how many bits per second a link can carry.","link"],
 ["EIRP","effective isotropic radiated power","Transmitter power × transmit antenna gain: how strong the transmitter appears along its beam.","link"],
 ["G/T","G over T · figure of merit","Receive antenna gain divided by system noise temperature: the quality of a receiving station.","link"],
 ["Link budget","—","The ledger of every gain and loss between transmitter and receiver, normally added up in decibels.","link"],
 ["Link margin","—","The safety allowance left after the link budget is added up.","link"],
 ["dBW / dBm","—","Decibels relative to one watt / to one milliwatt. 0 dBW = 30 dBm.","link"],
 ["Data rate","bit rate · bits per second","How many bits a link delivers each second. Proportional to S/N₀.","link"],
 // --- Section 6 · attitude (added 2026-11-12)
 ["Roll / pitch / yaw","Euler angles","The three rotations: about the direction of travel, about the across-orbit axis, and about the line to the planet.","adcs"],
 ["Reference frame","coordinate frame","The set of directions an orientation is measured against.","adcs"],
 ["Inertial frame","star-fixed frame","A reference frame that does not rotate: fixed relative to the distant stars.","adcs"],
 ["Orbital frame","LVLH · local vertical, local horizontal","A frame that turns with the orbit: one axis to the planet, one along the track, one across the orbit.","adcs"],
 ["Nadir","—","The direction straight down toward the centre of the planet.","adcs"],
 ["Attitude determination","—","Measuring the spacecraft's current orientation from its sensors.","adcs"],
 ["Attitude control","—","Applying torques to bring the spacecraft to the wanted orientation and keep it there.","adcs"],
 ["Attitude error","pointing error","The difference between the measured attitude and the wanted one.","adcs"],
 ["Closed-loop control","feedback control","Control that keeps measuring its own result and correcting it.","adcs"],
 ["Control law","controller","The rule the computer uses to turn an attitude error into a torque command.","adcs"],
 ["Actuator","—","A device that applies a torque or force: reaction wheel, thruster, magnetorquer.","adcs"],
 ["Torque","moment","A twisting effect: force × lever arm, in newton-metres. It changes how fast something spins.","adcs"],
 ["Pointing accuracy / pointing stability","—","How close the pointing is to the target, and how steady it stays.","adcs"],
 ["Attitude jitter","pointing jitter","Small, fast oscillation of the pointing direction, mostly from vibrating parts on board.","adcs"],
 ["Arcsecond","arcsec","One 3,600th of a degree. Telescope pointing is quoted in it.","adcs"],
 ["Moment of inertia (I)","rotational inertia","How hard a body is to spin about a given axis: each bit of mass times the square of its distance from that axis.","adcs"],
 ["Principal axes","major · intermediate · minor axis","The three natural spin axes of a body: largest, middle and smallest moment of inertia.","adcs"],
 ["Angular momentum (L)","—","Amount of rotation: moment of inertia × spin rate. Constant unless an outside torque acts.","adcs"],
 ["Torque-free motion","—","How a body rotates when no outside torque acts on it.","adcs"],
 ["Major-axis rule","maximum-axis rule","A real, slightly flexible body with no outside torque ends up spinning about its axis of maximum moment of inertia.","adcs"],
 ["Flat spin","—","Rotation about the major axis; for a long body, an end-over-end tumble.","adcs"],
 ["Spin stabilization","—","Holding a pointing direction by spinning the whole spacecraft like a top.","adcs"],
 ["Three-axis stabilization","—","Holding all three axes steady with an active control loop and no bulk spin.","adcs"],
 // --- Section 6 · sensors (added 2026-11-12)
 ["Gyroscope","gyro · rate gyro","A sensor that measures how fast the spacecraft is rotating. Classic ones use a spinning rotor in gimbals.","sens"],
 ["Rotor / gimbal","—","The spinning wheel of a mechanical gyroscope, and the pivoting rings that let it keep its direction while the frame turns.","sens"],
 ["Gyro drift","bias drift","The slow build-up of error in a gyro's angle, because the angle is the sum of measured rates.","sens"],
 ["Fibre-optic gyroscope (FOG)","optical gyro · ring laser gyro","A gyroscope with no moving parts that detects rotation by timing light sent both ways round a loop.","sens"],
 ["Inertial measurement unit (IMU)","—","A box of gyroscopes and accelerometers that senses rotation and acceleration on all three axes.","sens"],
 ["Accelerometer","—","A sensor that measures acceleration in a straight line.","sens"],
 ["Sun sensor","coarse / fine Sun sensor","A sensor that measures the direction to the Sun from the currents in small light detectors.","sens"],
 ["Star tracker","star sensor · star camera","A camera that images stars and matches the pattern to a catalogue to give the full orientation.","sens"],
 ["Star catalogue","—","The stored map of star positions a star tracker compares its picture with.","sens"],
 ["Horizon sensor","horizon scanner · Earth sensor","A sensor that finds the edge of the planet's warm disc in infrared and so the direction 'down'.","sens"],
 ["Magnetometer","—","A sensor that measures the direction and strength of the local magnetic field: a three-axis compass.","sens"],
 ["Geomagnetic field model","IGRF","The mathematical map of Earth's magnetic field that magnetometer readings are compared with.","sens"],
 ["GPS attitude determination","—","Finding orientation from the tiny differences in when a GPS signal reaches several antennas on the spacecraft.","sens"],
 ["Absolute sensor / relative sensor","—","One that sees an outside reference (Sun, stars, Earth, field) versus one that only feels change (the gyro).","sens"],
 ["Sensor fusion","Kalman filter","Combining several sensors' readings into one best estimate of the attitude.","sens"],

 ["Gyroscopic stiffness","—","The resistance of a spinning body to having its axis tipped.","act"],
 ["Control moment gyroscope (CMG)","control moment gyro","A constant-speed wheel mounted on a gimbal. Tilting its spin axis produces a large torque.","act"],

 ["Slew rate","agility","How fast a spacecraft can rotate to a new pointing direction, in degrees per second.","act"],
 ["Magnetic dipole moment","—","The strength of a magnet or current-carrying coil, in ampere-square-metres. Torque = dipole × field.","act"],
 ["Reaction control system (RCS)","attitude thrusters","The set of small thrusters used to turn a spacecraft or dump wheel momentum.","act"],
 ["Cold-gas thruster","—","A thruster that simply releases stored pressurized gas, usually nitrogen. Simple and clean, low specific impulse.","act"],

 ["Moment arm","lever arm","The distance from the centre of mass to the line of a force. Torque = force × moment arm.","act"],
 ["Internal torque / external torque","—","A torque exchanged between parts of the spacecraft, versus one from pushing on something outside it. Only external torques change the total angular momentum.","act"],
