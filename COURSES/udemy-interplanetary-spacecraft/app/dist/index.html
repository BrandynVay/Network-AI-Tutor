<style>
/* Layout: one sticky tab bar, one scrolling pane; cards for items, no card for prose. */
:root{
  --bg:#faf4f1; --paper:#fffbf9; --paper2:#f7eeeb; --fg:#2b1d29; --mute:#74606d; --line:#ecdcd8; --line2:#dcc6c2;
  --accent:#e48aa7; --accent-strong:#b13a67; --accent-ink:#2b1d29; --navy:#b13a67; --blue:#1e7cff; --green:#2a7650; --pink:#e5338f; --purple:#7b3fe4; --yellow:#ffd23f;
  --good:#2a7650; --bad:#b13a3a; --warn:#8f5309;
  --f-head:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Charter,Georgia,ui-serif,serif; --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#161118; --paper:#1d1720; --paper2:#241d28; --fg:#f3e8ee; --mute:#a58f9d; --line:#342a38; --line2:#4a3d4f; --accent:#f4a9c1; --accent-strong:#f6b4c9; --accent-ink:#161118; --navy:#f6b4c9; --good:#7fd1a0; --bad:#ff8a8a; --warn:#f0b65c; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#161118; --paper:#1d1720; --paper2:#241d28; --fg:#f3e8ee; --mute:#a58f9d; --line:#342a38; --line2:#4a3d4f; --accent:#f4a9c1; --accent-strong:#f6b4c9; --accent-ink:#161118; --navy:#f6b4c9; --good:#7fd1a0; --bad:#ff8a8a; --warn:#f0b65c; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-family:var(--f-head);font-size:1.6rem;margin:0;letter-spacing:0}
h1 span{color:var(--accent-strong)}
h2{font-family:var(--f-head);font-size:1.25rem;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-head);font-size:1.05rem;margin:0 0 6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:2px solid var(--line);background:var(--paper);color:var(--fg);font:600 .92rem var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
nav.tabs button:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.btn{border:2px solid var(--line2);background:var(--paper);color:var(--fg);font:600 .95rem var(--f-body);padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;border:2px solid var(--line);color:var(--mute)}
.pill.on{background:var(--accent-strong);color:var(--paper);border-color:var(--accent-strong)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.muted{color:var(--mute)}
.say{border-left:5px solid var(--accent-strong);padding:6px 10px;margin:8px 0;font-weight:600;background:var(--paper2)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--fg);padding:12px 14px;border-radius:12px;margin:8px 0;font:500 1rem var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--fg)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.opt:disabled{cursor:default}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--paper2);border:2px solid var(--line2)}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;padding:20px;cursor:pointer;user-select:none}
.flash .back{color:var(--mute)}
.big{font-family:var(--f-head);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer{font-family:var(--f-head);font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.block{border-radius:12px;padding:12px 14px;color:#fff}
.stat{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.small{font-size:.9rem}
.note{font-size:.85rem;color:var(--mute)}
.cue{font-family:var(--f-head);font-size:1rem;line-height:1.7;border:2px dashed var(--fg);border-radius:12px;padding:12px 14px;background:var(--paper)}
kbd{font:600 .8rem var(--f-body);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
ul.clean{margin:6px 0 0 18px;padding:0}
ul.clean li{margin:4px 0}
.sr{position:absolute;left:-9999px}
table.deep{border-collapse:collapse;width:100%;font-size:.86rem;min-width:560px}
table.deep th,table.deep td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.deep th{background:var(--paper2)}
/* Notebook reader: a stage of one or two page panes, sized in JS to the space available. */
.nbchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.nbchips::-webkit-scrollbar{display:none}
.nbchips .pill{flex:none;cursor:pointer;background:var(--paper);border-color:var(--c);color:var(--fg);padding:6px 14px;font-size:.85rem;min-height:44px}
.nbchips .pill.on{background:var(--c);border-color:var(--c);color:#fff}
.nbbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nbbar .btn{padding:9px 14px;min-height:44px}
.nbbar .nbnum{font-variant-numeric:tabular-nums;min-width:104px;text-align:center}
.nbtools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nbtools .btn{padding:7px 10px;font-size:.84rem;min-height:44px}
.nblabel{font-size:.86rem;color:var(--mute);margin:6px 0 8px;min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.nbtoc{padding:6px;margin-bottom:8px;max-height:60vh;overflow:auto}
.nbtoc button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-left:5px solid transparent;background:none;color:var(--fg);font:600 .95rem var(--f-body);padding:9px 10px;border-radius:6px;cursor:pointer;min-height:44px;align-items:center}
.nbtoc button.l1{font-weight:400;padding:7px 10px 7px 26px;font-size:.92rem}
.nbtoc button:hover{background:var(--paper2)}
.nbstage{display:flex;justify-content:center;align-items:center;min-height:200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nbslot{flex:none;display:flex;justify-content:center;align-items:center;min-width:0}
.nbpane{flex:none;overflow:hidden;background:#fffdf8;border-radius:4px;box-shadow:0 0 0 1.5px var(--line2)}
.nbpane.z{overflow:auto;cursor:grab}
.nbin{position:relative;overflow:hidden;aspect-ratio:11/8.5}
.nbin.L,.nbin.R{aspect-ratio:5.5/8.5}
.nbin img{position:absolute;top:0;left:0;height:100%;width:100%;display:block;user-select:none;-webkit-user-drag:none}
.nbin.L img,.nbin.R img{width:200%;max-width:none}
.nbin.R img{left:-100%}
#nbRoot.nbfocus{position:fixed;inset:0;height:100vh;height:100dvh;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
#nbRoot.nbfocus .nbhide,#nbRoot.nbfocus .nblabel{display:none}
#nbRoot.nbfocus .nbbar{padding-bottom:6px;flex-wrap:nowrap;overflow-x:auto}
#nbRoot.nbfocus .nbbar .btn{padding:6px 10px;font-size:.84rem;flex:none;min-height:44px}
#nbRoot.nbfocus .nbtools{flex-wrap:nowrap}
#nbRoot.nbfocus .nbstage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#nbRoot.nbfocus .nbtoc{position:absolute;z-index:2;left:8px;right:8px;top:62px;max-height:calc(100% - 74px);max-width:440px}
@media (prefers-reduced-motion: no-preference){ .opt,.btn,nav.tabs button{transition:background .15s,border-color .15s} }
</style>

 {id:"fall", n:1, name:"Falling & missing", color:"#ff6b1a", sec:"S1 · S3",
  story:"Throw a ball sideways. It falls and lands. Throw it harder, it lands farther. Now throw it so hard that by the time it falls, the ground has curved away underneath it. It never lands. It just keeps falling around the Earth. That's an orbit. The space station isn't floating; it's falling, and missing, 16 times a day.",
  say:"An orbit is falling and missing. Go sideways fast enough and you never hit the ground.",

  why:[["So why do astronauts float?","Because they're falling too, together with the station. Like the drop on a roller coaster, but it never ends."],["Does the ISS ever need a push?","Yes. The thin air at 400 km slows it a little, so it loses about 2 km of height a month and fires thrusters to climb back."],["Doesn't it have to keep firing sideways to stay up?","No. The rocket gave it sideways speed once. After that, engines off for years. See 'Go deeper'."]],
  deep:{title:"How it actually stays up (no engines involved)",
   intro:"A spacecraft in orbit does nothing to stay in orbit. It doesn't fire sideways; it doesn't fire at all. Gravity is the only force on it, and gravity is what keeps it there. Here is the arithmetic you can check yourself, for the ISS at 400 km.",
   rows:[["1 · The rocket's job","give it sideways speed, once","Launch looks vertical for a minute, then tips over. Most of the burn is spent going sideways. At engine cutoff the spacecraft is moving horizontally at ~7.7 km/s. Height is cheap; sideways speed is the expensive part.","Official name: orbital velocity (circular velocity), v = √(μ/r)."],
    ["2 · The fall","gravity pulls it down ~4.3 m every second","Gravity at 400 km is 8.7 m/s², about 90% of surface gravity. In one second the spacecraft drops ½·8.7·1² ≈ 4.3 m toward Earth.","There is plenty of gravity up there. 'No gravity in space' is false."],
    ["3 · The miss","the ground curves away ~4.3 m every second","In that same second it moves 7.7 km sideways. Over 7.7 km, Earth's surface curves away by d²/(2R) = (7,670 m)² / (2 × 6,771,000 m) ≈ 4.3 m. Drop equals curve. Distance to the ground never changes.","That cancellation IS the orbit. Falling and missing is arithmetic, not a metaphor."],
    ["4 · Why gravity is the string","gravity = centripetal force","Swing a ball on a string: the string's inward pull is what bends a straight path into a circle. Gravity is Earth's string. A circular orbit is exactly the speed where gravity's pull equals the inward pull that circle needs.","Official name: centripetal force. For a satellite, gravity provides it."],
    ["5 · Wrong speed?","no engine needed for any of these","Too slow for the height: drops more than the ground curves, path bends into the atmosphere. Too fast: climbs, slows, comes back round as an ellipse. Faster than escape speed (√2 × circular): never comes back.","Different starting speeds, same physics. See vis-viva."],
    ["6 · What engines DO run for","station-keeping and attitude, not 'staying up'","Station-keeping: undoing tiny losses. ISS loses ~2 km/month to thin air and reboosts for a few minutes about monthly. GEO sats do small burns every few weeks against the Moon's and Sun's tug to hold their slot. Attitude control: pointing, via reaction wheels; it never changes the orbit. A tumbling spacecraft is still in a perfect orbit.","Two separate jobs, two separate names: orbit maintenance (station-keeping, reboost) vs attitude control (ADCS)."]],
   notes:["The sentence to own: it doesn't stay up by pushing. It stays up by moving sideways so fast it keeps missing the ground. Engines only run to fix pointing or to undo tiny drag losses.",
    "Why 'weightless': you feel weight only when something pushes back on you (the floor). In free fall nothing does, so you float, even though gravity is 90% of normal.",
    "A GEO satellite's lifetime is set by its station-keeping fuel. When that runs out it still orbits fine; it just drifts out of its parking slot and is moved to a graveyard orbit."]}},
 {id:"shelf", n:2, name:"Three shelves", color:"#1e7cff", sec:"S1 · S3",
  story:"Satellites live on three shelves. Low shelf (LEO): 200–2,000 km up, laps Earth every 90 minutes, sees a tiny patch in sharp detail. Middle shelf (MEO): up to 36,000 km, 12-hour laps, GPS lives here. Top shelf (GEO): exactly 35,786 km, one lap takes exactly one day, so from the ground it hangs still. Higher means you see more, move slower, see less detail, and the radio takes longer. Low satellites only see one spot for minutes, so to cover the planet you fly a swarm: a constellation.",
  say:"Higher means you see more but move slower. One exact height hangs still, and it has to be over the equator.",
  draw:"Earth, three rings, a flashlight cone from each ring to show how big a patch it sees.",
  why:[["Why over the equator?","Every orbit is centered on the middle of the Earth, and the equator is the only ground circle that matches. Park it over New York and New York slides away underneath."],["Why does GPS need 24 satellites but TV needs 1?","GPS is low enough that each satellite sees a patch and keeps moving; you need many so four are always overhead. A GEO TV satellite sees a third of the planet and never moves."]],
  deep:{title:"Why higher is slower, how a satellite gets to GEO, and how GPS actually finds you",
   intro:"Three mechanisms hide behind the three shelves. Each one has numbers you can check.",
   rows:[["1 · Why higher = slower","gravity weakens with distance (inverse square)","Gravity falls off as 1/r². At LEO (r = 6,771 km) you need 7.67 km/s sideways to balance it; at GPS height (26,560 km) only 3.87 km/s; at GEO (42,164 km) only 3.07 km/s. Slower speed AND a bigger circle, so the lap time balloons: 92 min → 12 h → 24 h.","v = √(μ/r) and T = 2π√(r³/μ). Period grows with r^1.5 (Kepler's third law)."],
    ["2 · Why 35,786 km exactly","solve T = one sidereal day for r","Set T = 86,164 s (23 h 56 m 4 s) in T = 2π√(r³/μ) with μ = 398,600 km³/s² and solve: r = 42,164 km from the center. Subtract Earth's 6,378 km equatorial radius: 35,786 km altitude. Nobody chose it; the equation did.","Any other altitude gives a different period, so the satellite drifts east or west across the sky."],
    ["3 · How a satellite reaches GEO","parking orbit → GTO → apogee kick","Rocket drops it in a ~200–300 km parking orbit (7.8 km/s). Burn 1 at perigee, +2.4 km/s, stretches the orbit into a Geostationary Transfer Orbit with apogee at 35,786 km. Coast 5.3 hours to apogee (now moving only 1.6 km/s). Burn 2 there, +1.5 km/s, rounds it off at 3.07 km/s. Total ~3.9 km/s after launch.","It's your perigee/apogee burn rule, applied. A launch from 28.5° latitude (Florida) also needs a plane change to reach i = 0°, which is why GEO launches from near the equator (Kourou, 5°) are cheaper."],
    ["4 · How GPS actually finds you","time stamps → distances → spheres","Each GPS satellite broadcasts the exact time and its own orbit. Your phone compares the time it hears with its own clock: the delay × the speed of light = distance to that satellite. One distance puts you on a sphere; three spheres cross at a point. The fourth satellite corrects your phone's cheap clock, which is wrong by far more than a few meters' worth of light-time.","Light travels 30 cm per nanosecond, so GPS needs clocks good to nanoseconds. The satellites carry atomic clocks; your phone doesn't, hence the fourth satellite."],
    ["5 · Why MEO for GPS","high enough to see a lot, low enough to be strong and fast","At 20,200 km each satellite sees ~38% of Earth, so 24 satellites in 6 planes guarantee 4+ overhead anywhere. GEO would need fewer but the signal would be weaker and the poles uncovered; LEO would need hundreds.","Orbit choice is a trade-off between coverage per satellite and signal strength/delay."],
    ["6 · Holding a GEO slot","station-keeping box ±0.05°","The Moon and Sun tug a GEO satellite north-south about 0.85° per year; Earth's slightly lumpy equator drifts it east-west. Small burns every few weeks, ~50 m/s of Δv per year, keep it in its box. When the fuel's gone, a last burn lifts it ~300 km into a graveyard orbit.","A typical GEO satellite carries ~15 years of station-keeping propellant; that, not the electronics, ends its life."]],
   notes:["The one rule behind the three shelves: gravity weakens with distance, so higher orbits are slower, longer, and hang still only at the single height where one lap equals one day.",
    "Why launch sites matter: Earth's spin gives a free 0.46 km/s eastward at the equator, zero at the poles. Launching east, near the equator, is the cheapest way up.",
    "GPS gives position; it does not track you. Your phone only listens. Nothing goes up."]}},
 {id:"hoop", n:3, name:"The hula hoop", color:"#7b3fe4", sec:"S3",
  story:"Earth is a basketball; the orbit is a hula hoop around it. To tell someone exactly how the hoop sits you need six things: how big (a), how squished (e), how tilted (i), which way the tilt faces (Ω, swivel), which way the squished end points (ω, spin), and where the ball is right now (ν). Five freeze the hoop; one moves. Most orbits are ovals with Earth off to one side, so there's a closest point (perigee) and a farthest point (apogee). Like a swing: fastest at the bottom, slowest at the top. Those are the two spots where you fire the engine.",
  say:"Six numbers describe any orbit: size, squash, tilt, swivel, spin, and where you are. Fastest at the low point, slowest at the high point.",
  draw:"An egg with Earth off-center, two dots labeled fast and slow. Then a tilted hoop over a flat disk.",
  why:[["Why six numbers, not three?","Size and shape don't tell you how the hoop is turned in space. That takes three more angles."],["What does firing the engine at perigee do?","It raises the far side of the orbit, apogee. Firing at apogee raises perigee. That's how you climb from a low orbit to a high one in two burns."]],
  deep:{title:"How a burn changes the six numbers, and where the numbers come from",
   intro:"The Classical Orbital Elements aren't just labels; each engine burn moves specific ones and leaves the rest alone. That's how you steer. And every set of elements you'll ever see online was measured, not assumed.",
   rows:[["1 · Prograde burn at perigee","raises apogee → a ↑, e ↑","Speed up at the low point and the far side of the orbit rises. Size (a) grows, the ellipse stretches (e grows). Tilt (i), swivel (Ω) and spin (ω) don't change, because you pushed along the direction you were already moving, inside the plane, at the perigee itself.","This is burn 1 of a Hohmann / GTO."],
    ["2 · Prograde burn at apogee","raises perigee → a ↑, e ↓","Speed up at the high point and the near side rises; the ellipse rounds out toward a circle. Same three untouched: i, Ω, ω.","This is burn 2, the circularization or apogee kick."],
    ["3 · Retrograde burns","the mirror image","Slow down at apogee and perigee drops (how you de-orbit: a retrograde burn at the high point dips the low point into the atmosphere). Slow down at perigee and apogee drops.","De-orbit burns for returning capsules are retrograde, roughly 100 m/s from the ISS."],
    ["4 · Sideways (out-of-plane) burn at a node","changes i","Push perpendicular to the orbital plane while crossing the equator and the tilt changes. Cost: Δv = 2·v·sin(Δi/2). At LEO speed, 1° of tilt costs ~134 m/s; 28.5° to 0° costs ~3.8 km/s, more than reaching orbit. So you change planes at apogee, where v is smallest, or launch into the right plane to begin with.","Why inclination is the expensive element and GEO launches happen near the equator."],
    ["5 · Out-of-plane burn away from a node","changes Ω (and i)","The same sideways push done elsewhere on the orbit swivels the plane around Earth's axis instead of (or as well as) tilting it. Rarely done on purpose; Ω is usually left to drift.","Nature changes Ω for free via Earth's bulge, see row 7."],
    ["6 · Radial burn","rotates ω","Push straight toward or away from Earth and the line of apsides rotates: perigee moves around the orbit without the size changing much. Used to re-point an elliptical orbit's low point over a target.","Rare in practice; expensive for what it does."],
    ["7 · Where the numbers come from","state vector → elements, at an epoch","Radar, laser ranging or onboard GPS measure the satellite's position and velocity (six numbers: x, y, z, vx, vy, vz, called the state vector) at one instant (the epoch). Pure geometry converts that into a, e, i, Ω, ω, ν. The public format is the Two-Line Element set (TLE), which is why every element comes with an epoch date.","Elements are a different way of writing position-and-velocity, chosen because five of them barely change."],
    ["8 · Why elements drift","J₂ and friends","Earth isn't a perfect sphere; its equatorial bulge (the J₂ term) makes an inclined orbit's Ω swivel slowly westward (~5° per day for the ISS) and ω rotate within the plane. Engineers use it: pick i ≈ 98° and Ω swivels exactly once a year, giving a sun-synchronous orbit.","Perturbations aren't just noise; the right one is a free engine."]],
   notes:["Steering summary: speed along your motion changes size and shape; pushing sideways changes tilt and swivel; pushing toward Earth rotates the ellipse. Six numbers, three kinds of push.",
    "Why 'burn at the low point': the same Δv gives a bigger energy change where you're already moving fastest (the Oberth effect). Perigee burns are the most efficient place to spend fuel.",
    "Every orbit-change plan you'll ever read is a list of which element each burn moves."]}},
 {id:"vac", n:4, name:"Five free services", color:"#19b36b", sec:"S2",
  story:"Down here, the air does five jobs you never notice: it's sunscreen (ozone blocks harsh UV), it's pressure (holds gas inside materials), it's a damper (a buzzing ruler stops because air steals its energy), it's a fan (hot air carries heat away), and it's a ground wire (static leaks away). Vacuum cancels all five. So in space UV snaps plastics, trapped gas pushes out and fogs your lenses (outgassing), vibrations never die, hot spots stay hot, and charge builds until it sparks. And it starts on the ground: clean rooms, because one speck can kill a sensor.",
  say:"Earth's air is doing five jobs for you right now. Space does none of them, so the spacecraft has to do all five itself.",
  draw:"A box labeled spacecraft with five arrows pointing in, each labeled with the missing service.",
  why:[["Why does the ISS have big white panels?","Radiators. It makes its own heat and there's no air to blow it away, so it glows the heat off into space. Radiation is the only exit left."],["What is outgassing really?","Gas trapped inside materials at one atmosphere pushes out into vacuum. It can crack the material and, worse, it lands on cold lenses and sensors and fogs them."]],
  deep:{title:"How heat, gas and charge actually behave in vacuum, with numbers",
   intro:"The five free services are the picture. These are the mechanisms underneath, the ones the engineers design to.",
   rows:[["1 · How a radiator works","power radiated ∝ T⁴ (Stefan–Boltzmann)","Every surface glows heat as infrared light at a rate σ·ε·T⁴ per square meter. A 1 m² panel at 300 K (27 °C) with emissivity ε ≈ 0.9 sheds about 410 W into cold space. Double the absolute temperature and you shed 16× as much. So radiators are kept hot and big, and painted with coatings that have high emissivity (radiate well) but low solar absorptivity (don't soak up sunlight): white paint, silvered Teflon.","The ISS radiators total ~1,700 m² to dump ~75 kW. No fan on Earth comes close for that area."],
    ["2 · How heat gets to the radiator","conduction, heat pipes, pumped loops","Metal straps conduct a little. Heat pipes do most of it: a sealed tube with a liquid (ammonia) that boils at the hot end, flows as vapor to the cold end, condenses, and wicks back. No pump, no power, moves kilowatts. Big stations use pumped ammonia loops.","Convection replaced by a plumbing trick that still works in free fall."],
    ["3 · Why hot and cold at once","sun side +120 °C, shade side −150 °C","Sunlight delivers 1,361 W/m². A surface facing the Sun with nothing cooling it settles where radiated = absorbed, which for a black surface is ~120 °C; a shaded surface radiating to 3 K space drops toward −150 °C. Spinning the spacecraft, MLI blankets and heaters keep electronics in their −20 to +50 °C window.","Hence 'barbecue roll' on Apollo: rotate slowly so no side bakes."],
    ["4 · How outgassing contaminates","hot source → cold sink","Trapped water, solvents and plasticizers diffuse out faster when warm. The vapor travels in straight lines (no air to scatter it) and sticks to whatever cold surface it hits. Optics and detectors are deliberately the coldest things on board, so they're the sink. A monolayer of film on a star tracker lens costs real pointing accuracy.","Standard test (ASTM E595): 125 °C in vacuum for 24 h; pass = TML < 1% and CVCM < 0.1%. Bake-out beforehand gets the loss out on the ground."],
    ["5 · How charging builds and arcs","photoelectric vs plasma collection","Sunlit surfaces lose electrons to UV (photoelectric effect) and go positive; shaded insulating surfaces collect plasma electrons and go negative. Two surfaces a few cm apart can end up kilovolts apart. When the gap breaks down, an arc jumps: a current spike that resets computers or punches through solar-array insulation.","Fix: every surface conductive (indium tin oxide over glass, carbon-loaded paints) and bonded to the structure with straps, so nothing can be more than a volt from anything else. GEO, in Earth's magnetotail during storms, is the worst place for it."],
    ["6 · Why vibration persists","damping ratio ~0.1–1%","A metal structure's own internal damping is tiny: a strut rung like a bell in vacuum loses only a fraction of a percent of its energy per cycle. Launch shakes everything hard (that's what vibration testing checks). In orbit the worries are reaction-wheel jitter and slewing: a big antenna swung quickly keeps wobbling for minutes, blurring images.","Hence dampers, slow slews, and 'settle time' built into every observation plan."]],
   notes:["Design rule: in vacuum you must create every heat path and every charge path on purpose. Nothing happens for free, and nothing happens by accident either, which is also why thermal and charging behavior is so predictable once modeled.",
    "The T⁴ law is why a small temperature rise makes a radiator much more effective, and why cold things in space are very hard to cool further.",
    "A cheap sanity check for any spacecraft picture: the gold/silver crinkly stuff is MLI, the big white flat panels are radiators, the dark flat panels are solar arrays."]}},
 {id:"air", n:5, name:"The air bites back", color:"#d4a500", sec:"S2",
  story:"The air is a layer cake. Troposphere (0–11 km): weather, planes, colder going up. Stratosphere (to 50 km): warmer going up, because the ozone here soaks up UV and turns it into heat. Mesosphere (to 90 km): coldest, meteors burn. Thermosphere (to 500 km): the thermometer says 1000 °C but there's almost no air, so nothing can hand that heat to you. The ISS flies through it and doesn't melt. Up there UV also splits oxygen pairs into single oxygen atoms, which grab onto anything. The spacecraft plows into them at 7.5 km/s and they eat its plastics.",
  say:"The top of the atmosphere is 1000 degrees but can't burn you, because there's nothing there. What is there is loose oxygen atoms that eat plastic.",
  draw:"A stack of five bands with a zigzag temperature line beside it.",
  why:[["1000 degrees and nothing melts?","Temperature is how fast the molecules move; heat is how many there are to hit you. One sparkler is 1000 °C and won't warm a room."],["Who's moving at 7.5 km/s, the atom or the spacecraft?","The spacecraft. The atoms are nearly still. It plows into them, so each hit carries enough energy to break a chemical bond."],["What's actually IN the air at each height?","See 'Go deeper' below: a stirred mix of nitrogen and oxygen pairs near the ground, then single oxygen atoms, then helium, then hydrogen, lightest on top."]],
  deep:{title:"What the air is made of, floor by floor",
   intro:"Think of the atmosphere as a smoothie at the bottom and a layered drink at the top. Below about 100 km everything is stirred together, so the recipe is the same everywhere. Above about 100 km the stirring stops and the gases sort themselves by weight: heavy ones low, light ones high. Sunlight also starts breaking molecules apart up there.",
   rows:[["0–100 km","the stirred mix (homosphere)","N₂ 78% · O₂ 21% · Ar 0.9% · CO₂ 0.04% · water vapor 0–4% (mostly below 11 km) · trace neon, helium, methane · ozone O₃ is a few parts per million, peaking at 15–35 km","Same recipe at every height here. This is the air you breathe and the air planes fly in."],
    ["100–200 km","the breakup zone","N₂ still the main gas, but UV is now splitting O₂ into single O atoms; atomic O climbs fast","Where the atmosphere stops being 'air' as you know it. Meteors have already burned up below this."],
    ["200–600 km","atomic oxygen country","atomic O is the number-one gas; N₂ fading; a little N and He","LEO. The ISS, Hubble and Starlink fly here. Atomic O erodes polymers; what's left of the density causes drag."],
    ["600–1,500 km","helium shell","He takes over from O (the boundary moves up and down with the Sun's activity)","Too thin to matter much for drag; GPS and GEO are far above this."],
    ["1,500 km and up","hydrogen fringe (exosphere / geocorona)","mostly single H atoms, so thin they can escape Earth entirely","A faint hydrogen halo glows in UV out to tens of thousands of km."]],
   notes:["Why the order: nitrogen pairs and oxygen pairs are heavy, single oxygen atoms are half an O₂, helium is lighter still, hydrogen is the lightest thing there is. Once the stirring stops, each gas settles at the height its weight allows, like oil over water.",
    "Where ozone fits: ozone is just three oxygen atoms stuck together. It forms in the stratosphere when UV hits O₂ and the loose atoms grab onto other O₂. It's rare (a few molecules per million) but it absorbs so well that it blocks most harmful UV. Above the stratosphere there isn't enough air for it to form, so UV comes through raw.",
    "The ionosphere overlaps all of this, roughly 60–1,000 km: sunlight knocks electrons off atoms, leaving charged particles. It bends and reflects radio, which is why AM radio travels far at night and why GPS signals get slightly delayed. It also grows and shrinks between day and night.",
    "'Anomalous O' on the lecture's chart: a small population of extra-hot oxygen atoms the model adds above ~300 km. Still oxygen; not a separate thing to memorize.",
    "Why a spacecraft cares, in one line each: atomic O eats plastics (LEO); the thin air causes drag that the Sun's activity can double or triple; the ionosphere messes with radio and GPS; helium and hydrogen are too thin to matter."]}},
 {id:"fuel", n:6, name:"The fuel bill", color:"#e5338f", sec:"S1 · S3",
  story:"First, the ladder of ways to visit a planet: fly past, orbit, drop a probe into its air, land, drive, or crash on purpose. Each rung costs more fuel to slow down and brings back more science. Now, getting there. You don't aim at Mars; you aim at where Mars will be. The cheapest route is a lazy half-ellipse that meets Mars halfway around the Sun: the Hohmann transfer, about 8.5 months, two burns. Faster costs wildly more fuel. Lambert's problem is the calculator: two points plus a time in, orbit and fuel bill out. And you can only launch when Earth and Mars line up, every 26 months.",
  say:"Fast is expensive, slow is cheap. The lazy throw takes eight and a half months and you can only do it every two years.",
  draw:"Two circles around a dot, a dashed half-oval connecting them, a burn at each end.",
  why:[["Why not just go whenever?","Mars has to be in the right spot when you arrive. That lineup happens every 26 months."],["Why can't we do Mars in 20 days?","The math gives you an orbit for it, but the speed change needed is enormous. No rocket can carry that fuel."]],
  deep:{title:"The Hohmann and rocket-equation numbers, worked",
   intro:"The lazy throw isn't just cheapest in spirit; here is what each burn costs and why fast transfers are impossible, with the actual arithmetic.",
   rows:[["1 · LEO → GEO Hohmann, worked","Δv₁ = 2.42, Δv₂ = 1.47, total 3.89 km/s","Circular speed at 300 km: √(398600/6671) = 7.73 km/s. Transfer ellipse: a = (6671 + 42164)/2 = 24,418 km. Vis-viva at perigee: √(398600·(2/6671 − 1/24418)) = 10.15 km/s, so burn 1 = 10.15 − 7.73 = 2.42. At apogee: 10.15 × 6671/42164 = 1.61 km/s. Circular speed at GEO = 3.07, so burn 2 = 3.07 − 1.61 = 1.47. Time of flight = π√(a³/μ) = 5.3 h.","Every number here comes from two formulas you already have: vis-viva and circular speed."],
    ["2 · Earth → Mars Hohmann, worked","~3.6 km/s to leave, ~2 km/s to capture, 259 days","Around the Sun: Earth moves at 29.8 km/s, the transfer ellipse needs 32.7 at perihelion, so you must leave Earth's neighborhood with v∞ ≈ 2.9 km/s. But you start in a gravity well: from LEO the burn is √(v_esc² + v∞²) − v_circ = √(11.0² + 2.9²) − 7.7 ≈ 3.6 km/s. You arrive at Mars with v∞ ≈ 2.6 km/s; braking into a loose orbit costs ~2 km/s more. Travel time: half the transfer ellipse's period ≈ 259 days.","Why the departure burn is only 3.6 and not 11 + 2.9: you're already doing 7.7 km/s in LEO, and escape speed is √2 × that."],
    ["3 · Why you can only go every 26 months","phase angle 44°","Mars must be ~44° ahead of Earth at departure so it arrives at the far end of the ellipse when you do. Earth laps the Sun in 365 days, Mars in 687; the relative angle repeats every 1/(1/365 − 1/687) = 780 days.","Miss the window by a month and the Δv climbs steeply; miss by six and it's not possible."],
    ["4 · Why 20 days is impossible","the rocket equation","Tsiolkovsky: Δv = Isp·g₀·ln(m₀/m_f). A good hydrogen engine has Isp ≈ 450 s, so Isp·g₀ ≈ 4.4 km/s. For the 3.6 km/s Hohmann departure, m₀/m_f = e^(3.6/4.4) ≈ 2.3: 56% of the departing mass is propellant, fine. A 20-day trip needs ~60 km/s: e^(60/4.4) ≈ 800,000. The ship would need to be 99.9999% propellant. No structure can be that light.","Fuel cost grows exponentially with Δv. That single fact shapes every mission."],
    ["5 · How Lambert's problem is actually solved","one free parameter, one equation","Infinitely many ellipses with the Sun at a focus pass through two given points. They differ by their semi-major axis. Lambert proved the time of flight between the points depends only on a, the straight-line distance between them, and the sum of the two radii. So you pick the a whose time of flight matches your deadline (by iteration), and the departure and arrival velocities fall out, hence the Δv.","Mission designers run this for thousands of date pairs and plot the Δv as a contour map, the 'porkchop plot', to pick the launch day."],
    ["6 · Why burns happen at perigee","the Oberth effect","Kinetic energy is ½mv², so adding a fixed Δv adds more energy when v is already large. A 1 km/s burn at 10 km/s adds 10.5 units of energy per kg; the same burn at 2 km/s adds only 2.5. Deep in a gravity well you're moving fastest, so that's where fuel buys the most.","Why interplanetary departures burn from LEO, and why flybys dip as low as they dare."]],
   notes:["Chain of reasoning to keep: vis-viva gives speeds at each end → differences give Δv → rocket equation turns Δv into propellant fraction → exponential growth makes fast trips impossible.",
    "GTO numbers (2.42 + 1.47) and Mars numbers (3.6 + 2) are worth memorizing; they anchor every other mission you'll read about.",
    "Isp (specific impulse, in seconds) is the engine's fuel efficiency: chemical 300–450 s, ion engines 3,000+ s but with tiny thrust. Coming in the propulsion section."]}},
 {id:"flyby", n:7, name:"The free lunch", color:"#555555", sec:"S1 · S3",
  story:"For really far places the lazy throw is still too expensive. So you cheat. Swing close past a planet. In the planet's eyes you come in and go out at the same speed, just bent. But the planet is moving around the Sun, and the bend lines you up to carry some of that motion along. You leave faster than you arrived, for free: a flyby, or gravity assist. A ball bouncing off the front of a moving truck. More speed means a bigger orbit, so you reach farther. Pass in front of the planet instead and you slow down. The price is time: Rosetta took 10 years and four flybys to reach a comet.",
  say:"Bounce off a moving planet and you leave faster than you came. It's free, but it takes years.",
  draw:"A planet with a thick arrow showing it moving, a dashed path bending around it.",
  why:[["Isn't that free energy?","No. It comes from the planet, which slows down by an amount nobody could ever measure."],["Why couldn't New Horizons stop at Pluto?","It left Earth so fast, plus a Jupiter boost, that no fuel could brake it into orbit. Speed bought the trip; speed cost the orbit."]],
  deep:{title:"The flyby, worked: vectors, turning angle, and where the energy goes",
   intro:"A gravity assist is two frames of reference and one addition. Here is the mechanism with numbers, using a Jupiter flyby.",
   rows:[["1 · In Jupiter's frame","speed in = speed out, path bends by δ","Far from Jupiter you approach at some relative speed v∞. Gravity bends you around a hyperbola and you leave at the same v∞, rotated by the turning angle δ. Energy relative to Jupiter is conserved: nothing is gained or lost in this frame.","Hyperbolic excess velocity v∞; turning angle δ. The closer you pass, the bigger δ."],
    ["2 · How much it bends","sin(δ/2) = 1 / (1 + r_p·v∞² / μ)","r_p = closest approach distance, μ = Jupiter's gravitational parameter (1.27 × 10⁸ km³/s²). Example: v∞ = 10 km/s, r_p = 500,000 km → r_p·v∞²/μ = 0.39 → sin(δ/2) = 0.72 → δ ≈ 92°. Pass closer or slower and δ grows toward 180°.","Big planet, close pass, slow approach = big bend. Mars bends you little; Jupiter bends you a lot."],
    ["3 · In the Sun's frame","add Jupiter's own velocity","Jupiter moves around the Sun at 13 km/s. Your Sun-frame velocity is (your velocity relative to Jupiter) + (Jupiter's velocity). Before the flyby the two vectors partly cancel; after the bend they partly add. The magnitude changes even though the relative speed didn't.","Same addition as walking on a moving train: your speed relative to the ground depends on which way you walk."],
    ["4 · Worked gain","up to ~2 × v_planet in the ideal case","In the extreme 180° bounce, approaching head-on at v∞ against the planet's motion and leaving along it, the Sun-frame speed goes from (v_planet − v∞) to (v_planet + v∞): a gain of 2·v∞, capped by geometry at about 2·v_planet. Real flybys bend 60–150°. Voyager 2 picked up roughly 10 km/s of Sun-frame speed at Jupiter.","Why Jupiter is the slingshot of choice: it's massive (big δ) and fast (13 km/s to borrow from)."],
    ["5 · Where the energy comes from","momentum conservation","The spacecraft's gain is the planet's loss: m_spacecraft × Δv_spacecraft = M_planet × Δv_planet. With a 1-ton probe gaining 10 km/s, Jupiter (1.9 × 10²⁷ kg) slows by ~5 × 10⁻²⁴ m/s. Not free energy; just a ridiculously lopsided trade.","Energy and momentum are both conserved. The planet pays an amount no instrument could ever measure."],
    ["6 · Behind vs in front","gain vs brake","Pass behind the planet (on the trailing side of its motion) and the bend points you along its velocity: you gain. Pass in front and the bend points you against it: you lose. MESSENGER used six flybys of Earth, Venus and Mercury to shed speed so it could be captured at Mercury; Parker Solar Probe uses Venus the same way to fall toward the Sun.","Same trick, opposite sign. Geometry decides."],
    ["7 · Why it costs years","you must meet the planet where it is","A gravity assist only works if the planet is at the right place when you pass, so trajectories string together windows: Earth→Venus→Earth→Jupiter (Cassini, 1997–2004). Each loop around the inner solar system is a year or more of coasting.","Time is the currency you spend instead of propellant."]],
   notes:["In Jupiter's eyes nothing changed but your direction. In the Sun's eyes your speed changed because Jupiter was moving. Both are true at once; that's what 'frame of reference' means.",
    "Design levers: approach speed, closest-approach distance, and which side you pass on. Those three set the bend and the sign of the gain.",
    "After the flyby you're on a new, bigger (or smaller) orbit around the Sun with a new semi-major axis; that's the 'more speed → bigger a' line from Section 3."]}},
 {id:"prop", n:8, name:"Throw it backward", color:"#0e8f9c", sec:"S4",
  story:"Sit on a skateboard holding a bowling ball. Throw the ball backward and you roll forward. You pushed on the ball and the ball pushed on you; the ground and the air had nothing to do with it. That is every rocket: the ball is the gas it throws out the back, and the push is called thrust. Throw faster, or throw more each second, and you push harder. A chemical rocket is a fire with one way out: fuel and the oxygen it brought along burn in a chamber, and a bell-shaped nozzle turns that hot, squeezed gas into a jet at 3 to 4 km/s. It pushes enormously hard and is empty in minutes. An electric engine uses electricity to fling its propellant ten times faster, so it sips, but its push is the weight of a few sheets of paper. A nuclear engine sits in between and has never flown.",
  say:"A rocket pushes on its own exhaust. Chemical is strong and thirsty, electric is weak and efficient.",
  draw:"A box with a bell on the back. Thin arrow for the gas going left, thick arrow for the ship going right.",
  why:[["There's no air in space. What does a rocket push against?", "Its own exhaust. Throw mass backward and you are shoved forward: Newton's third law. Air is not part of it; rockets actually work better in vacuum."], ["If electric engines are so efficient, why not use them for everything?", "The push is a fraction of a newton. Fine for months of gentle cruising, useless for launching, landing or braking into orbit in half an hour."], ["Why is specific impulse measured in seconds?", "It is exhaust speed divided by 9.81. In words: how many seconds one kilo of propellant can hold up one kilo of weight. Higher means better mileage."]],
  deep:{"title": "Thrust, worked: momentum, the nozzle, and the two numbers", "intro": "Every engine is a way of throwing mass backward. Here is the bookkeeping, then what happens inside a chemical engine, then why the three families differ.", "rows": [["1 · Momentum is kept", "mass × velocity never changes in total", "A 1,000 kg ship at rest throws 1 kg backward at 3,000 m/s. 1 × 3,000 = 999 × v, so the ship moves forward at 3 m/s. Air appears nowhere in that sum.", "Newton's third law (action–reaction); conservation of momentum. This is the reaction principle."], ["2 · Thrust", "F = ṁ × vₑ", "Thrust is how fast you throw momentum away: kilograms per second times exhaust speed. 0.1 kg/s at 3,000 m/s gives 300 N. On a 1,000 kg ship that is 0.3 m/s², so a 10 s burn gives 3 m/s of Δv using 1 kg. Same answer as row 1.", "Thrust (F), mass flow rate (ṁ), exhaust velocity (vₑ). Two levers: throw more, or throw faster."], ["3 · Two tanks", "fuel + oxidizer", "Burning is fuel joining with oxygen. There is no air in space, so a rocket carries its own oxidizer, and it is most of the load: about 6 kg of oxygen per kg of hydrogen. Hydrogen + oxygen releases about 13 MJ per kg of mix.", "Bipropellant. LH₂ / LOX are cryogenic; RP-1 is kerosene. Probes use storable hypergolics (hydrazine family)."], ["4 · Feed and burn", "pumps → chamber at ~3,300 K, 100+ bar", "The chamber is at 100 or more times air pressure, so propellant must be forced in. Each Saturn V F-1 engine had a 41 MW turbopump moving 2.6 tonnes per second. Inside, the gas is hot and squeezed but slow.", "Turbopump (or pressure-fed for small engines); combustion chamber. Walls survive by regenerative cooling: cold fuel flows through them first."], ["5 · Throat and bell", "pressure turns into speed", "The narrowing accelerates the gas to exactly the speed of sound at the throat. Past Mach 1 the rule flips: a widening pipe speeds the gas up. Pressure and temperature fall, speed climbs to 3–4 km/s at the exit.", "de Laval nozzle (converging–diverging, bell nozzle). The nozzle spends pressure to buy speed."], ["6 · Check it on a real engine", "287 kg/s × 3,414 m/s ≈ 981,000 N", "SpaceX's Merlin Vacuum: Isp 348 s, so vₑ = 348 × 9.81 = 3,414 m/s. It throws 287 kg every second. F = ṁ × vₑ ≈ 981 kN, enough to hold up 100 tonnes.", "Specific impulse Isp = vₑ ÷ g₀, with g₀ = 9.81 m/s². 348 s means 1 kg of propellant can give 9.81 N for 348 seconds."], ["7 · The chemical ceiling", "vₑ ≈ 4.5 km/s, Isp ≈ 460 s", "The energy in a kilo of propellant is fixed by chemistry. Even perfect conversion of 13 MJ/kg gives √(2 × 13,000,000) ≈ 5.2 km/s. Real best is 4.5 km/s. No chemical engine will ever reach 1,000 s.", "Why electric and nuclear engines exist: the energy has to come from somewhere other than the propellant."], ["8 · Electric: fast but feeble", "jet power = ½ ṁ vₑ²", "Getting 300 N at 30,000 m/s needs 4.5 MW of jet power. Solar panels give kilowatts. So NASA's NEXT ion thruster takes 6.9 kW and gives 0.236 N at 41 km/s (Isp 4,190 s). Dawn needed 4 days to go 0–100 km/h, then thrust for 5.9 years: 11.5 km/s of Δv from 425 kg of xenon.", "Electric propulsion (EP): ion thruster, Hall-effect thruster. Thrust is limited by electrical power, not by propellant."], ["9 · Nuclear thermal: hot and light", "vₑ ∝ √(T ÷ molecule mass)", "Burning hydrogen and oxygen makes steam, molecular mass 18. A reactor heats plain hydrogen, mass 2, to about 2,700 K. That is cooler than the flame (3,500 K), but the molecules are so much lighter that they fly about twice as fast: Isp about 900 s against 450 s. Ground-tested as NERVA until 1972; never flown.", "Nuclear thermal propulsion (NTP). Not the same as an RTG, which only makes electricity."], ["10 · What mileage buys", "rocket equation", "For a 5 km/s Δv: at Isp 320 s the ship must be 80% propellant; at Isp 3,000 s only 16%. That is the whole trade: thrust now, or mass saved over years.", "Requirements pick the engine: launch, landing and capture need thrust (chemical); long cruises reward Isp (electric)."]], "notes": ["The three families differ in where the energy comes from: inside the propellant (chemical), from solar panels (electric), from a reactor (nuclear).", "Thrust and specific impulse pull against each other. Chemical engines have modest exhaust speed but throw tonnes per second; ion engines have enormous exhaust speed but throw milligrams per second.", "Both engines in the lecture's photos (Falcon 9 second stage, Saturn V first stage) burn kerosene with liquid oxygen, not hydrogen."]}},
 {id:"ion", n:9, name:"The tortoise engine", color:"#b5651d", sec:"S4",
  story:"Rub a balloon on your hair and it pulls your hair toward it without touching. That pull is electricity grabbing things that are charged. An ion engine is that trick, aimed out the back. First it knocks one electron off each atom of a gas, so the atoms become charged: ions. Then two metal screens full of holes, one charged plus and one minus, yank the ions through and fling them out at 40 km a second, forty times faster than a rifle bullet. Finally it squirts the knocked-off electrons out too, or the ship would end up charged and pull its own exhaust back. The push is the weight of two sheets of paper. But it never stops. A chemical rocket is the hare: one huge sprint. The ion engine is the tortoise: a tiny push every second for years, and it ends up faster on a fifth of the propellant.",
  say:"An ion engine is static electricity pointed backward: a tiny push that never stops.",
  draw:"A can with dots inside, two dashed grids at the open end, plus-signs flying out, a little box above spraying dots into the beam.",
  why:[["An engine that pushes like two sheets of paper? How is that any use?", "It runs for years. Deep Space 1 gained about 16 m/s every day and ended with 4.3 km/s from 74 kg of xenon. A chemical engine would have needed about 360 kg."], ["Why does it spit electrons out as well?", "The beam is all positive ions. Without matching electrons the ship would charge negative within microseconds and drag the ions back. The neutralizer keeps everything balanced."], ["Why can't you launch a rocket with one?", "Its thrust is tens of thousands of times smaller than the spacecraft's weight, and it only works in vacuum."]],
  deep:{"title": "The gridded ion thruster, step by step, with Deep Space 1's numbers", "intro": "Four steps: feed, ionize, accelerate, neutralize. Then the two facts that explain everything else: thrust lands on the grids, and power sets the limit.", "rows": [["1 · Feed", "xenon, about 3 mg per second", "Xenon gas trickles into the discharge chamber. Xenon is heavy (131 atomic mass units), easy to ionize and chemically inert.", "Propellant here is not burned. It is only the mass to throw."], ["2 · Ionize", "electrons knock electrons off atoms", "A hollow cathode emits electrons; about 30 V speeds them up. One that hits a xenon atom with more than 12.1 eV knocks an electron off, leaving a positive ion. Magnets make the electrons spiral, so they travel much farther before reaching the wall and get many more chances to hit an atom.", "Electron-impact ionization; ionization energy; the chamber now holds plasma (ions + free electrons, neutral overall)."], ["3 · Accelerate", "v = √(2qV ÷ m) ≈ 40 km/s", "Screen grid at +1,100 V, accelerator grid at −180 V, about half a millimetre apart. An ion that drifts into a hole falls through that voltage: its energy is charge × voltage = ½mv². For xenon at 1,100 V that is 40 km/s.", "Ion optics: screen grid and accelerator grid. The slide calls them positive and negative grid."], ["4 · Where the push lands", "on the grids", "The grids pull the ions out the back; the ions pull the grids forward with exactly the same force. That reaction on the grids is the thrust.", "Newton's third law, same as a chemical rocket. Only the way of throwing has changed."], ["5 · Neutralize", "1.76 A of ions out, 1.76 A of electrons out", "The beam carries positive charge away. A second cathode outside the engine sprays an equal current of electrons into the beam. Without it the ship charges negative and the ions turn round.", "Neutralizer. The negative grid also stops those outside electrons rushing back in (electron backstreaming)."], ["6 · Thrust", "3 mg/s × 30 km/s ≈ 0.092 N", "F = ṁ × vₑ. The effective exhaust speed is about 30 km/s, not 40, because some gas leaves without being ionized. Isp ≈ 3,100 s. The push is 9 grams.", "Same two formulas as the chemical engine: F = ṁ × vₑ and Isp = vₑ ÷ g₀."], ["7 · Power is the limit", "F ≈ 2 × efficiency × P ÷ vₑ", "That 0.092 N took 2,300 W, a whole solar array. Each milligram needs about 500 joules to reach 30 km/s. For a fixed power, faster exhaust means less thrust: roughly 40 mN per kW.", "Why the instructor's 'low mass flow' is a symptom. The cause is limited electric power."], ["8 · Add it up", "16 m/s per day → 4.3 km/s", "0.092 N on a 486 kg spacecraft is 0.00019 m/s², or 16 m/s every day. Deep Space 1 thrust for 678 days in total and used 74 kg of xenon.", "Low thrust × long time = large Δv. The tortoise wins on propellant."], ["9 · Where it is used", "orbit raising, station-keeping, cruise", "Communications satellites use it to hold their slot and, increasingly, to climb to GEO over about six months. Every Starlink has an electric thruster. Deep-space users: Deep Space 1, Dawn, BepiColombo, Psyche. Never for launch, landing or capture burns.", "Primary propulsion vs station-keeping. BepiColombo's ion engines fly it to Mercury; chemical thrusters do the capture."]], "notes": ["Plasma is not 'the positive particles'. It is ions and free electrons together. The grids pull out only the ions.", "The neutralizer exists because of spacecraft charging, the same effect as in Section 2, here caused by the engine itself.", "The lecture covered only the gridded ion thruster. The Hall-effect thruster, which uses a magnetic field instead of grids, is the most common electric engine in orbit."]}},
 {id:"nuke", n:10, name:"The kettle with no fire", color:"#6b7a1f", sec:"S4",
  story:"A normal rocket heats its gas by burning it. A nuclear rocket is a kettle with no fire. Inside is a block of uranium that gets scorching hot by itself as its atoms split. The engine squirts the lightest gas there is, hydrogen, through holes in that hot block, and the gas shoots out through an ordinary bell nozzle. Why is that better? Throw a ping-pong ball and a bowling ball with the same arm: the ping-pong ball leaves much faster. A chemical rocket's fire makes steam, the bowling ball. A reactor burns nothing, so it can throw plain hydrogen, the ping-pong ball. Twice the exhaust speed, twice the mileage, and it still pushes hard. The catch: it is radioactive, heavy, expensive to test, and has never flown. It ran on test stands in Nevada in the 1960s.",
  say:"A nuclear rocket is a kettle with no fire: not hotter, just lighter exhaust, so twice the mileage.",
  draw:"A round tank, a pump, a hatched box (the reactor), a bell. Next to it a big circle marked 18 and a small one marked 2.",
  why:[["So it's a bomb going off behind the ship?", "No. A reactor is a controlled, steady heat source; it cannot explode like a bomb. The design that did use bombs was Project Orion (1958–1965), a different idea that was never built."], ["Is it better because it's hotter?", "No, it actually runs cooler than a chemical flame, about 2,700 K against 3,500 K. It wins because its exhaust is plain hydrogen, seven times lighter than steam."], ["Could one take us to another star?", "No. It gives perhaps 10–20 km/s. The nearest star is 40 trillion km away: about 75,000 years at Voyager's speed. It is an engine for Mars."]],
  deep:{"title": "Nuclear thermal rocket: why cooler and lighter beats hotter and heavier", "intro": "Same nozzle as a chemical rocket, a different heat source, and one rule that explains the result: exhaust speed goes as the square root of temperature divided by molecular mass.", "rows": [["1 · The heat source", "fission, 6 million × chemistry", "Splitting 1 kg of uranium-235 releases about 80 million MJ. Burning 1 kg of hydrogen and oxygen releases 13 MJ. Energy is never the limit in a nuclear engine.", "Nuclear fission; reactor core; fuel elements. The uranium is nuclear fuel, not propellant: it stays on board."], ["2 · Flow path", "tank → pump → nozzle wall → core → throat → bell", "Liquid hydrogen at 20 K is pumped first through channels in the nozzle wall, cooling it, then down through hundreds of holes in the hot core. It leaves as gas at about 2,700 K.", "Working fluid = propellant = hydrogen. Turbopump and regenerative cooling, same as a chemical engine."], ["3 · The rule", "vₑ ∝ √(T ÷ M)", "Chemical: 3,500 K ÷ 13.6 (steam with spare hydrogen). Nuclear: 2,700 K ÷ 2. The ratio of the square roots is about 2.3. Real engines manage about 2.", "Molecular mass (M). The lecture's 'because temperatures are higher' is wrong: the reactor is cooler and still wins."], ["4 · The two numbers", "Isp ≈ 850 s · 246,000 N", "NERVA: vₑ ≈ 8.3 km/s, so Isp = 8,300 ÷ 9.81 ≈ 850 s (841 s measured). Thrust 246,000 N, about 25 tonnes of push.", "High thrust AND high Isp: the combination neither chemical nor electric offers."], ["5 · Check it", "30 kg/s · 1,000 MW", "ṁ = F ÷ vₑ = 246,000 ÷ 8,300 ≈ 30 kg of hydrogen per second. Jet power = ½ṁvₑ² ≈ 1,000 MW. The reactor was rated 1,100 MW.", "The same F = ṁ × vₑ and ½ṁvₑ² as every other engine."], ["6 · What it buys", "36% propellant, not 60%", "Leaving Earth orbit for Mars takes about 4 km/s. Rocket equation: at Isp 450 s the ship is 60% propellant; at 900 s it is 36%. Spend the difference on payload or on a faster trip.", "Payload and payload fraction. The slide's 'lift-off mass is half' really means mass placed in Earth orbit."], ["7 · Why Mars crews want it", "shorter trip, less radiation", "More Δv for the same mass can cut the transit from roughly 6–9 months to 3–4. Less time in deep space means a smaller dose from cosmic rays and solar storms.", "Radiation exposure (dose). A shadow shield protects the crew from the reactor itself."], ["8 · The limits", "solid core, heavy engine, bulky tanks", "The core must stay solid: 2,700–2,900 K at most. Hot hydrogen attacks the fuel rods. Liquid hydrogen is 14 times less dense than water. Thrust is only 3–4 times the engine's weight, against 70–180 for chemical, so it is never a lift-off engine.", "Liquid-core and gas-core designs (the slide's 'mixing fuel and fluid') would lift the temperature cap. Paper only."], ["9 · History", "tested 1959–1972, never flown", "US Project Rover and NERVA ran about 20 reactors in Nevada; in 1969 one engine was started 28 times. Cancelled in 1973. A NASA and DARPA flight demo (DRACO) was started in 2023 and cancelled in 2025, as far as known.", "Low-enriched uranium (under 20% U-235) is the modern choice: fewer security rules, cheaper, slower to object to."]], "notes": ["Project Orion on the lecture's last slide is not a nuclear thermal rocket. It is nuclear pulse propulsion: small bombs exploded behind a pusher plate. Studied 1958–1965, ended by the 1963 test-ban treaty.", "Bimodal means one reactor doing two jobs: thrust during burns, electricity the rest of the time.", "An RTG, nuclear electric propulsion and a nuclear thermal rocket are three different things: electricity from decay heat, a reactor powering ion engines, and a reactor heating hydrogen."]}},
 {id:"comm", n:11, name:"The radio flashlight", color:"#c0392b", sec:"S5",
  story:"Drop a stone in a pond and ripples spread out. A radio wave is a ripple too, but in electricity and magnetism, and it needs no water and no air, so it crosses empty space at the speed of light. An antenna is a metal stick. When the ripple washes over it, it pushes the electricity in the stick back and forth and the radio reads that bobbing. To send, do the reverse. The stick works best when it is half as long as one ripple. Voice ripples would be 3,000 km long, so the stick would be longer than Texas. So we cheat: take a fast, short ripple, the carrier, and make it carry the voice by changing its height (AM) or its spacing (FM). Last trick: a bare bulb lights a room dimly, but the same bulb in a flashlight throws a bright spot far away. A dish antenna is a flashlight for radio. Cassini talked to Earth from Saturn with 20 watts, a fridge bulb, because its 4-metre dish squeezed everything into one thin beam aimed exactly at us.",
  say:"Radio is a ripple you can write on, and a dish is a flashlight that aims it.",
  draw:"A wavy line with one wavelength marked, a rod half that long, and a dish with a narrow beam.",
  why:[["How can a probe at Saturn reach us with 20 watts?", "Its 4-metre dish concentrates the power about 50,000 times in our direction, and a 70-metre dish on Earth listens. The signal arrives at about 10⁻¹⁶ watts and is still readable."], ["Why can't you just transmit the voice itself?", "A 100 Hz signal sent as a radio wave has a wavelength of 3,000 km, and an antenna has to be about half a wavelength. So the voice is written onto a fast carrier wave instead."], ["Does a dish make the signal more powerful?", "No. It adds nothing. It takes the power that would go in every direction and aims it one way, like the reflector in a flashlight."]],
  deep:{"title": "From wave to beam: c = λ × f, the half-wave rod, modulation and gain", "intro": "Four ideas, each with a number you can check on something you own: what a radio wave is, why antenna size follows frequency, how a slow signal rides a fast carrier, and how a dish buys range without power.", "rows": [["1 · The wave", "electric and magnetic fields keeping each other going", "A changing electric field makes a changing magnetic field, which makes a changing electric field. The pair travels at 299,792 km/s, at right angles to each other and to the direction of travel, with no medium.", "Electromagnetic wave. Radio, light, UV and X-rays are the same thing at different frequencies: the electromagnetic spectrum."], ["2 · c = λ × f", "speed is fixed, so wavelength and frequency trade", "FM radio at 100 MHz: 3 m. Wi-Fi at 2.4 GHz: 12.5 cm. Deep-space link at 8.4 GHz: 3.6 cm. Visible light: half a thousandth of a millimetre.", "Wavelength (λ), frequency (f, in hertz), speed of light (c). Higher frequency means shorter wavelength."], ["3 · Receive", "the wave shakes the rod's electrons", "Metal is full of loose electrons. The wave's electric field pushes them one way and then the other, so a tiny alternating voltage appears along the rod at the wave's frequency: millionths of a volt.", "Antenna as receiver. The receiver electronics amplify and decode that voltage."], ["4 · Transmit", "the reverse", "Drive an alternating voltage into the rod and the electrons shaken back and forth radiate a wave at that frequency. The same antenna does both jobs.", "Antenna as transmitter. The symmetry is called reciprocity."], ["5 · Size", "rod ≈ λ ÷ 2", "A rod half a wavelength long resonates, like a guitar string that fits its note. 100 MHz → 1.5 m. 2.4 GHz → 6 cm. A 100 Hz voice signal → 1,500 km.", "Half-wave dipole; a monopole is a quarter-wave (car aerial, Wi-Fi router stub)."], ["6 · Modulate", "write the slow signal on a fast carrier", "AM radio: a 1 MHz carrier whose height follows the voice. FM radio: a 100 MHz carrier whose frequency swings ±75 kHz. Spacecraft and Wi-Fi send bits by shifting the carrier's phase.", "Modulation; carrier signal; information signal. AM, FM, and phase-shift keying (PSK)."], ["7 · Patterns", "isotropic, omnidirectional, directional", "Isotropic: equal in every direction, an ideal yardstick that cannot be built. A dipole is omnidirectional: equal all round the rod, nothing off its ends. A dish puts nearly everything into one main lobe with small side lobes.", "Radiation pattern; directivity; main lobe and side lobes; half-power (3 dB) beamwidth."], ["8 · Gain", "≈ ½ × (π × D ÷ λ)²", "Cassini's 4 m dish at 3.6 cm: about 50,000 times stronger than isotropic in the beam (47 dBi), and the beam is only about 0.6° wide (70 × λ ÷ D).", "Antenna gain, in dBi. It concentrates power; it never adds any. The price is pointing accuracy."], ["9 · What it buys", "20 W looks like a megawatt", "Cassini transmitted 20 W. Through the dish that looked like 1,000,000 W toward Earth. After 1.4 billion km a 70 m dish collected about 10⁻¹⁶ W.", "High-gain antenna (HGA) for data; low-gain antenna (LGA) with a wide beam for when the spacecraft cannot point."]], "notes": ["Your voice is a sound wave, not a radio wave. A microphone turns it into a voltage at the same frequency; the lecture's 3,000 km is what a radio wave at that frequency would measure.", "Modulation has three payoffs: small antennas, many users sharing the air on separate carrier frequencies, and more data per second on a faster carrier.", "This is the same physics as Wi-Fi: 2.4 GHz is a 12.5 cm wave, and a router's stub antennas are a quarter of that."]}},
 {id:"win", n:12, name:"Two windows in the wall", color:"#3d5a80", sec:"S5",
  story:"The air around the Earth is a wall with two windows in it. One window lets in ordinary light, the kind your eyes use. The other lets in radio. Everything else gets stopped. The dangerous rays (ultraviolet, X-rays, gamma rays) are soaked up high in the sky, which keeps us alive. Heat rays (infrared) are soaked up by the water and carbon dioxide in the air. Very long radio waves bounce off an electric layer near the top, like a ball off a ceiling. Why? Light arrives in tiny packets, and the faster it wiggles, the harder each packet hits. Hard-hitting packets smash into air atoms and are used up; gentle radio packets slip between them. So to talk to a spacecraft from the ground you must use the radio window, in agreed slices with letter names like S, X and Ka. And to see X-rays or infrared from the stars you must lift the telescope above the wall, which is why Hubble and Webb are in space.",
  say:"The air is a wall with two windows, light and radio, so spacecraft talk by radio and some telescopes have to fly.",
  draw:"A row of hatched blocks with two gaps; an arrow through each gap labelled VISIBLE and RADIO.",
  why:[["Why do they put telescopes in space?", "The air blocks most of the spectrum. X-rays, ultraviolet and most infrared never reach the ground, so telescopes for those have to sit above the atmosphere. Visible-light ones go up to escape the blurring."], ["Why does the air stop ultraviolet but not radio?", "Each photon carries energy h × f. A UV photon has about 5 eV, enough to break air molecules, so it gets absorbed. A radio photon has millionths of an eV and nothing in the air can take it."], ["What do the band letters like X and Ka mean?", "Nothing. They are old radar code names for slices of the spectrum. X is 8 to 12 GHz, Ka is 27 to 40 GHz. Deep-space probes mostly send home at 8.4 GHz, in X-band."]],
  deep:{"title": "Why the air has two windows, and how the radio spectrum is carved up", "intro": "One rule explains the whole opacity chart: a photon is absorbed when its energy matches something the atmosphere can do with it. Then the naming systems, with things you already own in each band.", "rows": [["1 · Photon energy", "E = h × f", "Higher frequency means more energy in each photon. In handy units, energy in eV = 1,240 ÷ wavelength in nanometres. UV at 250 nm: 5 eV. Green light: 2.3 eV. Infrared at 10 µm: 0.12 eV. X-band radio at 3.6 cm: 0.000035 eV.", "Photon; Planck constant (h). The eV is the same unit used for bond energies in Section 2."], ["2 · Gamma, X-ray, UV", "enough to break atoms: absorbed up high", "Splitting an oxygen molecule takes about 5 eV and ionizing nitrogen about 15 eV. These photons have it, so they are used up 50 to 100 km overhead. That absorption is what creates the ozone layer and the ionosphere.", "Absorption by ionization and photodissociation. Opacity 100%."], ["3 · Visible", "matches nothing: passes", "1.8 to 3.1 eV is too little to break air molecules and far too much to match their vibrations, so clean air cannot take it. It is also where sunlight is brightest, which is why eyes evolved to use it.", "The optical window, 400–700 nm."], ["4 · Infrared", "shakes water and CO₂: absorbed", "Around 0.1 eV is exactly what sets water and carbon dioxide molecules bending and stretching. Most infrared is absorbed, which is the greenhouse effect and the reason infrared telescopes fly.", "Molecular vibration absorption."], ["5 · Radio window", "far too gentle: passes", "From roughly 30 MHz to 30 GHz (10 m to 1 cm) photons carry millionths of an eV and the air is transparent. Every spacecraft link lives here. At the top edge water vapour absorbs near 22 GHz, oxygen near 60 GHz, and rain weakens signals above 10 GHz.", "The radio window; rain fade."], ["6 · Long radio", "reflected by the ionosphere", "Below a critical frequency of about 9 × √(electrons per m³) hertz the ionosphere's free electrons respond fast enough to send the wave back. For 10¹² electrons per m³ that is 9 MHz. Shortwave radio skips round the planet and cannot reach a spacecraft.", "Ionospheric reflection; critical frequency. A different mechanism from absorption."], ["7 · Two naming systems", "decade bands and letter bands", "VLF, LF, MF, HF, VHF, UHF, SHF, EHF each cover ten times the frequency of the one before; satellites use SHF, 3 to 30 GHz. Inside 1 to 40 GHz the letter bands run L, S, C, X, Ku, K, Ka. GPS is L, Wi-Fi 2.4 is S, Wi-Fi 5 is C, satellite TV is Ku.", "ITU bands and IEEE letter bands. The ITU allocates who may use what."], ["8 · Uplink and downlink", "two frequencies per link", "Deep-space X-band goes up at 7.2 GHz and comes down at 8.4 GHz. If they were the same, the spacecraft's 20 W transmitter would deafen its own receiver, which is listening for something a billion billion times weaker.", "Uplink = Earth to spacecraft; downlink = spacecraft to Earth. Deep space, in radio rules, starts 2 million km out."], ["9 · Why climb the bands", "same dish, more gain", "Moving from X-band (8.4 GHz) to Ka-band (32 GHz) shortens the wavelength 3.8 times, so the same dish has 3.8² ≈ 14 times the gain and more room for data. The price is rain fade and a beam 3.8 times narrower.", "The trend in deep-space links: S, then X, then Ka."]], "notes": ["The lecture says high-energy radiation interacts 'basically always'. The sharper statement is about matching: infrared is weaker than visible light and still gets absorbed, because its energy fits molecular vibrations.", "This is the reason behind Section 1's 'look out' satellites: Hubble, Webb and X-ray telescopes are in orbit because their light cannot reach the ground.", "Your Wi-Fi sits in the same radio window: 2.4 GHz is S-band and 5 GHz is C-band."]}},
 {id:"link", n:13, name:"Shouting across a stadium", color:"#6a4c93", sec:"S5",
  story:"You want to tell a friend a secret across a huge, noisy stadium. First you pack the message small and add a few spare words so a missed word can be guessed: that is encoding. You put it on a whistle note that carries (modulation), move the note to the pitch you were told to use (up-conversion), and blow as hard as you can (the high-power amplifier) through a megaphone (the antenna). On the way your shout is not eaten. It spreads out: twice as far away it covers four times the area, so each ear gets a quarter. A helper halfway hears you faintly and shouts it on again (the repeater). Your friend cups a big ear and uses a hearing aid that adds almost no hiss of its own (the low-noise amplifier), then undoes every step in reverse. Whether the secret arrives depends on one thing: how loud your shout is compared with the crowd noise at your friend's ear. That comparison is the whole link equation.",
  say:"The signal doesn't get eaten, it spreads out; what matters is how loud it is compared with the noise.",
  draw:"Two stacks of four boxes with a satellite above, and a zigzag line: up, long way down, up, long way down, up.",
  why:[["Why does it take months to get pictures back from far-away probes?", "The signal arrives incredibly faint, about 10⁻¹⁶ watts from Saturn, and has to be read against the receiver's noise. The fainter it is, the slower you must send. Voyager 1 manages 160 bits per second."], ["Can't they just amplify the signal more?", "An amplifier boosts the noise by exactly the same factor. The ratio of signal to noise does not improve, and the ratio is what decides whether the bits can be read."], ["Where does the signal's power go on the way?", "Nowhere. It spreads over an ever bigger sphere, so a dish of fixed size catches a smaller share. Twice the distance, a quarter of the power."]],
  deep:{"title": "The link, end to end: the chain, the spreading loss, the noise and the budget", "intro": "Every box on the receiving side undoes one on the transmitting side. Between them the signal spreads until it is almost nothing, and the whole design is about keeping it above the noise.", "rows": [["1 · Encode", "compress, then protect", "Remove what is repeated (compression), then add structured spare bits so the receiver can repair errors. Good codes let about 5 times more data through the same link.", "Source coding and channel coding (forward error correction). Codec = coder + decoder."], ["2 · Modulate, then move", "70 MHz + 7,100 MHz = 7,170 MHz", "Write the bits onto a carrier at an easy fixed frequency, then mix with a steady tone to shift the finished signal up to the transmit band. Shifting changes nothing in the message.", "Modulator; up-converter. Intermediate frequency (IF) and radio frequency (RF)."], ["3 · Amplify out", "watts matter, noise doesn't", "At the transmitter the signal is huge compared with any noise, so the amplifier's only job is power: 20 W on Cassini, 20,000 W on a Deep Space Network dish.", "High-power amplifier (HPA). Power × transmit gain = EIRP."], ["4 · Space loss", "Lₛ = (4πd ÷ λ)²", "The wave spreads over a sphere of area 4πd². Twice the distance, a quarter of the power. To a GEO satellite the factor is about 10²⁰; from Saturn to Earth at 8.4 GHz it is 2.5 × 10²⁹.", "Free-space path loss. Spreading, not absorption; the air's share (Lₐ) is tiny by comparison."], ["5 · Repeat", "receive, shift, boost, resend", "A relay satellite hears perhaps 10⁻¹⁰ W, moves it to the downlink frequency so it cannot jam its own receiver, amplifies it about 10¹¹ times and sends it down.", "Transponder (the lecture's satellite repeater). A satellite that only does this is a bent-pipe relay."], ["6 · Amplify in", "N₀ = k × T", "Everything warm produces radio hiss: k × T watts in each hertz, with k = 1.38 × 10⁻²³. Noise added by the first amplifier is magnified by every later stage, so it must be the quietest part of the station. NASA cools its to about 15 K.", "Low-noise amplifier (LNA); thermal noise; Boltzmann constant; system noise temperature."], ["7 · The ratio", "S ÷ N₀", "No amplifier can tell signal from noise; it lifts both. The ratio set at the first amplifier is all the receiver ever has, and it fixes the data rate.", "Signal-to-noise ratio. Receive gain ÷ noise temperature (G/T) measures how good a station is."], ["8 · The budget", "13 + 47 − 294 + 74 = −160 dBW", "Cassini to a 70 m dish: 20 W (+13 dBW), 4 m dish (+47 dB), space loss (−294 dB), 70 m dish (+74 dB). Received: 10⁻¹⁶ W. Noise at 20 K: −216 dBW per hertz. S ÷ N₀ ≈ 56 dB-Hz, about 400,000.", "Link budget. Decibels turn multiplying into adding: +3 dB is ×2, +10 dB is ×10."], ["9 · What it buys", "about 100,000 bits per second", "Divide S ÷ N₀ by the factor of 2 to 4 that the code and a safety margin need: roughly 100,000 bits per second from Saturn (Cassini's real top rate was 166,000). Voyager 1, 17 times farther, has 300 times the loss and sends 160 bits per second.", "Data rate; link margin. The knobs: power, dish sizes, receiver temperature, coding. Distance is fixed."]], "notes": ["In the link equation k is the Boltzmann constant, which turns temperature into noise power. The lecture calls it a relation for wavelength; it is not.", "The lecture's diagram is a relay link, ground to satellite to ground: the communications satellite from Section 1. A science probe is one end of the link.", "The same ledger describes Wi-Fi: about +20 dBm transmitted, about −60 dBm received, noise floor near −95 dBm."]}},
 {id:"adcs", n:14, name:"Point, check, nudge", color:"#283593", sec:"S6",
  story:"A spacecraft has two different problems: where it is (its orbit) and which way it faces (its attitude). The dish has to face Earth and the panels have to face the Sun, and nothing in space holds it steady. So it works like the thermostat in your house, which feels the temperature, compares it with what you asked for and switches the heater. The spacecraft looks at the stars to see which way it is facing, compares that with where it should face, and nudges itself with a small twist. Then it looks again, forever. The second half is about spinning. Toss a coin spinning flat like a frisbee and it stays steady. Toss a pencil spinning around its length and it soon wobbles and ends up tumbling end over end. Things like to spin the fat way, with their weight as far from the spin line as possible. America's first satellite was a pencil spun around its length; within hours it was tumbling. The first Soviet one was a ball, which has no fat way, so nothing could go wrong.",
  say:"Attitude is which way it points; a loop of look, compare, nudge keeps it there, and things only spin steadily the fat way.",
  draw:"A box with three arrows (roll, pitch, yaw), four boxes in a ring, and a pencil next to a coin with their spin axes.",
  why:[["How does a spacecraft know which way it's facing?", "Sensors: cameras that recognize star patterns, detectors that find the Sun, and gyroscopes that feel rotation. The computer compares what they report with the wanted direction."], ["How does it turn with nothing to push on?", "It twists against something of its own. Spin a wheel inside one way and the spacecraft turns the other. Or fire a small thruster off-centre, or push against Earth's magnetic field with a coil."], ["Why did America's first satellite tumble?", "Explorer 1 was a long pencil spun about its length, which is its smallest moment of inertia. Its flexible antennas leaked spin energy, and a body losing energy ends up spinning about its biggest moment of inertia: end over end."]],
  deep:{"title": "The control loop, and why only the fat axis is a stable spin", "intro": "First half: what attitude is and how a feedback loop holds it. Second half: torque-free spinning, the major-axis rule, and what Explorer 1 taught everyone.", "rows": [["1 · Attitude", "orientation, not position", "Orbit says where the spacecraft is; attitude says which way it faces. It is described by three rotations: roll about the direction of travel, pitch about the across-orbit axis, yaw about the line to the planet.", "Attitude; roll, pitch, yaw. Measured against an inertial frame (the stars) or the orbital frame (LVLH)."], ["2 · The loop", "sensors → computer → actuators → spacecraft → sensors", "Sensors measure the attitude. The computer subtracts the wanted attitude to get the error and turns it into torque commands. Actuators apply the torque. The spacecraft turns, and the sensors measure again.", "ADCS, attitude determination and control system. Closed-loop (feedback) control."], ["3 · One correction", "about 12 seconds per degree", "Moment of inertia 100 kg·m², wheel torque 0.05 N·m: angular acceleration 0.0005 rad/s². Twist one way for 6 s and the other way for 6 s and the spacecraft has turned 1° and stopped.", "Torque = force × lever arm. Angular acceleration = torque ÷ moment of inertia."], ["4 · Jitter", "fast trembling that never fully stops", "Wheels are never perfectly balanced, pumps hum and panels creak as they heat and cool. That adds a fast tremble on top of the loop's slow corrections. Hubble holds 0.007 arcseconds: a hair seen from 3 km.", "Pointing accuracy versus pointing stability. Jitter can be reduced, never removed."], ["5 · Moment of inertia", "I = sum of mass × distance²", "A 14 kg pencil 2 m long and 16 cm wide: about its long axis 0.044 kg·m², about an axis across its middle 4.9 kg·m². The second is 110 times bigger because the ends are a metre from that axis.", "Moment of inertia: the rotational version of mass. Major axis = maximum, minor a
