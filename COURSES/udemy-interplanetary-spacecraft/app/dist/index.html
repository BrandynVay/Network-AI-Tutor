xis = minimum."], ["6 · What is kept, what leaks", "L stays, energy drains", "With no outside torque, angular momentum L = I × spin rate is fixed. Spin energy is L² ÷ (2 × I). Flexing antennas and sloshing fuel turn energy into heat, so the body slides toward the lowest-energy spin: about its biggest I.", "Torque-free motion; the major-axis rule; energy dissipation."], ["7 · Explorer 1", "750 rpm → about 7 rpm, end over end", "Spun about its long axis with 135 J of spin energy. Its four whip antennas flexed. With L fixed, the spin rate had to drop by the same factor of 110 that I rose, leaving about 1 J.", "Flat spin. It still worked for four months and found the Van Allen radiation belts."], ["8 · Sputnik 1 and the fix", "a ball has no favorite axis", "A sphere has the same moment of inertia about every axis, so there is nothing to slide toward. Sputnik's antennas radiated in all directions, so its attitude did not matter. The lasting fix for spinners: make the spin axis the fat one, a drum shape.", "Spin stabilization versus three-axis stabilization."]], "notes": ["The lecture says moment of inertia is 'the amount of mass in a direction'. It is how far the mass is from the axis, squared. His conclusions for sphere, rod and disk are right.", "For a perfectly rigid body, spin about the smallest axis is stable too; only the in-between axis is unstable. Flip a phone about each of its three axes (over a bed) to see it.", "Explorer 1 was not a failure: its tumble is how the major-axis rule was discovered."]}},
 {id:"sens", n:15, name:"Inner ear, eyes and a compass", color:"#00695c", sec:"S6",
  story:"Sit on a spinning office chair with your eyes shut. Your inner ear feels the turning, so for a few seconds you know roughly which way you face. Keep going and you lose track. That is a gyroscope: it feels turning instantly, but small mistakes pile up. Now open your eyes. Find the Sun: one bright thing, easy, but it gives only one direction and it vanishes in the Earth's shadow. Recognize the constellations: now you know exactly how you are turned, though it takes a careful look. Find the horizon: that tells you which way is down. Check a compass: rough, but it works in the dark. A spacecraft has all of these, and here is why. Point your arm straight at the Sun. You can still roll your wrist without your arm leaving the Sun. One direction pins down two of your three turns; you need a second, different direction for the third.",
  say:"A spacecraft finds its pointing like you would: an inner ear that drifts, plus eyes on the Sun, the stars and the horizon, and a compass.",
  draw:"A box with arrows to a Sun, a cluster of dots, a curved Earth edge and a dashed field line; a sawtooth graph underneath.",
  why:[["Why does it need so many different sensors?", "One measured direction fixes only two of the three angles; you can still spin about that direction. And each sensor has a blind spot: the Sun sensor in eclipse, the star tracker when dazzled, the magnetometer far from Earth."], ["If gyroscopes feel every turn, why isn't that enough?", "A gyro only measures how fast you are turning. To get the angle you add those up, and the small errors add up too: it drifts. Something that sees an outside reference, like a star tracker, has to reset it."], ["Why does the horizon sensor look in infrared?", "In infrared the Earth is a warm, even disc at about 255 K against space at 2.7 K, day and night. In visible light half of it is dark and the edge is not sharp."]],
  deep:{"title": "Six ways to measure attitude, and why they are always combined", "intro": "Two ideas organize the whole lecture: a single direction gives only two angles, and gyros are fast but drift while outside references are exact but slower.", "rows": [["1 · Two arrows", "one direction = two angles", "Knowing the direction to one object leaves you free to rotate about that direction. Two different directions, such as the Sun and the magnetic field, or two stars, fix all three angles.", "The basis of every attitude solution. A star tracker sees many stars, so one instrument is enough."], ["2 · Gyroscope", "feels rotation; drifts", "A spinning rotor keeps its axis fixed in space, so the frame's turning around it can be measured. Output is turn rate, about 100 times a second. Summing rates gives angle, and errors sum too: 0.01° per hour of drift is 0.24° after a day.", "Rate gyro; gyro drift. Modern ones (fibre-optic, ring laser) time light round a loop and have no spinning parts."], ["3 · Sun sensor", "current ∝ cosine of the angle", "A solar cell gives less current as the Sun moves off straight-on. Four cells under one pinhole, compared, give two angles to the Sun. About 1° for bare cells, 0.01° for fine sensors. Tens of grams.", "Coarse and fine Sun sensors. Useless in eclipse; used for safe mode because the Sun is easy to find."], ["4 · Star tracker", "about 3 arcseconds, all three axes", "A camera images 10 to 50 stars, measures the angles between them and finds that pattern in a catalogue of a few thousand stars. One image gives the full attitude, several times a second.", "Star catalogue; 'lost in space' solution. Blinded by the Sun, Earth or Moon and fails if the spacecraft tumbles fast."], ["5 · Horizon sensor", "warm disc against cold space", "Earth radiates like a 255 K body, peaking near 11 µm (2,898 ÷ T); space is 2.7 K. At about 15 µm the planet is a sharp, even disc. From 400 km it spans 140°. Its centre is 'down', giving roll and pitch to about 0.1°.", "Earth sensor. It cannot measure yaw, the rotation about the down direction."], ["6 · Magnetometer", "a three-axis compass", "In low orbit the field is 25 to 65 microtesla. Compare the measured direction with what a field model predicts at your position: about 1°. The field falls with distance cubed: about 0.1 microtesla at GEO.", "Geomagnetic field model (IGRF). Mounted on a boom, away from the spacecraft's own magnetism."], ["7 · GPS attitude", "several antennas, one spacecraft", "A GPS signal reaches antennas a metre apart at very slightly different moments. Those differences give the orientation to about 0.3°. Only works below the GPS satellites.", "GPS attitude determination. Low Earth orbit only."], ["8 · Fusion", "gyros carry, stars correct", "The gyros carry the attitude from moment to moment; each star-tracker fix pulls the estimate back to the truth. The error is a sawtooth: slow ramp, sudden reset.", "Sensor fusion, usually a Kalman filter. Absolute sensors versus the relative gyro."]], "notes": ["The lecture says a gyroscope determines 'position and orientation'. It measures rotation rate only.", "The Cubli shown on the slide is a balancing cube driven by reaction wheels, which are actuators, not a gyroscope.", "Star trackers are used in Earth orbit as well as deep space; they are chosen for accuracy, not because the Sun is dim."]}},
 {id:"act", n:16, name:"Spin a wheel, turn the ship", color:"#ad1457", sec:"S6",
  story:"Sit on a swivel chair with your feet up and swing your arms hard to the left. The chair turns to the right. You pushed on nothing; you and your arms traded spin. That is a reaction wheel: a motor spins a heavy wheel one way and the whole spacecraft slowly turns the other way. Stop the wheel and the spacecraft stops, pointing somewhere new, with no fuel used. The catch: sunlight and thin air keep nudging the spacecraft the same way, day after day. To hold still the wheel must spin faster and faster to soak that up, until it hits top speed. It is full: saturated. To empty it you must push on something outside: a puff from a small thruster, or an electromagnet that leans on the Earth's magnetic field like a compass needle, called a magnetic torquer. For very big spacecraft there is a stronger trick. Hold a spinning bicycle wheel by its axle and try to tilt it: it twists hard in your hands. A control moment gyro is that wheel, tilted on purpose. Four of them steer the Space Station.",
  say:"Spin a wheel one way and the ship turns the other; when the wheels fill up, a thruster or a magnet empties them.",
  draw:"A box with a wheel inside and opposite arrows; a tilted wheel; a coil on a dashed field line; a box with two opposite jets; a sawtooth that hits a ceiling.",
  why:[["How does it turn with nothing to push against?", "It pushes against part of itself. A motor spins a wheel one way and the rest of the spacecraft turns the other way, because the total spin cannot change. Stopping the wheel stops the turn."], ["If wheels need no fuel, why carry thrusters at all?", "Wheels only trade spin with the spacecraft. Steady outside nudges keep adding spin, the wheels absorb it by speeding up, and eventually they hit top speed. Only something that pushes on the outside, a thruster or a magnetic torquer, can remove it."], ["What steers the Space Station?", "Four control moment gyros: 98 kg wheels at 6,600 rpm on gimbals. Tilting a wheel's axis gives about 258 N·m, thousands of times more than a reaction wheel."]],
  deep:{"title": "Five actuators, two kinds: trading spin inside, pushing on something outside", "intro": "Wheels and CMGs are internal: they exchange angular momentum with the spacecraft. Thrusters and magnetorquers are external: they change the total. Every design pairs one of each.", "rows": [["1 · The swap", "wheel spin + craft spin = constant", "Wheel inertia 0.01 kg·m², spacecraft 100: a ratio of 10,000. Spin the wheel to 1,000 rpm and the craft turns at 0.1 rpm (0.6° per second) the other way. Brake the wheel and the craft stops.", "Reaction wheel; conservation of angular momentum. The helicopter tail rotor exists to cancel the same reaction."], ["2 · Momentum vs reaction wheel", "always spinning, or resting at zero", "A reaction wheel sits near zero and is spun either way; three give three-axis control, a slanted fourth is a spare. A momentum wheel keeps a large spin all the time, which also stiffens the craft against tipping.", "Bias momentum; gyroscopic stiffness. Kepler lost two of four wheels and could no longer point."], ["3 · Saturation", "full in days", "A steady disturbance of 0.00001 N·m for one day adds 0.86 N·m·s. A wheel that holds 4 N·m·s is at top speed in under 5 days.", "Saturation limit. Caused by persistent outside torques, not by 'instabilities'."], ["4 · Dumping", "push on the outside while the wheel slows", "A magnetorquer or thruster twists the craft one way; the wheel slows to cancel it. The extra angular momentum leaves the spacecraft.", "Momentum dumping (desaturation). Needs an external torque."], ["5 · Control moment gyro", "torque = angular momentum × gimbal rate", "The Space Station's: a 98 kg wheel at 6,600 rpm stores 4,760 N·m·s. Tilt its axis at 0.054 rad/s (3.1° per second): 4,760 × 0.054 ≈ 258 N·m. A reaction wheel gives about 0.1 N·m.", "CMG: constant speed, changing direction. High slew rates for heavy or agile spacecraft."], ["6 · Magnetorquer", "torque = dipole × field", "A coil of 10 A·m² in a 30 microtesla field gives 0.0003 N·m. Tiny, but it needs only electricity. No torque about the field line itself, and it needs a strong field.", "Magnetic torquer, torque rod. Low Earth orbit; used mostly to dump wheel momentum."], ["7 · Thrusters", "torque = force × arm", "Two 1 N jets, each 1 m from the centre of mass, firing opposite ways: 2 N·m with no net push. Each firing spends propellant for good.", "Reaction control system; a couple; cold-gas (nitrogen) or hydrazine thrusters."], ["8 · Why wheels are not spun faster", "stress = density × rim speed²", "A 20 cm wheel at 6,000 rpm has a rim speed of 63 m/s. At 65,000 rpm it would be 680 m/s and about 3.6 GPa of stress, beyond steel. Flight wheels run at a few thousand rpm.", "Centrifugal stress sets the speed limit, so angular momentum is bought with rim mass and radius."]], "notes": ["The lecture never states the internal versus external distinction, which is the reason spacecraft carry both wheels and thrusters or magnetorquers.", "A magnetorquer is an actuator, not a sensor, and it does not work like a CMG: it pushes against the planet's magnetic field.", "The slide's 'Reactor wheels' and '3 axis determination' are typos for reaction wheels and three-axis control."]}},
 {id:"sun", n:17, name:"The sunlight sandwich", color:"#ef6c00", sec:"S7",
  story:"Sunlight is a rain of tiny packets of energy, the photons from Section 5. A solar cell is a sandwich made of two slightly different slices of crystal. Where the slices touch there is a built-in one-way slope. A packet of light knocks an electron loose, like a ball knocked off a shelf. The slope rolls it to one side, and the only way back is the long way round, through a wire and through your equipment. That flow is electricity. Nothing moves and nothing burns. Two catches. Each crystal only uses packets of the right size: too small and they pass straight through, too big and the extra is wasted as heat. So the best cells stack three crystals, each tuned to a different colour, and catch about 30% of the light. And sunlight spreads out exactly like the radio signal did: twice as far from the Sun, a quarter as much. At Jupiter it is 27 times weaker than here, so the Juno probe needs three panels, each as long as a bus, to make what a hair dryer uses.",
  say:"A solar cell is a crystal sandwich with a one-way slope: light frees an electron and it has to go round the wire to get back.",
  draw:"Five bars shrinking from Mercury to Jupiter; a two-layer box with a photon, an electron and a wire loop; a three-layer stack with three arrows.",
  why:[["How does a solar panel actually make electricity?", "A photon frees an electron inside a crystal made of two layers. An electric field built into the boundary pushes the electron to one layer and it can only return through the outside wire. That flow through the wire is the current."], ["Why are solar panels only about 30% efficient?", "Each material uses only photons near its own band gap. Weaker photons pass through and stronger ones waste their extra as heat. One layer manages about 20%; stacking three for three colour ranges reaches about 30%."], ["Why doesn't everything in space just use solar panels?", "Sunlight falls with the square of distance: 1,361 W/m² at Earth, 50 at Jupiter, 15 at Saturn. Beyond Jupiter the arrays would be impractically large. They also make nothing in shadow."]],
  deep:{"title": "Solar arrays: flux, the p–n junction, three junctions, and sizing", "intro": "Four steps take you from the Sun to a number of watts: how much light arrives, how one cell turns a photon into current, why three layers beat one, and the sizing formula.", "rows": [["1 · Solar flux", "1,361 ÷ distance²", "Sunlight spreads over a growing sphere. In W/m²: Mercury (0.39 AU) 9,100; Venus 2,600; Earth 1,361; Mars 590; Jupiter (5.2 AU) 50; Saturn 15.", "Solar flux (irradiance); solar constant; inverse-square law. Same spreading as free-space loss in Section 5."], ["2 · Two layers", "n-type and p-type", "Silicon with a trace of phosphorus has spare electrons (n-type). With a trace of boron it has missing electrons, called holes (p-type). Where they meet, electrons drop into holes and leave a thin zone with a permanent electric field.", "Semiconductor; doping; p–n junction; depletion region; built-in field."], ["3 · A photon arrives", "it must beat the band gap", "A photon with at least the band-gap energy frees an electron and leaves a hole. Silicon: 1.1 eV, so wavelengths shorter than 1,240 ÷ 1.1 ≈ 1,100 nm.", "Photovoltaic effect; band gap. eV = 1,240 ÷ wavelength in nm."], ["4 · Sorting", "0.6 V per silicon cell", "The built-in field sweeps electrons to the n side and holes to the p side. Charge piles up as a voltage. Connect a wire and electrons flow from n through the load to p.", "The field, not the photon, drives the current. Cells are wired in strings to add their voltages."], ["5 · Losses", "one material tops out near 33%", "Photons below the gap pass through. Photons above it give up their extra as heat. Real silicon cells reach about 20%.", "Single-junction limit."], ["6 · Triple junction", "three band gaps, about 30%", "Top layer 1.9 eV (light to 650 nm), middle 1.4 eV (to 890 nm), bottom 0.67 eV (to 1,850 nm). Each uses its range well and passes the rest down. About 2.7 V per cell.", "Multi-junction cell: gallium indium phosphide / gallium arsenide / germanium."], ["7 · Sizing", "P = flux × area × efficiency × cos(tilt)", "1 m² at Earth: 1,361 × 0.30 ≈ 410 W. With 0.8 for wiring, gaps and ageing, 1,000 W needs 3.1 m² at Earth, 7.1 m² at Mars, 83 m² at Jupiter.", "Cosine loss; beginning-of-life versus end-of-life power. Juno: about 60 m², roughly 500 W at Jupiter."], ["8 · Temperature", "hotter = fewer volts", "Power falls about 0.2–0.4% per degree of warming. A panel leaving Earth's shadow at about −80 °C is at its best and loses output as it heats to +60 °C.", "I–V curve; maximum power point; thermal cycling, about 15 times a day in low orbit."], ["9 · Deployable or body-mounted", "area decides", "Deployable wings unfold after launch and give tens of square metres; a drive keeps them facing the Sun. Body-mounted cells are simple but only the sunlit faces work.", "Solar array drive; hold-down and release mechanisms. Juno and Rosetta versus CubeSats and Philae."]], "notes": ["A triple-junction cell does not triple the efficiency: about 20% becomes about 30%.", "The photon only frees the electron. The junction's built-in field is what pushes it round the circuit.", "Low Earth orbits take 90–100 minutes, not two hours, so a panel sees about 15 to 16 hot-cold cycles a day."]}},
 {id:"batt", n:18, name:"The bucket for the dark", color:"#558b2f", sec:"S7",
  story:"Solar panels are like rain: wonderful while it lasts, but in low orbit the spacecraft flies into the Earth's shadow sixteen times a day. So it carries a bucket. In sunlight the panels run everything and fill the bucket. In the dark the bucket runs everything. That bucket is the secondary battery, the rechargeable kind, like the one in your phone. The other kind, the primary battery, is a firework: it holds more punch for its weight but works once, so it is used for one-time jobs like firing the small charges that release the solar panels. The whole subject comes down to one choice: how far down do you drain the bucket each time? That is the depth of discharge. Your phone battery lasts years longer if you keep it between 80% and 100% than if you run it flat every day. A spacecraft battery is the same, and it gets about 6,000 cycles a year. Drain it gently and it lives, but to drain it gently you need a much bigger bucket, and every kilo costs.",
  say:"The battery is a bucket for the dark; drain it gently and it lasts, but then it has to be bigger and heavier.",
  draw:"Two boxes (one-shot, rechargeable); a zigzag between 100% and 70%; a curve falling from 80% at 700 cycles to 5% at 15,000.",
  why:[["What powers a satellite when it's behind the Earth?", "A rechargeable battery. The solar array runs the spacecraft and charges the battery in sunlight, and the battery carries the whole load during eclipse, up to 36 minutes of every 92-minute low orbit."], ["Why not use the whole battery each time?", "Deep cycles wear a battery out quickly. On the lecture's curve, draining 80% each time gives about 700 cycles, while 30% gives 2,000 and 10% gives 7,000. A low-orbit battery needs nearly 6,000 cycles a year."], ["Why carry a battery that can't be recharged?", "A primary battery stores two to three times more energy per kilo and sits ready for years. It is ideal for jobs that happen once: firing pyrotechnics, separating stages, or a probe that only works for a few hours."]],
  deep:{"title": "Batteries: two kinds, depth of discharge, and how to size one", "intro": "A battery covers the eclipse. Its size comes from three numbers: the load, the time in shadow and the depth of discharge you can afford for the cycle life you need.", "rows": [["1 · Inside a cell", "ions inside, electrons outside", "Two electrodes hold lithium with different strength. The electrolyte between them passes lithium ions but not electrons, so when lithium crosses inside, its electrons are forced round the external circuit. About 3.6 V per lithium-ion cell; eight in series give a 28 V bus.", "Anode, cathode, electrolyte. Charging pushes the lithium back."], ["2 · Primary and secondary", "one shot, or rechargeable", "A primary cell's reaction cannot be reversed, which permits more energetic chemistry: about 400–500 Wh/kg. Lithium-ion stores 150–250 Wh/kg; older nickel-hydrogen about 60.", "Primary battery; secondary battery; specific energy (energy density)."], ["3 · Units", "Wh = Ah × V", "Capacity is charge, in ampere-hours. Stored energy is in watt-hours. 71 Ah at 28 V is about 2,000 Wh.", "Capacity; stored energy; average discharge voltage."], ["4 · The eclipse", "36 minutes of every 92", "At 400 km the orbit is 92 minutes with up to 36 in shadow (0.6 h). About 16 orbits a day: 5,800 cycles a year.", "Eclipse (the lecture's 'penumbra time'). One charge and one discharge per orbit."], ["5 · Depth of discharge", "percentage of capacity used", "80% remaining means a DoD of 20%. Equivalently DoD = energy removed ÷ (capacity × voltage).", "Depth of discharge (DoD); state of charge = 100% − DoD."], ["6 · Sizing", "battery energy = load × eclipse time ÷ DoD", "1,000 W × 0.6 h = 600 Wh used. At 30% DoD the battery must hold 2,000 Wh, about 13 kg at 150 Wh/kg. At 80% DoD: only 750 Wh and 5 kg, but it wears out several times sooner.", "The trade between mass and life."], ["7 · Why depth costs life", "strain and lost lithium", "Electrodes swell and shrink as lithium enters and leaves; deeper swings strain them and drive side reactions that lock lithium away. The lecture's curve: 80% → 700 cycles, 30% → 2,000, 10% → 7,000, 5% → 15,000.", "Cycle life. Modern lithium-ion does better than this curve but follows the same shape."], ["8 · Low orbit versus GEO", "5,800 cycles a year versus 90", "A GEO satellite is eclipsed only around the equinoxes, at most 72 minutes, about 90 times a year. With so few cycles it can use 60–80% DoD; low-orbit batteries stay at 20–40%.", "Eclipse seasons."], ["9 · Recharging", "the array must do two jobs", "The 600 Wh has to be returned in 56 minutes of sunlight: 600 ÷ 0.93 h ÷ 0.9 ≈ 710 W on top of the 1,000 W load. The array must supply about 1,700 W.", "Charge rate; round-trip efficiency. Links battery sizing to solar array sizing."]], "notes": ["In eclipse the battery is the only power source, not auxiliary power.", "Low orbits take about 92 minutes, so about 16 cycles a day, not 12.", "Batteries are kept between roughly 0 and 25 °C by heaters and radiators; cold and heat both shorten their life."]}},
 {id:"rtg", n:19, name:"The rock that stays warm", color:"#5d4037", sec:"S7",
  story:"Imagine a lump of metal that is hot to the touch and stays hot for a hundred years with nothing plugged in. Plutonium-238 is that lump. Its atoms are unstable: one by one, each spits out a tiny piece of itself, and every spit is a little kick of heat. A fresh pellet glows red by itself. Nobody starts it and nobody can stop it. Now the trick for getting electricity: join two different materials, heat one end and keep the other end cold, and a small voltage appears. So you wrap hundreds of these little pairs around the hot lump and put cooling fins on the outside. That is the whole machine: no moving parts, nothing to wear out. It works in the dark, in a dust storm, at Pluto. The catches: only about 6% of the heat becomes electricity, the plutonium is rare and radioactive so launching it is a political fight, and the power slowly fades. Voyager has been running on three of them since 1977.",
  say:"An RTG is a lump of plutonium that keeps itself hot, wrapped in strips that turn hot-versus-cold into electricity.",
  draw:"A big circle turning into a slightly smaller one plus a tiny one; a finned ring with a hot centre; two bars joined at a hot end; a slowly falling curve.",
  why:[["How does Voyager still have power after 50 years?", "It carries three RTGs. Plutonium-238 decays by itself and makes heat; thermocouples around it turn the temperature difference into electricity. It gave 470 W in 1977 and gives roughly 220 W now."], ["Is that a nuclear reactor?", "No. A reactor runs a controlled fission chain reaction. An RTG only uses the natural decay of its fuel: there is no chain reaction, nothing to control, and nothing that can be switched off."], ["Why not use RTGs everywhere?", "They turn only about 6% of their heat into electricity, give just a few hundred watts each, cost a great deal, and the plutonium is scarce and politically difficult to launch. Solar arrays are far better wherever there is enough sunlight."]],
  deep:{"title": "RTGs: decay heat, the Seebeck effect, and a check against Galileo's numbers", "intro": "Two physical steps: radioactive decay makes heat, and thermocouples turn a temperature difference into voltage. Then the half-life tells you how the power fades.", "rows": [["1 · Alpha decay", "Pu-238 → U-234 + α", "A plutonium-238 nucleus (94 protons, 144 neutrons) emits an alpha particle (2 protons, 2 neutrons) and becomes uranium-234 (92 and 142).", "Radioisotope; radioactive decay; alpha particle. Spontaneous: it cannot be started or stopped."], ["2 · Heat", "0.57 W per gram", "The alpha particle is stopped within a hair's width of fuel and its kinetic energy becomes heat. Galileo's 7.5 kg of plutonium-238 gave about 4,300 W of heat; the fuel runs near 1,000 °C.", "Thermal power. The fuel is ceramic plutonium dioxide in general purpose heat source modules."], ["3 · Seebeck effect", "hot end + cold end → voltage", "Heat makes charge carriers drift from the hot end of a material to the cold end. Two different materials drift differently, so joined at the hot end they leave a voltage between their cold ends. 572 silicon-germanium pairs in series give about 30 V.", "Thermoelectric effect; thermocouple (unicouple); hot and cold junctions."], ["4 · Efficiency", "about 6–7%", "Hot side about 1,000 °C, cold side about 300 °C. 290 W of electricity from 4,300 W of heat is 6.7%. The remaining 4,000 W is radiated by the fins.", "Thermal versus electrical watts. The fins exist to keep the cold side cold."], ["5 · Half-life", "P = P₀ × 0.5^(t ÷ 87.7)", "Plutonium-238 loses half its atoms in 87.7 years, about 0.8% of its power per year.", "Half-life. Beginning-of-life and end-of-life power."], ["6 · Check: Galileo", "290 W → 250 W in 14 years", "0.5^(14 ÷ 87.7) = 0.895, so decay alone takes 290 W to 260 W. Ageing of the thermocouples accounts for the rest of the slide's 250 W.", "55 kg, 114 cm long, 42 cm across: about 5 W per kg."], ["7 · Why plutonium-238", "easy to shield, right half-life", "Alpha particles are stopped by paper, so little shielding is needed. 88 years is long enough for a mission and short enough to be hot. Strontium-90 (29 years) needs heavy shielding; americium-241 (432 years) gives a fifth of the heat per gram.", "Isotope choice. Plutonium-238 is not weapons material; that is plutonium-239."], ["8 · Where it is used", "far from the Sun, or long dark", "Voyager 1 and 2, Galileo, Cassini, New Horizons. Also the Mars rovers Curiosity and Perseverance, for dust and night, and Apollo's lunar instruments, for two-week nights.", "Solar flux at Saturn is 15 W/m², at Pluto under 1 W/m²."], ["9 · Safety and politics", "built to survive an accident", "Pellets are clad in iridium inside graphite shells designed to survive a launch failure and re-entry. Apollo 13's heat source lies intact in the Pacific. Launch approval is still slow and contested, and the fuel is scarce.", "Why Europe has rarely used them and NASA uses them sparingly."]], "notes": ["The proper name is radioisotope thermoelectric generator; the slides say 'thermal'.", "The lecture's '500 years' is wrong; the slide's '100 years' is generous. Useful life is decades.", "An RTG is a power source, not an engine. It is the item Section 4 warned you not to confuse with nuclear propulsion."]}},
];

// Multiple-choice questions. a = index of correct option. x = explanation.
const MC = [
 {s:"fall", q:"Why doesn't an orbiting satellite fall down?", o:["There is no gravity in space","It IS falling, but moves sideways so fast the ground curves away","Its engines hold it up","The vacuum pushes it up"], a:1, x:"An orbit is falling and missing. Gravity is almost as strong at 400 km as on the ground."},
 {s:"fall", q:"Why do astronauts float inside the ISS?", o:["No gravity up there","They are falling together with the station","The station spins to cancel gravity","Air pressure lifts them"], a:1, x:"Everyone and everything on board is in free fall together, so nothing presses on anything."},
 {s:"fall", q:"How does a satellite stay in orbit once it's there?", o:["It fires its engines sideways continuously","It does nothing; it's moving sideways so fast that it keeps missing the ground","It balances on the edge of Earth's gravity","Solar panels push it up"], a:1, x:"Engines are off for years. The rocket gave it sideways speed once; gravity does the rest."},
 {s:"fall", q:"At 400 km, how strong is gravity compared to the ground?", o:["Zero","About 10%","About 90%","Twice as strong"], a:2, x:"8.7 m/s² vs 9.8. Astronauts float because they're falling with the station, not because gravity is gone."},
 {s:"fall", q:"In one second the ISS drops about 4.3 m toward Earth. Why doesn't it get closer to the ground?", o:["Its engines lift it 4.3 m","In that second it moved 7.7 km sideways, and the ground curved away by 4.3 m","Air pressure holds it up","It's above gravity"], a:1, x:"Drop equals curve. That cancellation is the orbit."},
 {s:"fall", q:"What is the main thing a launch rocket provides?", o:["Height","Sideways speed, about 7.7 km/s","Fuel for the satellite","Oxygen"], a:1, x:"Height is cheap. Getting to 7.7 km/s horizontal is the expensive part; that's why launches tip over early."},
 {s:"fall", q:"For a satellite, gravity plays the role of…", o:["A brake","The string on a swung ball: the inward pull that bends motion into a circle (centripetal force)","A push outward","Nothing; there's no gravity in space"], a:1, x:"Cut the string and the ball flies straight. Switch off gravity and the satellite would fly straight."},
 {s:"fall", q:"Why does the ISS fire its thrusters about once a month?", o:["To stay in orbit against gravity","To undo the tiny slowdown from thin air (reboost, station-keeping)","To turn toward the Sun","To dodge the Moon"], a:1, x:"It loses ~2 km of altitude a month to drag. That's maintenance, not 'staying up.'"},
 {s:"fall", q:"A spacecraft is tumbling out of control. What happens to its orbit?", o:["It falls to Earth","It flies off into space","Nothing; attitude (pointing) and orbit (path) are separate","It speeds up"], a:2, x:"Attitude control changes where it points, never where it goes. Two different jobs, two different systems."},
 {s:"shelf", q:"A satellite is parked in a 300 km orbit and needs to reach GEO. What are the two burns?", o:["One big burn straight up","Prograde at perigee to raise apogee to 35,786 km, then prograde at apogee to circularize","Retrograde at perigee, then retrograde at apogee","A sideways burn at the equator"], a:1, x:"GTO: +2.4 km/s then +1.5 km/s, 5.3 hours apart. Your perigee/apogee burn rule, applied."},
 {s:"hoop", q:"Which single burn is the most expensive per degree of change?", o:["Raising apogee","Changing inclination (plane change)","Raising perigee","Rotating perigee"], a:1, x:"Δv = 2·v·sin(Δi/2). At LEO speed 1° costs ~134 m/s. That's why you launch into the right plane and change planes at apogee if you must."},
 {s:"fuel", q:"Why is fuel cost 'exponential' in Δv?", o:["Because engines overheat","Because of the rocket equation: mass ratio = e^(Δv / Isp·g₀), so each extra km/s multiplies the propellant needed","Because fuel is expensive to buy","Because gravity grows with speed"], a:1, x:"3.6 km/s to Mars needs 56% propellant. 60 km/s for a 20-day trip would need 99.9999%. Impossible."},
 {s:"flyby", q:"What three things set how much a flyby bends your path?", o:["Spacecraft color, mass and age","Approach speed, closest-approach distance, and the planet's mass","Time of day, season, and fuel","Solar panel size, antenna size, and weight"], a:1, x:"sin(δ/2) = 1/(1 + r_p·v∞²/μ). Slow, close, and massive = big bend."},
 {s:"fall", q:"How many times a day does the ISS circle Earth?", o:["About 1","About 4","About 16","About 50"], a:2, x:"One lap takes about 92 minutes, so roughly 16 laps a day."},
 {s:"shelf", q:"LEO is roughly which altitude band?", o:["0–200 km","200–2,000 km","2,000–35,786 km","35,786 km exactly"], a:1, x:"Low Earth Orbit: 200 to 2,000 km. The ISS sits at 400 km."},
 {s:"shelf", q:"About how long is one lap in LEO?", o:["90 minutes","12 hours","24 hours","A week"], a:0, x:"LEO periods run 1.5 to 2 hours. Higher orbits take longer."},
 {s:"shelf", q:"Where does GPS live, and how long is its lap?", o:["LEO, 90 min","MEO, 12 h","GEO, 24 h","Beyond the Moon"], a:1, x:"GPS is at about 20,200 km, in MEO, with a 12-hour period."},
 {s:"shelf", q:"Why is GEO at exactly 35,786 km?", o:["It's the edge of the atmosphere","It's a round number in miles","It's the one altitude where one lap takes exactly one Earth rotation","It's the Moon's distance divided by 10"], a:2, x:"Calculated, not chosen. Lower is too fast, higher is too slow."},
 {s:"shelf", q:"Why can't a TV satellite hang over New York?", o:["New York is too cold","Every orbit is centered on Earth's center; only the equator moves in a matching circle","Too many buildings block the signal","It would fall faster at 41° north"], a:1, x:"Over New York it would drift north and south every day, tracing a figure 8. Only the equator works."},
 {s:"shelf", q:"Geosynchronous vs geostationary: which one hangs over one spot?", o:["Geosynchronous","Geostationary","Both","Neither"], a:1, x:"Geosynchronous = one-day lap at any tilt. Geostationary = one-day lap AND over the equator."},
 {s:"shelf", q:"Going higher, what gets WORSE?", o:["Coverage","Detail and radio delay","Lifetime","Fuel to stay up"], a:1, x:"Higher sees more but sees it blurrier and the radio takes longer. Coverage gets better."},
 {s:"shelf", q:"Why does GPS need 24+ satellites while a TV satellite needs 1?", o:["GPS satellites are cheaper","GPS is lower, each sees a patch and keeps moving, so you need many for 4 always overhead","GPS satellites break more often","TV signals are stronger"], a:1, x:"Low and moving means a swarm. GEO sees a third of the planet and never moves."},
 {s:"shelf", q:"What is a constellation?", o:["A star pattern used for navigation","A group of satellites in planned orbits working as one system","Any satellite above GEO","The rings of Saturn"], a:1, x:"GPS, Starlink and Iridium are constellations: a swarm so someone is always overhead."},
 {s:"shelf", q:"How many GPS satellites does your phone need to see at once?", o:["1","2","At least 4","All 24"], a:2, x:"Three for position and a fourth to fix the phone's clock error."},
 {s:"shelf", q:"The ISS orbits inside which atmospheric layer?", o:["Stratosphere","Mesosphere","Thermosphere","Exosphere"], a:2, x:"At 400 km it is in the thermosphere, which runs roughly 90 to 500 km."},
 {s:"hoop", q:"How many numbers fully describe an orbit?", o:["2","3","6","12"], a:2, x:"Size, shape, tilt, swivel, spin, position: a, e, i, Ω, ω, ν."},
 {s:"hoop", q:"Which parameter is the only one that changes as the satellite moves?", o:["a, semi-major axis","e, eccentricity","i, inclination","ν, true anomaly"], a:3, x:"Five freeze the hoop; true anomaly says where the bead is right now."},
 {s:"hoop", q:"What does eccentricity measure?", o:["How tilted the orbit is","How squashed the ellipse is","How fast the satellite goes","How big the orbit is"], a:1, x:"0 is a circle, near 1 is a cigar, over 1 never closes (a flyby)."},
 {s:"hoop", q:"Where is a satellite moving fastest?", o:["Apogee","Perigee","Halfway between","Same speed everywhere"], a:1, x:"Like a swing: fastest at the bottom (perigee), slowest at the top (apogee)."},
 {s:"hoop", q:"You fire the engine at perigee, speeding up. What happens?", o:["Perigee gets lower","Apogee rises","The orbit tilts","Nothing changes"], a:1, x:"A push at the low point raises the far side. A push at apogee raises perigee."},
 {s:"hoop", q:"The semi-major axis a equals…", o:["perigee distance minus apogee distance","(perigee radius + apogee radius) ÷ 2, both from Earth's center","the altitude at perigee","the orbit's period"], a:1, x:"Half the line of apsides. Measure from Earth's center, not the surface."},
 {s:"hoop", q:"Which parameter is the 'swivel', where the tilted orbit crosses the equator going north?", o:["Inclination i","Longitude of the ascending node Ω","Argument of periapsis ω","True anomaly ν"], a:1, x:"Ω is measured in the equator plane from the vernal equinox direction (♈) to the ascending node."},
 {s:"hoop", q:"For an Earth satellite, the reference plane and direction are…", o:["The ecliptic and the Sun's direction","The equator and the vernal equinox (♈)","The orbit itself and north","Earth's surface and Greenwich"], a:1, x:"The instructor said ecliptic / toward the Sun; that's for orbits around the Sun. Earth orbits use the equator and ♈."},
 {s:"hoop", q:"An orbit with eccentricity greater than 1 is…", o:["A perfect circle","A gentle oval","An open path that never closes, like a flyby","Impossible"], a:2, x:"e = 1 is escape, e > 1 is a hyperbola: swing past and leave."},
 {s:"vac", q:"Which is NOT one of the five free services Earth's air provides?", o:["Sunscreen (ozone)","A damper for vibration","Gravity","A ground wire for static"], a:2, x:"The five: sunscreen, pressure, damper, fan (convection), ground wire. Gravity is still there in space."},
 {s:"vac", q:"Why does a spacecraft need radiator panels?", o:["To shield it from UV","To dump its own heat, since there is no air to carry heat away","To collect solar power","To protect polymers from atomic oxygen"], a:1, x:"No convection in vacuum. Conduction to a radiator and radiation into space is the only exit."},
 {s:"vac", q:"What is outgassing?", o:["Fuel leaking from the tank","Gas trapped in materials escaping into vacuum, which can fog lenses","Air escaping from the cabin","Exhaust from the thrusters"], a:1, x:"Hence bake-outs before launch and keeping outgassing materials away from sensors."},
 {s:"vac", q:"Why do UV photons damage plastics but not metals?", o:["Plastics are darker","UV energy exceeds the carbon bond energy that holds polymers together; metal bonds are different","Metals reflect all light","Plastics are thinner"], a:1, x:"A 300 nm photon carries ~4 eV; a carbon-carbon bond is ~3.6 eV. The photon wins."},
 {s:"vac", q:"Why do vibrations last much longer on a spacecraft than on Earth?", o:["Spacecraft are lighter","No air to absorb the energy, so the spacecraft must damp it itself","Vacuum amplifies sound","Solar wind keeps shaking it"], a:1, x:"Newton's first law with nothing to stop it. Dampers and reaction wheels do the job the air used to."},
 {s:"vac", q:"Ozone absorbs UV below about what wavelength?", o:["0.3 millimeters","0.3 micrometers (300 nm)","3 meters","0.3 nanometers"], a:1, x:"The captions said millimeters; the slide said micrometers. 0.3 µm = 300 nm."},
 {s:"vac", q:"What happens to static charge on a spacecraft?", o:["It leaks into the air","It builds up until it sparks, so you ground everything and use conductive coatings","It is burned by the engines","It is absorbed by the solar panels"], a:1, x:"No discharge path to the environment. Spacecraft charging is a real design problem."},
 {s:"vac", q:"Why are spacecraft built in clean rooms?", o:["To keep workers cool","One speck on a sensor or lens can ruin it, and voids from dirty manufacturing cause outgassing","It is cheaper","Regulations require white suits"], a:1, x:"Particles and voids start in the factory. Constant checking all the way through."},
 {s:"air", q:"Order the layers from the ground up.", o:["Stratosphere, troposphere, mesosphere, thermosphere","Troposphere, stratosphere, mesosphere, thermosphere, exosphere","Mesosphere, troposphere, thermosphere, stratosphere","Exosphere, thermosphere, troposphere, stratosphere"], a:1, x:"Tropo (0–11), strato (11–50), meso (50–90), thermo (90–500), exo (500+)."},
 {s:"air", q:"Why does the stratosphere get warmer as you go up?", o:["It's closer to the Sun","The ozone layer absorbs UV and turns it into heat","Jet engines heat it","Air is denser up there"], a:1, x:"Absorbed light becomes heat. Earth's sunscreen is also a heater."},
 {s:"air", q:"The thermosphere is around 1000 °C. Why doesn't the ISS cook?", o:["It has thick insulation","There are almost no molecules, so there's nothing to carry the heat into it","It orbits above the thermosphere","It is painted white"], a:1, x:"Temperature is molecule speed; heat needs numbers. A sparkler is 1000 °C and won't warm a room."},
 {s:"air", q:"What is atomic oxygen?", o:["Ozone, O₃","Single oxygen atoms, made when UV splits O₂","Liquid oxygen for rockets","Oxygen dissolved in metal"], a:1, x:"Highly reactive. The main gas from about 200 to 600 km, exactly where LEO satellites fly."},
 {s:"air", q:"In an atomic-oxygen hit at 7.5 km/s, what is moving that fast?", o:["The oxygen atom","The spacecraft","The Sun's light","The Earth"], a:1, x:"The atoms are nearly still. The spacecraft plows into them, and each hit carries enough energy to break a bond."},
 {s:"air", q:"Which layer is the coldest?", o:["Troposphere","Stratosphere","Mesosphere","Thermosphere"], a:2, x:"The mesosphere, around −90 °C. Meteors burn up here."},
 {s:"air", q:"What are the two main gases in the air you breathe, and roughly how much of each?", o:["Oxygen 78%, nitrogen 21%","Nitrogen 78%, oxygen 21%","Carbon dioxide 50%, oxygen 50%","Hydrogen 70%, helium 30%"], a:1, x:"Nitrogen pairs 78%, oxygen pairs 21%, argon about 1%. Carbon dioxide is only 0.04%."},
 {s:"air", q:"Why is the air the same mix everywhere below about 100 km?", o:["Gravity is weaker there","It's constantly stirred by weather and turbulence (the homosphere)","Plants keep it balanced","The ozone layer mixes it"], a:1, x:"Below the turbopause, mixing wins. Above it, gases separate by weight."},
 {s:"air", q:"Above about 100 km, how do the gases arrange themselves?", o:["Randomly","Heaviest highest","By weight: heavy ones low, light ones high","All the same mix"], a:2, x:"N₂ and O₂ lowest, then single O, then helium, then hydrogen on top. Like oil floating on water."},
 {s:"air", q:"Which gas dominates at 600–1,500 km?", o:["Nitrogen","Atomic oxygen","Helium","Carbon dioxide"], a:2, x:"Helium takes over from atomic oxygen there; hydrogen takes over above that."},
 {s:"air", q:"What is the outermost gas in Earth's atmosphere, in the exosphere?", o:["Atomic oxygen","Nitrogen","Helium","Hydrogen"], a:3, x:"Single hydrogen atoms, the lightest thing there is, so thin they can escape Earth. They glow faintly in UV as the geocorona."},
 {s:"air", q:"What is ozone?", o:["A single oxygen atom","Two oxygen atoms, O₂","Three oxygen atoms stuck together, O₃","Oxygen bonded to nitrogen"], a:2, x:"Made in the stratosphere when UV splits O₂ and the loose atoms join other O₂. Rare, but it soaks up UV."},
 {s:"air", q:"What is the ionosphere?", o:["The layer where ozone lives","A region (~60–1,000 km) where sunlight knocks electrons off atoms, leaving charged particles that bend radio","The frozen top of the clouds","Another name for the exosphere"], a:1, x:"It overlaps the thermosphere. It reflects AM radio and slightly delays GPS signals."},
 {s:"air", q:"How much carbon dioxide is in normal air?", o:["About 21%","About 4%","About 0.04%","About 50%"], a:2, x:"Tiny by volume, big for climate. Argon, at 0.9%, is 20 times more common."},
 {s:"air", q:"Which materials does atomic oxygen hurt most?", o:["Steel","Polymers like Kapton","Glass","Gold"], a:1, x:"Metals form a thin oxide skin and mostly stop. Polymers erode like sandblasted glass."},
 {s:"fuel", q:"Rank these visit types from least to most committed.", o:["Lander, flyby, orbiter","Flyby, orbiter, atmospheric probe, lander, rover, penetrator","Rover, lander, orbiter, flyby","Penetrator, flyby, rover"], a:1, x:"Each rung costs more fuel to slow down and more risk, and returns more science."},
 {s:"fuel", q:"Which spacecraft type needs NO braking burn at its target?", o:["Orbiter","Lander","Flyby","Rover"], a:2, x:"It passes once and keeps going. That's why Voyager could visit four planets."},
 {s:"fuel", q:"What goes into Lambert's problem, and what comes out?", o:["In: fuel and mass. Out: the planet","In: two positions and a travel time. Out: the orbit connecting them, and so the Δv","In: an orbit. Out: a launch date","In: a rocket. Out: a landing site"], a:1, x:"The instructor said it backwards. Time goes in; the fuel bill comes out."},
 {s:"fuel", q:"Why can't we fly to Mars in 20 days?", o:["Mars is too far to see","An orbit for it exists, but the Δv is absurd; no rocket can carry the fuel","The crew would get bored","Radio won't reach"], a:1, x:"Fast is expensive. The math works, the fuel doesn't exist."},
 {s:"fuel", q:"Describe a Hohmann transfer.", o:["A straight line from Earth to Mars","Half an ellipse touching both orbits, depart and arrive 180° apart, two burns","A spiral that takes 10 years","A flyby of the Moon"], a:1, x:"The lazy throw. About 8.5 months to Mars, cheapest in fuel."},
 {s:"fuel", q:"How often can you launch to Mars on a Hohmann path?", o:["Every day","Every month","About every 26 months","Once a decade"], a:2, x:"Earth and Mars have to line up with Mars about 44° ahead. That recurs every 26 months."},
 {s:"fuel", q:"Δv (delta-v) is best described as…", o:["The spacecraft's top speed","The total speed change a trip needs, which is really the fuel bill","The distance to the target","The engine's temperature"], a:1, x:"The currency of spaceflight. Every bit of Δv costs fuel you had to carry."},
 {s:"fuel", q:"A Hohmann transfer's time of flight equals…", o:["The full period of the transfer ellipse","Half the period of the transfer ellipse","One Earth year","The target's period"], a:1, x:"Your Section 1 quiz: TOF = π√(a³/μ), half of T = 2π√(a³/μ)."},
 {s:"flyby", q:"In the planet's own frame, what changes during a flyby?", o:["Speed increases","Only the direction; speed in equals speed out","Speed decreases","Nothing"], a:1, x:"Seen from the planet it's a symmetric swing-past. The speed change appears only in the Sun's frame."},
 {s:"flyby", q:"Where does the extra speed from a gravity assist come from?", o:["The Sun","The spacecraft's engines","The planet, which slows down by an unmeasurable amount","Nowhere, it's free energy"], a:2, x:"Energy is conserved. The planet pays, but it's so massive the loss is nothing you could measure."},
 {s:"flyby", q:"How do you make a flyby SLOW you down?", o:["Fire the engine backwards","Pass in front of the planet instead of behind it","Go faster on approach","You can't"], a:1, x:"That's how missions to Mercury and the Sun brake."},
 {s:"flyby", q:"Why did Rosetta take 10 years to reach its comet?", o:["It got lost","It used four flybys to build speed for free instead of carrying fuel; time was the price","Comets are far beyond Pluto","Its engine was broken"], a:1, x:"Launch 2004, Earth, Mars, Earth, Earth flybys, comet 2014."},
 {s:"flyby", q:"Why couldn't New Horizons go into orbit at Pluto?", o:["Pluto has no gravity","It arrived far too fast after the fastest launch ever plus a Jupiter boost; no fuel could brake it","It ran out of power","Pluto was on the other side of the Sun"], a:1, x:"Speed bought the 9.5-year trip. Speed cost the orbit. Hence a flyby."},
 {s:"flyby", q:"More speed at the same distance from the Sun means…", o:["A smaller orbit","A bigger orbit, reaching farther out","The same orbit","Escape from the galaxy"], a:1, x:"More energy, bigger semi-major axis. That's how a few flybys reach the outer planets."},
 {s:"flyby", q:"The 'moving truck' analogy for a flyby: what is the truck?", o:["The spacecraft","The Sun","The planet, moving along its orbit","The rocket"], a:2, x:"A ball bouncing off the front of a moving truck comes back faster. The planet is the truck."},
 {s:"prop", q:"A rocket fires its engine in the vacuum of space. What is it pushing against?", o:["The air behind it", "The launch pad", "Its own exhaust", "Sunlight"], a:2, x:"Newton's third law: throw mass backward, get pushed forward. No air is involved; momentum is conserved between ship and exhaust."},
 {s:"prop", q:"Which formula gives thrust?", o:["F = ṁ × vₑ", "F = vₑ ÷ g₀", "F = ½ m v²", "F = μ ÷ r²"], a:0, x:"Thrust is mass thrown per second times exhaust speed. vₑ ÷ g₀ is specific impulse."},
 {s:"prop", q:"An engine throws 500 kg/s at 4,400 m/s. Thrust?", o:["8.8 N", "2,200 N", "2.2 million N", "4,900 N"], a:2, x:"500 × 4,400 = 2,200,000 N. That is roughly the Space Shuttle main engine."},
 {s:"prop", q:"An engine has Isp = 300 s. Its exhaust velocity is about…", o:["30 m/s", "300 m/s", "2,900 m/s", "30,000 m/s"], a:2, x:"vₑ = Isp × g₀ = 300 × 9.81 ≈ 2,940 m/s."},
 {s:"prop", q:"What does specific impulse measure?", o:["How hard the engine pushes", "How efficiently it uses propellant", "How hot the chamber is", "How heavy the engine is"], a:1, x:"Isp is mileage: push per kilogram of propellant. Thrust is the push itself."},
 {s:"prop", q:"Why does a rocket carry an oxidizer?", o:["To cool the nozzle", "Because there is no air in space to burn the fuel with", "To make the exhaust heavier", "It doesn't; only jets do"], a:1, x:"Burning needs oxygen. A jet takes it from the air; a rocket has to bring its own."},
 {s:"prop", q:"In a rocket nozzle, where does the gas reach exactly the speed of sound?", o:["In the combustion chamber", "At the throat", "At the bell exit", "It never does"], a:1, x:"The throat is the narrowest point; flow is Mach 1 there and supersonic in the bell."},
 {s:"prop", q:"What does the bell-shaped nozzle do to the gas?", o:["Raises its pressure", "Turns pressure and heat into speed", "Burns leftover fuel", "Cools it so it is safe"], a:1, x:"The nozzle spends pressure to buy speed. Pressure is highest in the chamber and lowest at the exit."},
 {s:"prop", q:"'Chemical rockets have low specific impulse but high thrust.' How can both be true?", o:["It can't; it's a mistake", "Thrust depends only on Isp", "They throw a huge mass per second at a modest speed", "They burn for a very long time"], a:2, x:"F = ṁ × vₑ. vₑ is modest (2.5–4.5 km/s) but ṁ is tonnes per second."},
 {s:"prop", q:"Which engine family has the highest thrust?", o:["Chemical", "Electric", "Nuclear thermal", "Solar sail"], a:0, x:"Chemical: up to millions of newtons. Electric gives a fraction of a newton."},
 {s:"prop", q:"Which has the highest specific impulse?", o:["Solid rocket", "Kerosene rocket", "Hydrogen rocket", "Ion thruster"], a:3, x:"Ion thrusters reach 3,000–4,000 s and more. The best chemical engine is about 460 s."},
 {s:"prop", q:"Why is the thrust of an electric engine so small?", o:["Xenon is too light", "Fast exhaust needs huge power, and solar panels give only kilowatts", "There is no oxidizer", "The nozzle is too short"], a:1, x:"Jet power is ½ṁvₑ². At 30–40 km/s even a newton of thrust needs tens of kilowatts."},
 {s:"prop", q:"Why does a nuclear thermal rocket beat a chemical one on Isp?", o:["It burns hotter", "Its exhaust is plain hydrogen, much lighter than steam", "It uses electricity", "It has a bigger nozzle"], a:1, x:"Exhaust speed goes as √(T ÷ molecular mass). Hydrogen (2) against steam (18) at similar temperature: about twice the Isp."},
 {s:"prop", q:"Voyager's plutonium RTG is…", o:["A nuclear rocket engine", "An ion thruster", "A power source that makes electricity, not thrust", "A booster"], a:2, x:"An RTG turns decay heat into electricity. No nuclear rocket has ever flown."},
 {s:"prop", q:"You must brake into Mars orbit in about 30 minutes. Which engine?", o:["Ion thruster", "Chemical rocket", "Solar sail", "Either works"], a:1, x:"Capture needs kilometres per second of Δv quickly. Only chemical thrust can do that today."},
 {s:"prop", q:"Both engines pictured in the lecture (Falcon 9 second stage, Saturn V first stage) burn…", o:["Liquid hydrogen + liquid oxygen", "Kerosene + liquid oxygen", "Solid propellant", "Hydrazine"], a:1, x:"Merlin Vacuum and the F-1 are both kerosene (RP-1) + LOX engines. Hydrogen is common on other upper stages."},
 {s:"ion", q:"What is an ion?", o:["A very small atom", "An atom with a net electric charge", "A particle of light", "A kind of molecule"], a:1, x:"Knock an electron off a neutral atom and it has a net positive charge: a positive ion. Electricity can now grab it."},
 {s:"ion", q:"In an ion thruster, what actually speeds the ions up?", o:["Burning the xenon", "The magnets", "The voltage between the two grids", "The neutralizer"], a:2, x:"Ions fall through about 1,100 V between the screen grid and the accelerator grid and leave at about 40 km/s."},
 {s:"ion", q:"What do the magnets around the chamber do?", o:["Accelerate the ions", "Make electrons spiral so they ionize more atoms", "Cool the engine", "Neutralize the beam"], a:1, x:"Spiralling electrons travel much farther before hitting the wall, so they get more chances to hit an atom."},
 {s:"ion", q:"Why does an ion engine need a neutralizer?", o:["To cool the exhaust", "To stop the ship charging up and pulling its ions back", "To make the beam visible", "To ionize the gas"], a:1, x:"The beam is positive. Without an equal flow of electrons the spacecraft goes negative and the thrust dies."},
 {s:"ion", q:"What really limits the thrust of an electric engine?", o:["Xenon is expensive", "The grids are small", "The electric power available", "Gravity"], a:2, x:"Thrust ≈ 2 × efficiency × power ÷ exhaust speed. Solar panels supply only kilowatts."},
 {s:"ion", q:"Plasma is…", o:["Only positive ions", "Only electrons", "Ions and free electrons mixed, neutral overall", "Very hot neutral gas"], a:2, x:"Plasma is ionized gas: both the ions and the electrons that were knocked off."},
 {s:"ion", q:"Deep Space 1's ion engine pushed with about…", o:["9 grams of force (0.09 N)", "9 kilograms", "9 tonnes", "9 newtons"], a:0, x:"0.092 N, the weight of about two sheets of paper, from 2.3 kW of solar power."},
 {s:"ion", q:"Which job can electric propulsion NOT do?", o:["Station-keeping", "Deep-space cruise", "Launching from the ground", "Slow orbit raising"], a:2, x:"Its thrust is tens of thousands of times less than the craft's weight, and it only runs in vacuum."},
 {s:"ion", q:"An ion falls through a bigger grid voltage. Its exit speed…", o:["Goes down", "Stays the same", "Goes up as the square root of the voltage", "Doubles when voltage doubles"], a:2, x:"½mv² = qV, so v = √(2qV ÷ m)."},
 {s:"ion", q:"Where does the thrust of an ion engine physically act?", o:["On the neutralizer", "On the grids", "On the solar panels", "On the xenon tank"], a:1, x:"The grids pull the ions backward and the ions pull the grids forward: Newton's third law."},
 {s:"ion", q:"BepiColombo's ion engines are used to…", o:["Launch from Earth", "Fly the multi-year trip to Mercury", "Land on Mercury", "Power its instruments"], a:1, x:"They brake against the Sun's pull during the cruise. The capture at Mercury is done with chemical thrusters."},
 {s:"ion", q:"The first probe to cruise between planets on an ion engine was…", o:["Voyager 1", "Deep Space 1 (1998)", "Rosetta", "New Horizons"], a:1, x:"Deep Space 1. Electric thrusters had been tested in orbit since 1964."},
 {s:"nuke", q:"What heats the propellant in a nuclear thermal rocket?", o:["Burning hydrogen with oxygen", "A fission reactor", "Small nuclear explosions", "Electric heaters"], a:1, x:"A reactor core gets hot from fission; hydrogen flows through it. Nothing burns."},
 {s:"nuke", q:"Why does a nuclear thermal rocket get about twice the Isp of a chemical one?", o:["It runs much hotter", "Its exhaust is light hydrogen, not heavy steam", "It uses a bigger nozzle", "It carries more propellant"], a:1, x:"vₑ ∝ √(T ÷ M). The core is actually cooler than a chemical flame; the exhaust is seven times lighter."},
 {s:"nuke", q:"Which is hotter: a chemical rocket's flame or a nuclear rocket's core?", o:["The nuclear core, by far", "They are equal", "The chemical flame (about 3,500 K vs 2,700 K)", "It depends on the nozzle"], a:2, x:"The core must stay solid, so it is limited to about 2,700–2,900 K."},
 {s:"nuke", q:"In a nuclear thermal rocket, the hydrogen is…", o:["The nuclear fuel", "The propellant (working fluid)", "The coolant only, never expelled", "The oxidizer"], a:1, x:"Uranium is the nuclear fuel and stays on board. Hydrogen is heated and thrown out."},
 {s:"nuke", q:"What limits the temperature of a solid-core nuclear rocket?", o:["The uranium runs out", "The nozzle size", "What the core materials can withstand", "The speed of sound"], a:2, x:"The fuel elements must not melt or erode. That caps the gas temperature and so the Isp."},
 {s:"nuke", q:"'Payload' means…", o:["The propellant", "The engines", "The cargo that is the reason for the mission", "The total launch mass"], a:2, x:"Instruments, cameras, crew. Everything else exists to move it."},
 {s:"nuke", q:"Why is a nuclear thermal rocket attractive for crewed Mars trips?", o:["It can launch from the ground", "A faster trip means less radiation exposure for the crew", "It needs no propellant", "It is cheap to test"], a:1, x:"Higher Isp with real thrust allows a shorter transit, so less time in deep-space radiation."},
 {s:"nuke", q:"Low-enriched uranium (LEU) is uranium with…", o:["No U-235 at all", "Under 20% U-235", "About 90% U-235", "Plutonium added"], a:1, x:"LEU is under 20% U-235, so it is not bomb-grade and carries fewer security rules."},
 {s:"nuke", q:"Has a nuclear thermal rocket ever flown in space?", o:["Yes, on Voyager", "Yes, on Apollo", "No: ground tests only, in the 1960s and early 70s", "Yes, on BepiColombo"], a:2, x:"Rover and NERVA ran about 20 reactors on the ground. None flew."},
 {s:"nuke", q:"Project Orion (1958–1965) was…", o:["A nuclear thermal rocket", "Nuclear pulse propulsion: small bombs behind a pusher plate", "An ion engine", "NASA's crew capsule"], a:1, x:"It rode nuclear explosions. The lecture mislabels it; the capsule named Orion is unrelated."},
 {s:"nuke", q:"Could a nuclear thermal rocket reach the nearest star in a human lifetime?", o:["Yes, in about 10 years", "Yes, in about 50 years", "No: tens of thousands of years", "Only with a gravity assist"], a:2, x:"At 17 km/s the 40 trillion km takes about 75,000 years."},
 {s:"nuke", q:"A 'bimodal' nuclear thermal rocket uses its reactor for…", o:["Two kinds of propellant", "Thrust and electricity", "Launch and landing", "Two crews"], a:1, x:"Thrust during burns, electrical power the rest of the time."},
 {s:"comm", q:"Which formula links wavelength, frequency and the speed of light?", o:["c = λ ÷ f", "c = λ × f", "c = λ + f", "f = c × λ"], a:1, x:"Speed = wavelength × frequency. c is fixed, so raising one lowers the other."},
 {s:"comm", q:"FM radio is about 100 MHz. Its wavelength is about…", o:["3 cm", "3 m", "300 m", "3 km"], a:1, x:"300,000,000 m/s ÷ 100,000,000 Hz = 3 m."},
 {s:"comm", q:"If the frequency goes up, the wavelength…", o:["Goes up", "Stays the same", "Goes down", "Depends on the antenna"], a:2, x:"c is constant, so they are inversely related."},
 {s:"comm", q:"How does an antenna pick up a radio wave?", o:["It reflects the wave into a lens", "The wave's electric field pushes electrons in the metal, making a voltage", "It absorbs heat from the wave", "It ionizes the air"], a:1, x:"The alternating field makes an alternating voltage at the same frequency."},
 {s:"comm", q:"A basic dipole antenna is about how long?", o:["One wavelength", "Half a wavelength", "Ten wavelengths", "It doesn't matter"], a:1, x:"The half-wave dipole resonates with the wave."},
 {s:"comm", q:"Why can't a 100 Hz voice signal be transmitted directly?", o:["It is too quiet", "The antenna would have to be about 1,500 km long", "100 Hz waves can't cross space", "It would be illegal"], a:1, x:"λ = 3,000 km, so a half-wave antenna is 1,500 km."},
 {s:"comm", q:"Modulation means…", o:["Making the signal louder", "Changing a carrier wave so it carries the information", "Filtering out noise", "Aiming the antenna"], a:1, x:"The slow information signal is written onto a fast carrier."},
 {s:"comm", q:"In AM, what follows the information signal?", o:["The carrier's frequency", "The carrier's height (amplitude)", "The antenna's length", "The speed of the wave"], a:1, x:"Amplitude modulation: the envelope of the carrier traces the signal."},
 {s:"comm", q:"In FM, what follows the information signal?", o:["The carrier's amplitude", "The carrier's frequency", "The polarization", "The beamwidth"], a:1, x:"Frequency modulation: the spacing of the carrier's waves changes."},
 {s:"comm", q:"An isotropic antenna…", o:["Radiates equally in every direction and is only an ideal reference", "Is the same as a dish", "Has the highest gain possible", "Only receives"], a:0, x:"It cannot be built; gain is measured against it."},
 {s:"comm", q:"A dipole's radiation pattern is…", o:["A narrow beam", "A sphere", "A donut: equal all around the rod, none off the ends", "Random"], a:2, x:"That is what omnidirectional means: equal in one plane."},
 {s:"comm", q:"Antenna gain is…", o:["Extra power the antenna adds", "How much stronger the signal is in the best direction than from an isotropic antenna", "The transmitter's wattage", "The antenna's weight"], a:1, x:"The antenna concentrates power; it creates none."},
 {s:"comm", q:"What is the price of a high-gain antenna?", o:["It uses more power", "Its narrow beam must be pointed accurately", "It only works near Earth", "It can't receive"], a:1, x:"Narrow beam means precise attitude control."},
 {s:"comm", q:"Cassini's 4 m dish must point at Earth because…", o:["It is solar powered", "Its beam is less than a degree wide", "Earth's gravity steers it", "The dish is fragile"], a:1, x:"About 0.6° at 8.4 GHz. Miss by more and Earth hears nothing."},
 {s:"comm", q:"Why does a CubeSat use crossed dipoles and not a dish?", o:["Dipoles have higher gain", "They work whichever way the satellite faces", "Dishes don't work in orbit", "Dipoles need no transmitter"], a:1, x:"Near-omnidirectional coverage with no pointing, at the cost of a weak signal."},
 {s:"comm", q:"Is your voice an electromagnetic wave?", o:["Yes, at 100 Hz", "No: it is a sound wave in air; a microphone turns it into an electrical signal", "Only when you shout", "Yes, but only in vacuum"], a:1, x:"Sound is air pressure at 343 m/s and cannot cross a vacuum."},
 {s:"win", q:"Which two kinds of electromagnetic wave get through the atmosphere well?", o:["X-rays and ultraviolet", "Visible light and radio", "Infrared and gamma rays", "All of them"], a:1, x:"The optical window and the radio window. Most of the rest is absorbed or reflected."},
 {s:"win", q:"Atmospheric opacity of 100% at some wavelength means…", o:["The air is perfectly clear there", "The air blocks that wavelength completely", "The wavelength is visible", "It is used for telecom"], a:1, x:"Opacity is how much is blocked. 0% is clear, 100% is a wall."},
 {s:"win", q:"What stops gamma rays, X-rays and UV?", o:["The ionosphere reflects them", "Their photons have enough energy to break up air atoms and molecules, so they are absorbed high up", "Clouds", "Earth's magnetic field"], a:1, x:"E = h × f: these photons carry several eV or more, enough to ionize or split molecules."},
 {s:"win", q:"Why is most infrared absorbed?", o:["It is the most energetic", "Its photon energy matches how water and CO₂ molecules vibrate", "The ozone layer blocks it", "It is reflected by the ionosphere"], a:1, x:"Absorption is about matching. Infrared fits molecular vibrations; this is also the greenhouse effect."},
 {s:"win", q:"Which has more energy per photon?", o:["A radio wave", "Visible light", "An X-ray", "They are all equal"], a:2, x:"Energy rises with frequency: E = h × f."},
 {s:"win", q:"What happens to very long radio waves (below about 10 MHz) arriving from space?", o:["They are absorbed by ozone", "The ionosphere reflects them", "They pass straight through", "They turn into light"], a:1, x:"The ionosphere's free electrons bounce them back, which is also why shortwave radio travels round the world."},
 {s:"win", q:"Where in the spectrum do spacecraft communicate with the ground?", o:["Infrared", "Ultraviolet", "The radio window, mostly 2 to 32 GHz", "Below 1 MHz"], a:2, x:"S-band, X-band and Ka-band all sit inside the radio window."},
 {s:"win", q:"Put the satellite letter bands in order of rising frequency.", o:["X, S, L, C, Ka, Ku, K", "L, S, C, X, Ku, K, Ka", "S, L, X, C, K, Ku, Ka", "Ka, K, Ku, X, C, S, L"], a:1, x:"L 1–2, S 2–4, C 4–8, X 8–12, Ku 12–18, K 18–27, Ka 27–40 GHz."},
 {s:"win", q:"X-band is roughly…", o:["1–2 GHz", "2–4 GHz", "8–12 GHz", "27–40 GHz"], a:2, x:"The deep-space workhorse: downlink at 8.4 GHz."},
 {s:"win", q:"'Downlink' means…", o:["Earth to spacecraft", "Spacecraft to Earth", "Spacecraft to spacecraft", "A slow link"], a:1, x:"Uplink goes up from Earth; downlink comes down to Earth."},
 {s:"win", q:"Why do uplink and downlink use different frequencies?", o:["To save power", "So the spacecraft's transmitter doesn't drown out its own receiver", "Because the air only passes one of them", "By tradition"], a:1, x:"It must transmit and listen at once; the received signal is vastly weaker than what it sends."},
 {s:"win", q:"Wi-Fi at 2.4 GHz falls in which letter band?", o:["L", "S", "X", "Ka"], a:1, x:"S-band is 2–4 GHz. Wi-Fi 5 GHz is C-band."},
 {s:"win", q:"Why are X-ray and infrared telescopes put in space?", o:["It is colder there", "Those wavelengths don't reach the ground", "To be closer to the stars", "To avoid radio interference"], a:1, x:"The atmosphere is opaque to them. Only visible light and radio have windows."},
 {s:"win", q:"Moving a link from X-band to Ka-band with the same dish gives…", o:["Lower gain", "About 14 times more gain, but more trouble with rain", "The same gain", "A wider beam"], a:1, x:"Gain goes as (D ÷ λ)², and the wavelength is 3.8 times shorter. Rain fade and pointing are the price."},
 {s:"link", q:"Put the transmit chain in order.", o:["Modulate, encode, HPA, up-convert", "Encode, modulate, up-convert, HPA", "HPA, encode, modulate, up-convert", "Up-convert, modulate, encode, HPA"], a:1, x:"Encode the data, write it on a carrier, shift it to the transmit band, then amplify it into the antenna."},
 {s:"link", q:"What does an up-converter do?", o:["Makes the signal more powerful", "Shifts the modulated signal to a higher frequency without changing its content", "Compresses the data", "Removes noise"], a:1, x:"Modulation writes the message; up-conversion only moves the finished signal to the on-air band."},
 {s:"link", q:"Free-space loss happens because…", o:["Space absorbs radio waves", "The wave spreads over a larger and larger sphere", "The antenna overheats", "The ionosphere reflects it"], a:1, x:"Nothing absorbs it. A fixed-size dish catches a smaller share of an ever bigger sphere."},
 {s:"link", q:"If the distance doubles, the received power…", o:["Halves", "Drops to a quarter", "Stays the same", "Drops to a tenth"], a:1, x:"Inverse-square: area grows as distance squared. That is 6 dB."},
 {s:"link", q:"What does a satellite repeater (transponder) do?", o:["Stores messages for later", "Receives the signal, shifts its frequency, amplifies it and retransmits", "Decodes and reads the message", "Reflects the signal like a mirror"], a:1, x:"It is an active relay; a passive reflection would be far too weak."},
 {s:"link", q:"Where is the low-noise amplifier?", o:["Just before the transmit antenna", "Right after the receive antenna, first in the chain", "On the solar panels", "After the decoder"], a:1, x:"It is the first stage, because any noise it adds is amplified by every stage after it."},
 {s:"link", q:"Why can't a weak signal be fixed by amplifying it more?", o:["Amplifiers are too expensive", "Amplifiers boost signal and noise equally, so the ratio stays the same", "It would melt the dish", "The ITU forbids it"], a:1, x:"What matters is signal compared with noise, and amplification changes both together."},
 {s:"link", q:"In the link equation, k is…", o:["The wavelength factor", "The Boltzmann constant, which turns temperature into noise power", "The antenna gain", "The carrier frequency"], a:1, x:"N₀ = k × T. The lecture describes it wrongly."},
 {s:"link", q:"Which of these does NOT improve the signal-to-noise ratio?", o:["A bigger receiving dish", "A colder receiver", "More transmitter power", "A bigger gap between uplink and downlink frequency"], a:3, x:"Power, antenna gains and noise temperature are in the equation. The frequency gap only prevents self-interference."},
 {s:"link", q:"Decibels are useful because…", o:["They are metric", "They turn multiplying gains and losses into adding", "They measure frequency", "They remove noise"], a:1, x:"+3 dB is ×2, +10 dB is ×10. A link budget is one column to add."},
 {s:"link", q:"Roughly how much power reached Earth from Cassini's 20 W transmitter at Saturn?", o:["20 W", "One watt", "A millionth of a watt", "About 10⁻¹⁶ W"], a:3, x:"A ten-thousandth of a millionth of a millionth of a watt, and still readable."},
 {s:"link", q:"What does a higher S ÷ N₀ buy you?", o:["A stronger transmitter", "More bits per second", "A shorter antenna", "Less delay"], a:1, x:"The ratio sets the data rate the link can support."},
 {s:"link", q:"The lecture's 'encoder' really does two jobs. Which?", o:["Amplify and filter", "Compress the data and add error-correcting bits", "Modulate and up-convert", "Aim and track"], a:1, x:"Source coding removes waste; channel coding adds protective redundancy."},
 {s:"link", q:"Why does Voyager 1 send only 160 bits per second?", o:["Its computer is slow", "It is so far away that space loss leaves almost no signal above the noise", "It uses AM radio", "Its antenna broke"], a:1, x:"About 300 times more loss than from Saturn, so the data rate must drop to keep each bit readable."},
 {s:"adcs", q:"Attitude is…", o:["The spacecraft's height above the ground", "Which way the spacecraft is pointing", "Its speed along the orbit", "Its distance from the Sun"], a:1, x:"Height is altitude. Attitude is orientation."},
 {s:"adcs", q:"Roll is rotation about…", o:["The line to the planet", "The direction of travel", "The axis across the orbit", "The Sun line"], a:1, x:"Like an aircraft tilting its wings about its nose-to-tail line."},
 {s:"adcs", q:"Yaw is rotation about…", o:["The direction of travel", "The axis across the orbit", "The line joining the spacecraft and the central body", "Any axis"], a:2, x:"Nose left or right, about the vertical."},
 {s:"adcs", q:"Attitude determination means…", o:["Deciding where to point", "Measuring the current orientation", "Firing thrusters", "Choosing the orbit"], a:1, x:"Determination is the measuring half; control is the correcting half."},
 {s:"adcs", q:"Put the control loop in order, starting from the sensors.", o:["Sensors → actuators → computer → spacecraft", "Sensors → computer → actuators → spacecraft", "Sensors → spacecraft → computer → actuators", "Sensors → computer → spacecraft → actuators"], a:1, x:"Measure, compute the error and the command, apply the torque, the spacecraft responds, measure again."},
 {s:"adcs", q:"What is the 'attitude error'?", o:["A broken sensor", "The difference between where it points and where it should point", "The jitter", "A wrong orbit"], a:1, x:"The computer works to drive this difference to zero."},
 {s:"adcs", q:"A torque is…", o:["A push in a straight line", "A twist: force × lever arm", "A kind of sensor", "Stored energy"], a:1, x:"The rotational version of force, in newton-metres."},
 {s:"adcs", q:"Attitude jitter is…", o:["A slow drift of the orbit", "Small, fast shaking of the pointing direction", "A software bug", "A type of thruster"], a:1, x:"Mostly vibration from moving parts. It must stay inside the mission's requirement."},
