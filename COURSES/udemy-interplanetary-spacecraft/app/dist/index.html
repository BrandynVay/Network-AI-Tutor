// Explain-why prompts: think, reveal, self-grade.
const WHY = [
 {s:"fall", q:"Explain to a friend in two sentences why the ISS doesn't fall down.", a:"It is falling. It's also moving sideways at 7.7 km/s, so the ground curves away under it as fast as it drops. Falling and missing, forever."},
 {s:"shelf", q:"Why is 35,786 km not a round number?", a:"It's the one altitude where a lap takes exactly one Earth rotation. It's calculated from gravity, not chosen. Lower is too fast, higher is too slow."},
 {s:"shelf", q:"Why does GEO have to be over the equator?", a:"Every orbit's plane passes through Earth's center. The equator is the only ground circle centered the same way, so it's the only place a satellite can keep pace with the ground."},
 {s:"hoop", q:"Walk through the six parameters using the hula hoop.", a:"Size (a), squish (e), tilt (i), swivel of the tilt (Ω), spin of the squished end within the plane (ω), and where the bead is now (ν). Five describe the hoop, one describes the ball."},
 {s:"hoop", q:"Why do you fire the engine at perigee to go higher?", a:"A speed-up at the low point raises the opposite side of the orbit, the apogee. The orbit stretches away from where you pushed. A second burn at apogee then rounds it off."},
 {s:"vac", q:"Name the five free services and what goes wrong without each.", a:"Sunscreen → UV snaps plastics. Pressure → trapped gas outgasses and fogs sensors. Damper → vibrations never die. Fan → hot spots stay hot. Ground wire → charge builds and sparks."},
 {s:"vac", q:"Why does the ISS need radiators if space can't heat it up?", a:"The station makes its own heat: electronics, people, sunlight. With no air to blow it away, radiating it from big panels into cold space is the only way out."},
 {s:"air", q:"Explain 'hot but not heat' for the thermosphere.", a:"Temperature is how fast molecules move; the few up there move very fast. Heat is how much energy actually gets delivered, which needs many molecules. There are almost none, so nothing cooks."},
 {s:"air", q:"How is atomic oxygen made and why is it dangerous?", a:"UV splits O₂ into single O atoms up high. They're desperate to bond. A spacecraft at 7.5 km/s slams into them and each hit breaks bonds in plastics, eroding them."},
 {s:"fuel", q:"Explain the Hohmann transfer like the lazy throw.", a:"Don't hurl the ball at your friend on the far merry-go-round; lob it gently so it drifts outward on a long curve and arrives as they come around. Least effort, longer wait. Half an ellipse, 180°, two burns, 8.5 months to Mars."},
 {s:"fuel", q:"What does Lambert's problem do for a mission planner?", a:"Give it where you are, where you want to be, and how long you'll take; it returns the single orbit that works and therefore the Δv. It's the 'can I get there by then, and what will it cost' calculator."},
 {s:"flyby", q:"Explain a gravity assist with the moving truck.", a:"A ball off a wall comes back at the same speed. Off the front of a moving truck it comes back faster because the truck is moving. The planet is the truck: in its frame your speed doesn't change, but in the Sun's frame you leave faster."},
 {s:"fall", q:"How does a satellite stay up with its engines off?", a:"It's moving sideways at 7.7 km/s. Every second it falls 4.3 m and the ground curves away 4.3 m. Gravity is the centripetal force bending its path into a circle; nothing holds it up."},
 {s:"fall", q:"Why do astronauts float if gravity up there is 90% of normal?", a:"Weight is the floor pushing back on you. In free fall nothing pushes back, so you float, even though gravity is almost full strength."},
 {s:"shelf", q:"Where does 35,786 km come from? Walk the reasoning.", a:"Set the period equal to one sidereal day, 86,164 s, in T = 2π√(r³/μ). Solve for r: 42,164 km from the center. Subtract Earth's radius: 35,786 km altitude. The equation chose it."},
 {s:"shelf", q:"How does GPS turn radio signals into a position, and why four satellites?", a:"Each satellite sends the time; the delay times the speed of light is the distance, which puts you on a sphere. Three spheres meet at a point. The fourth corrects your phone's cheap clock."},
 {s:"shelf", q:"Why do GEO launches happen near the equator?", a:"Your orbit's tilt starts at your launch latitude. GEO needs 0°. Removing tilt costs 2v·sin(Δi/2), about 3.8 km/s from Florida, so launching from 5° (Kourou) saves most of it."},
 {s:"hoop", q:"Burn prograde at perigee: which elements change and which don't?", a:"a and e increase (apogee rises). i, Ω and ω stay the same because you pushed along your motion, in the plane, at perigee."},
 {s:"hoop", q:"Why is changing inclination so expensive, and where do you do it?", a:"Δv = 2v·sin(Δi/2); at 7.7 km/s even 1° costs 134 m/s. Do it at apogee where v is small, or launch into the right plane to begin with."},
 {s:"hoop", q:"Where do published orbital elements come from?", a:"Tracking measures position and velocity (the state vector) at an instant (the epoch). Geometry converts those six numbers into a, e, i, Ω, ω, ν. They're published as a Two-Line Element set."},
 {s:"vac", q:"How does a radiator get rid of heat with no air?", a:"Radiation: P = σεT⁴. Heat pipes carry heat to big panels coated to radiate well and absorb little sunlight; the panels glow it into cold space. Hotter panels radiate much more, because of the fourth power."},
 {s:"vac", q:"How does charge build up on a spacecraft, and what stops the arc?", a:"UV knocks electrons off sunlit surfaces (positive); shaded insulators collect plasma electrons (negative). Kilovolt gaps arc. Fix: make every surface conductive and bond them all together so nothing can be more than a volt apart."},
 {s:"fuel", q:"Walk the LEO-to-GEO Hohmann numbers.", a:"7.73 km/s in LEO. Burn to 10.15 at perigee (+2.42). Coast to apogee at 1.61. Burn to 3.07 (+1.47). a = 24,418 km, time of flight 5.3 h. Total 3.89 km/s."},
 {s:"fuel", q:"Why can't we reach Mars in 20 days? Use the rocket equation.", a:"It would need ~60 km/s. Mass ratio = e^(60/4.4) ≈ 800,000, so the ship would be 99.9999% propellant. The 3.6 km/s Hohmann needs 56%. Exponential growth kills fast trips."},
 {s:"fuel", q:"How is Lambert's problem actually solved?", a:"Infinitely many ellipses fit two points. The time of flight between them depends on the semi-major axis, so iterate a until the time matches the deadline; the departure and arrival velocities, and so the Δv, fall out."},
 {s:"flyby", q:"In Jupiter's frame what changes during a flyby? In the Sun's frame?", a:"Jupiter's frame: speed unchanged, direction bent by the turning angle. Sun's frame: add Jupiter's 13 km/s; passing behind you come out faster, in front you come out slower."},
 {s:"flyby", q:"What three things set how much a flyby bends you?", a:"Approach speed v∞, closest-approach distance r_p, and the planet's mass μ: sin(δ/2) = 1/(1 + r_p·v∞²/μ). Slow, close and massive gives a big bend."},
 {s:"flyby", q:"Why is the price of flybys time?", a:"Each assist needs the planets lined up, so you loop around the inner solar system for years collecting boosts instead of carrying fuel. Rosetta: 10 years, four flybys."},
 {s:"prop", q:"Explain to a friend how a rocket can accelerate in empty space.", a:"It throws mass out the back and gets shoved forward: Newton's third law, or conservation of momentum. It pushes on its own exhaust, not on air. A 1,000 kg ship that throws 1 kg at 3,000 m/s gains 3 m/s."},
 {s:"prop", q:"Walk a kilo of propellant through a liquid rocket engine, tank to exhaust.", a:"Tank, pump, combustion chamber (burns at about 3,300 K and 100+ bar), throat (reaches the speed of sound), bell nozzle (expands, pressure drops, speed climbs to 3–4 km/s), out as exhaust."},
 {s:"prop", q:"What does 'Isp = 348 s' mean, in formula and in words?", a:"Isp = vₑ ÷ g₀, so vₑ = 348 × 9.81 = 3,414 m/s. In words: one kilo of propellant can give 9.81 N of thrust for 348 seconds. It is the engine's mileage."},
 {s:"prop", q:"Why can't we just build a chemical engine with Isp 1,000 s?", a:"The energy per kilo of propellant is fixed by chemistry. Hydrogen and oxygen give about 13 MJ/kg, which caps exhaust speed near 4.5–5 km/s, Isp about 460 s. More needs an outside energy source: electricity or a reactor."},
 {s:"prop", q:"Compare chemical, electric and nuclear thermal engines in one breath.", a:"Chemical: huge thrust, Isp 250–450 s, burns for minutes. Electric: thrust of a few sheets of paper, Isp 3,000 s or more, runs for years on solar power. Nuclear thermal: big thrust, Isp about 900 s, ground-tested but never flown."},
 {s:"prop", q:"The gas in the chamber is hotter than the melting point of steel. Why doesn't the engine melt?", a:"Regenerative cooling: the cold fuel is pumped through channels in the chamber and nozzle walls before it is burned, carrying the heat away."},
 {s:"ion", q:"Give the four steps of an ion thruster, in order, with one line each.", a:"Feed: xenon gas trickles in. Ionize: electrons from a cathode knock an electron off each atom. Accelerate: about 1,100 V between two grids flings the ions out at 40 km/s. Neutralize: a second cathode adds electrons to the beam so the ship stays uncharged."},
 {s:"ion", q:"Why is electric thrust tiny, and why does it not matter for deep-space cruising?", a:"Thrust is limited by electric power: about 40 mN per kW. But the engine runs for months or years, so the small acceleration adds up. Deep Space 1: 16 m/s per day, 4.3 km/s in total."},
 {s:"ion", q:"What goes wrong if the neutralizer stops working?", a:"Only positive ions leave, so the spacecraft charges negative. Within microseconds it is attracting its own ions back, the beam stalls and the thrust drops to nothing. It is self-inflicted spacecraft charging."},
 {s:"ion", q:"The instructor said electrons 'break the electronic bonds' of the atoms and that plasma is 'the positive particles'. Correct both.", a:"No bonds are involved: the collision knocks an electron off a single atom. That is ionization. And plasma is the ions together with the free electrons, neutral overall; only the ions are pulled out by the grids."},
 {s:"nuke", q:"The lecture says nuclear rockets have high Isp 'because the working temperatures are higher'. Correct it.", a:"The core is cooler than a chemical flame: about 2,700 K against 3,500 K. Exhaust speed goes as √(T ÷ M), and the nuclear exhaust is hydrogen (mass 2), not steam (mass 13–18). Lighter molecules fly faster, so Isp roughly doubles."},
 {s:"nuke", q:"Trace the hydrogen through a nuclear thermal rocket.", a:"Liquid hydrogen at 20 K, turbopump, cooling channels in the nozzle wall, down through holes in the hot reactor core where it becomes gas at about 2,700 K, throat, bell nozzle, out at about 8–9 km/s."},
 {s:"nuke", q:"Compare all three engine families on thrust, Isp and flight status.", a:"Chemical: huge thrust, 250–450 s, flown on everything. Electric: fraction of a newton, 3,000+ s, flown since 1964. Nuclear thermal: high thrust, about 900 s, ground-tested only. The difference is where the energy comes from: the propellant, solar panels, or a reactor."},
 {s:"nuke", q:"What was Project Orion, and what did the instructor get wrong about it?", a:"A 1958–1965 US study of nuclear pulse propulsion: small nuclear bombs exploded behind a pusher plate with shock absorbers. He called it a NASA nuclear thermal project from 1986. It was neither NASA's, nor thermal, nor from the 1980s."},
 {s:"comm", q:"Explain how a metal rod turns a radio wave into a signal, and why its length matters.", a:"The wave's electric field pushes the rod's free electrons back and forth, producing an alternating voltage at the wave's frequency. A rod half a wavelength long resonates with the wave, so it gives the strongest voltage. That ties antenna size to frequency."},
 {s:"comm", q:"Why is modulation needed? Give the antenna reason and one more.", a:"A voice-frequency signal sent directly would need an antenna about 1,500 km long. Writing it onto a fast carrier lets a small antenna do the job. It also lets many users share the air, each on its own carrier frequency."},
 {s:"comm", q:"AM versus FM in one sentence each.", a:"AM: the carrier's height rises and falls with the signal. FM: the carrier's height stays constant and its frequency speeds up and slows down with the signal. FM resists static better; spacecraft use a third kind, phase modulation, for bits."},
 {s:"comm", q:"How does a dish antenna make a signal stronger without adding power?", a:"It takes the power an isotropic antenna would spread over a whole sphere and concentrates it into a narrow main lobe, like a flashlight reflector. Cassini's 4 m dish gave about 50,000 times. The cost is that the beam is under a degree wide and must be aimed."},
 {s:"comm", q:"When would a spacecraft use its low-gain antenna?", a:"When it cannot point the dish at Earth: right after launch, during maneuvers, or in safe mode after a fault. The wide beam always reaches Earth, but only at a very low data rate."},
 {s:"win", q:"Walk across the spectrum from gamma rays to long radio and say what the atmosphere does to each part, and why.", a:"Gamma, X-ray, UV: absorbed high up, because their photons can ionize or split air molecules. Visible: passes, it matches nothing. Infrared: mostly absorbed by water vapour and CO₂ vibrations. Radio from about 1 cm to 10 m: passes, far too weak to excite anything. Longer radio: reflected by the ionosphere."},
 {s:"win", q:"The instructor says high-energy radiation is blocked simply because it is high-energy. What is the sharper rule?", a:"A photon is absorbed when its energy matches something a molecule can do with it. That explains why infrared, which is weaker than visible light, is absorbed while visible light passes."},
 {s:"win", q:"Name the three deep-space bands with rough frequencies, and say why uplink and downlink differ.", a:"S-band about 2.1 up and 2.3 down, X-band 7.2 up and 8.4 down, Ka-band 34 up and 32 down, all in GHz. They differ so the spacecraft can transmit and receive at the same time without its transmitter swamping its receiver."},
 {s:"win", q:"Why would a mission choose Ka-band over X-band, and what does it cost?", a:"With the same dish the gain is about 14 times higher and there is more bandwidth, so more data. The cost is rain and water-vapour loss on the ground and a beam nearly four times narrower to point."},
 {s:"link", q:"Walk a message through the whole link, transmit side then receive side.", a:"Encode (compress and add error-correcting bits), modulate onto a carrier, up-convert to the transmit band, high-power amplifier, antenna. Then space loss. Then antenna, low-noise amplifier, down-convert, demodulate, decode. Each receive box undoes one transmit box."},
 {s:"link", q:"What is free-space loss, and what is it not?", a:"It is the drop in received power because the wave spreads over a sphere of area 4πd²: twice the distance, a quarter of the power. It is not absorption; nothing in space takes energy from the wave."},
 {s:"link", q:"Why does the first amplifier in a receiver have to be low-noise, when the transmitter's amplifier doesn't?", a:"At the receiver the signal is about as weak as the noise, and any noise the first stage adds is amplified by everything after it. At the transmitter the signal is enormous compared with noise, so only output power matters."},
 {s:"link", q:"Say the link equation in words: what helps and what hurts.", a:"Signal-to-noise goes up with transmitter power, transmit antenna gain and receive antenna gain. It goes down with space loss, atmospheric loss and noise, where noise is the Boltzmann constant times the receiver's temperature."},
 {s:"link", q:"Why are link budgets done in decibels?", a:"Every term multiplies or divides, across thirty orders of magnitude. Decibels turn that into adding and subtracting one column: 13 + 47 − 294 + 74 = −160 dBW for Cassini."},
 {s:"adcs", q:"Explain the attitude control loop using a thermostat.", a:"A thermostat measures temperature, compares it with the setting and switches the heater. The ADCS measures attitude with sensors, the computer compares it with the wanted attitude to get an error, commands a torque, the actuators twist the spacecraft, and the sensors measure again. It runs continuously."},
 {s:"adcs", q:"What is moment of inertia, and which axis is biggest for a rod and for a disk?", a:"It is how hard a body is to spin about an axis, and it grows with how far the mass is from that axis. Rod: biggest across the middle, smallest along its length. Disk: biggest through its face."},
 {s:"adcs", q:"Why does a spinning body end up on its maximum-inertia axis?", a:"With no outside torque its angular momentum cannot change. But flexing and sloshing turn spin energy into heat. For a fixed angular momentum the energy is L² ÷ (2 × I), which is lowest when I is largest, so that is where it settles."},
 {s:"adcs", q:"Correct the lecture's verdict on Explorer 1 and Sputnik 1.", a:"Explorer 1 did tumble, but it worked for four months and discovered the radiation belts, and its tumble is how the major-axis rule was learned. Sputnik 1 was not cleverly stable; a sphere has no preferred axis, and its all-round antennas meant orientation did not matter."},
 {s:"sens", q:"Name the five main attitude sensors and what each one looks at.", a:"Gyroscope: its own rotation. Sun sensor: the direction to the Sun. Star tracker: star patterns. Horizon sensor: the warm edge of the planet in infrared. Magnetometer: the direction of the magnetic field."},
 {s:"sens", q:"Why does a spacecraft carry several kinds of sensor?", a:"One direction fixes only two of three angles, so at least two references are needed. And each has a blind spot: no Sun in eclipse, star trackers get dazzled or lose lock when tumbling, magnetometers need a strong field, gyros drift."},
 {s:"sens", q:"Explain gyro drift and how it is dealt with.", a:"A gyro measures turn rate; the angle comes from adding rates, so small errors accumulate, for example 0.01° per hour becomes 0.24° in a day. An absolute sensor such as a star tracker periodically resets the estimate."},
 {s:"sens", q:"Correct two things the lecture says about gyroscopes and the Cubli.", a:"A gyroscope measures rotation rate, not position and orientation. And the Cubli is a cube that balances using reaction wheels, which are actuators; it is not a gyroscope."},
 {s:"act", q:"Explain how a reaction wheel turns a spacecraft, with the swivel-chair picture.", a:"On a swivel chair, swinging your arms one way turns your body the other because total spin is conserved. A motor spins a wheel one way and the spacecraft turns the other. With an inertia ratio of 10,000, a wheel at 1,000 rpm turns the craft at 0.1 rpm. Stop the wheel and the craft stops."},
 {s:"act", q:"What is saturation, what causes it, and how is it fixed?", a:"A wheel at its top speed can absorb no more. Steady outside disturbance torques keep adding angular momentum, which the wheel takes up by speeding up. It is fixed by momentum dumping: a thruster or magnetic torquer applies an outside torque while the wheel slows down."},
 {s:"act", q:"Reaction wheel versus control moment gyro: what does each change, and when would you choose a CMG?", a:"A reaction wheel changes its speed; a CMG keeps its speed and tilts its axis. Tilting a fast wheel gives far more torque, hundreds of N·m against about 0.1, so CMGs are used for very heavy or very agile spacecraft such as the Space Station."},
 {s:"act", q:"Sort the five actuators into inside and outside, and say why that matters.", a:"Inside: reaction wheels, momentum wheels, CMGs. They only exchange angular momentum with the spacecraft. Outside: thrusters and magnetic torquers. They push on exhaust or on the planet's field, so they can change the total. Wheels need an outside actuator to empty them."},
 {s:"sun", q:"Explain how a solar cell turns light into current.", a:"Two semiconductor layers, n-type with spare electrons and p-type with holes, form a junction with a built-in electric field. A photon with at least the band-gap energy frees an electron. The field pushes it to the n side, and it returns to the p side through the external wire, delivering power on the way."},
 {s:"sun", q:"Why stack three junctions, and what does it really gain?", a:"Each material uses only photons near its band gap. Three materials with gaps of about 1.9, 1.4 and 0.67 eV each take a different part of the spectrum. Efficiency rises from about 20% to about 30%. It does not triple."},
 {s:"sun", q:"Give the recipe for sizing a solar array and work it for 1,000 W at Jupiter.", a:"Flux = 1,361 ÷ distance² = 1,361 ÷ 27 ≈ 50 W/m². Usable power per m² = 50 × 0.30 × 0.8 = 12 W. Area = 1,000 ÷ 12 ≈ 83 m²."},
 {s:"sun", q:"Correct two things the lecture says about solar cells.", a:"A triple-junction cell does not multiply efficiency by three; it goes from about 20% to about 30%. And the photon does not give the electron inertia to go round the circuit; the junction's built-in field drives it."},
 {s:"batt", q:"Explain primary versus secondary batteries and what each is used for.", a:"Primary batteries are one-shot and cannot be recharged, but store the most energy per kilo, so they do one-time jobs: pyrotechnics, stage separation, short-lived probes. Secondary batteries are rechargeable and carry the spacecraft through every eclipse."},
 {s:"batt", q:"What is depth of discharge, and why is it the key design choice?", a:"It is the percentage of the battery's capacity used in each cycle. Shallow cycles give far longer life, but the battery must then hold much more than the energy actually used, so it is heavier. The designer trades mass against lifetime."},
 {s:"batt", q:"Size a battery: 1,000 W load, 36 minutes of eclipse, 30% depth of discharge, 28 V.", a:"Energy used = 1,000 × 0.6 = 600 Wh. Battery energy = 600 ÷ 0.30 = 2,000 Wh. Capacity = 2,000 ÷ 28 ≈ 71 Ah. At 150 Wh/kg that is about 13 kg."},
 {s:"batt", q:"How does the battery change the size of the solar array?", a:"The array must run the spacecraft and also put back the energy the battery spent, within the sunlit part of the orbit. For 600 Wh in 56 minutes with losses that is about 710 W extra, so a 1,000 W spacecraft needs about 1,700 W of array."},
 {s:"rtg", q:"Explain an RTG in two steps.", a:"First, plutonium-238 decays naturally, emitting alpha particles whose energy heats the fuel to about 1,000 °C. Second, thermocouples between the hot fuel and the cold finned shell turn that temperature difference into a voltage by the Seebeck effect. About 6% of the heat becomes electricity."},
 {s:"rtg", q:"Why is an RTG not a nuclear reactor?", a:"A reactor sustains a controlled fission chain reaction and can be throttled. An RTG just lets its fuel decay at the natural rate: no chain reaction, no control, no off switch."},
 {s:"rtg", q:"Check the slide: Galileo's RTG went from 290 W to 250 W. Does the half-life explain it?", a:"Mostly. After 14 years 0.5^(14 ÷ 87.7) = 0.895 of the plutonium's power is left, which is 260 W. The remaining loss is the thermocouples ageing."},
 {s:"rtg", q:"Compare the three power sources of Section 7 in one breath.", a:"Solar arrays convert sunlight at about 30% and are used from Mercury to Jupiter. Rechargeable batteries store that energy to cover every eclipse. RTGs make a few hundred watts from plutonium decay for decades, for places with too little sunlight or long darkness."},
];

 ["Angular momentum","L = moment of inertia × spin rate. Conserved without outside torque","adcs"],
 ["Explorer 1","USA 1958: a pencil spun lengthwise; tumbled within hours; found the radiation belts","adcs"],
 ["Sputnik 1","USSR 1957: a sphere, no preferred axis, all-round antennas; attitude didn't matter","adcs"],
 ["Gyroscope","Measures rotation rate. Fast, works anywhere, but drifts","sens"],
 ["Sun sensor","Direction to the Sun from solar-cell currents. Cheap, light; blind in eclipse; 2 angles","sens"],
 ["Star tracker","Camera matching stars to a catalogue. ~3 arcseconds, all 3 angles; costly, can be dazzled","sens"],
 ["Horizon sensor","Finds the warm planet's edge in infrared. Gives roll + pitch (down), not yaw","sens"],
 ["Magnetometer","3-axis compass compared with a field model. ~1°; low Earth orbit only","sens"],
 ["Why two sensors?","One direction fixes only 2 of 3 angles; you can still spin about it","sens"],
 ["Gyro drift","Error that builds up because angle = sum of measured rates. Reset by a star tracker","sens"],
 ["Earth in infrared","~255 K, peak ~11 µm; space is 2.7 K","sens"],
 ["Sensor fusion","Blending gyros (fast) with absolute sensors (exact), usually a Kalman filter","sens"],
 ["IMU","Inertial measurement unit: gyroscopes + accelerometers in one box","sens"],
 ["Reaction wheel","Wheel spun either way from rest; change its SPEED and the craft turns the other way","act"],
 ["Momentum wheel","Wheel kept spinning fast always; adds gyroscopic stiffness; speed changes control one axis","act"],
 ["Control moment gyro (CMG)","Constant-speed wheel on a gimbal; TILT the axis for a large torque","act"],
 ["Saturation","Wheel at top speed; can absorb no more angular momentum","act"],
 ["Momentum dumping","Emptying wheels with an outside torque: thrusters or magnetic torquers","act"],
 ["Magnetic torquer","Coil electromagnet twisted by the planet's field. ~0.0003 N·m; no fuel; low orbit only","act"],
 ["Attitude thrusters","Small jets fired in opposite pairs: torque = force × arm. Strong, but use propellant","act"],
 ["Internal vs external actuators","Wheels and CMGs swap spin; thrusters and magnetorquers change the total","act"],
 ["ISS control moment gyros","Four; 98 kg wheel at 6,600 rpm; 4,760 N·m·s; about 258 N·m","act"],
 ["Slew rate","How fast a spacecraft can turn to a new target, in degrees per second","act"],
 ["Why 3–4 wheels","One per axis for roll, pitch and yaw, plus a slanted spare","act"],
 ["CMG torque formula","Torque = angular momentum × gimbal rate","act"],
 ["Solar flux","Sunlight power per square metre: 1,361 ÷ (distance in AU)² W/m²","sun"],
 ["Solar flux at the planets","Mercury 9,100 · Venus 2,600 · Earth 1,361 · Mars 590 · Jupiter 50 W/m²","sun"],
 ["Deployable vs body-mounted","Wings that unfold for lots of area vs cells on the body's own skin","sun"],
 ["n-type / p-type","Semiconductor with spare electrons / with missing electrons (holes)","sun"],
 ["p–n junction","Boundary of the two layers; its built-in field pushes electrons one way","sun"],
 ["Photovoltaic effect","A photon frees an electron; the junction field sends it round the circuit","sun"],
 ["Band gap","Energy a photon needs to free an electron in a material. Silicon 1.1 eV","sun"],
 ["Triple-junction cell","Three stacked layers for short, medium and long wavelengths: about 30%","sun"],
 ["Array power formula","P = flux × area × efficiency × cos(tilt)","sun"],
 ["1 m² at Earth","1,361 × 0.30 ≈ 410 W","sun"],
 ["Heat and solar cells","Hotter cell = lower voltage = less power; best just out of eclipse","sun"],
 ["Juno's arrays","About 60 m²; roughly 500 W at Jupiter, where sunlight is 27× weaker","sun"],
 ["Primary battery","One shot, no recharge, highest energy per kilo (~400–500 Wh/kg). Pyro, staging, short probes","batt"],
 ["Secondary battery","Rechargeable from the array; runs the spacecraft in eclipse. Li-ion ~150–250 Wh/kg","batt"],
 ["Capacity vs energy","Capacity in ampere-hours; energy in watt-hours = Ah × volts","batt"],
 ["Depth of discharge (DoD)","Percentage of capacity used each cycle. 80% left = DoD 20%","batt"],
 ["DoD and life","Shallow cycles last far longer: 80% → 700 cycles, 30% → 2,000, 10% → 7,000","batt"],
 ["Battery sizing formula","Battery energy = load × eclipse time ÷ DoD","batt"],
 ["Eclipse in low orbit","Up to 36 min of a 92 min orbit; ~16 cycles a day, ~5,800 a year","batt"],
 ["GEO batteries","About 90 eclipses a year (equinox seasons), up to 72 min; DoD 60–80%","batt"],
 ["Space battery types","Nickel-cadmium, nickel-hydrogen, then lithium-ion (today's standard)","batt"],
 ["State of charge","Percentage remaining = 100% − depth of discharge","batt"],
 ["RTG","Radioisotope thermoelectric generator: decay heat → electricity through thermocouples","rtg"],
 ["RTG fuel","Plutonium-238: 0.57 W of heat per gram, half-life 87.7 years","rtg"],
 ["Pu-238 decay","→ uranium-234 + an alpha particle (2 protons + 2 neutrons)","rtg"],
 ["Seebeck effect","A temperature difference across two joined materials produces a voltage","rtg"],
 ["RTG efficiency","About 6–7%; the rest is radiated by the fins","rtg"],
 ["RTG vs reactor","Natural decay, no chain reaction, cannot be switched off. Not a reactor, not an engine","rtg"],
 ["Galileo's RTG","290 W new → 250 W after 14 years · 55 kg · 7.5 kg Pu-238 · 114 cm long","rtg"],
 ["Who uses RTGs","Voyager, Galileo, Cassini, New Horizons, Curiosity, Perseverance","rtg"],

PROGRAMS.s4={"name": "Section 4 · Space propulsion", "short": "Section 4", "mins": "4 min", "opener": "\"How does a rocket even work in space? There's nothing to push against.\"", "blocks": [{"t": 45, "name": "Throw it backward", "color": "#0e8f9c", "key": "A rocket pushes on its own exhaust: throw mass back, go forward. Thrust is how much you throw times how fast.", "draw": "Box with a bell, thin arrow back, thick arrow forward.", "hand": "The classic way to throw is to burn something."}, {"t": 60, "name": "Chemical: the hare", "color": "#e5338f", "key": "A fire with one way out: fuel plus its own oxygen burn, and a bell nozzle turns pressure into speed. Huge push, poor mileage, gone in minutes.", "draw": "Two tanks, a chamber, a throat, a bell.", "hand": "But fire can only throw so fast. Electricity can throw faster."}, {"t": 60, "name": "Electric: the tortoise", "color": "#b5651d", "key": "Knock an electron off each atom, let charged grids fling the ions out at 40 km a second. Two sheets of paper of push, for years.", "draw": "A can, two dashed grids, plus-signs flying out.", "hand": "Is there anything with both push and mileage?"}, {"t": 45, "name": "Nuclear: the kettle", "color": "#6b7a1f", "key": "A reactor heats hydrogen. Not hotter than fire, but lighter exhaust, so twice the mileage. Tested in the sixties, never flown.", "draw": "Big circle 18, small circle 2.", "hand": "So here's the whole section in one line."}, {"t": 30, "name": "Landing", "color": "#0b1437", "key": "Every engine throws mass backward. They differ in where the energy comes from, and you always trade push against mileage. Then stop and let them ask.", "draw": "", "hand": ""}], "cue": ["1 · THROW IT BACK — skateboard + bowling ball · F = ṁ × vₑ · no air needed", "2 · CHEMICAL — fuel + oxidizer · throat Mach 1 · bell · 450 s max · tonnes per second", "3 · ELECTRIC — ionize · grids 1,100 V → 40 km/s · neutralizer · 9 grams · power-limited", "4 · NUCLEAR — reactor heats H₂ · light = fast · ~900 s · never flown · not Orion", "LAND — \"push vs mileage; energy from propellant, panels or reactor\""], "land": "Every engine is a way of throwing mass backward. Chemical gives push, electric gives mileage, nuclear would give some of both, and the mission decides which you need."};
PROGRAMS.s5={"name": "Section 5 · Communications", "short": "Section 5", "mins": "4 min", "opener": "\"How does a probe at Saturn talk to Earth? It can't have much power out there.\"", "blocks": [{"t": 60, "name": "Ripples you can write on", "color": "#c0392b", "key": "Radio is a ripple of electricity and magnetism. An antenna is a rod half a ripple long, so you write the slow message onto a fast carrier.", "draw": "A wave with one wavelength marked, a rod half as long.", "hand": "But a rod sprays the signal everywhere. So you aim it."}, {"t": 45, "name": "The radio flashlight", "color": "#c0392b", "key": "A dish adds no power. It aims it: Cassini's 20 watts looked like a million in our direction, as long as the dish pointed at Earth.", "draw": "A bare bulb, then a bulb with a reflector and a narrow beam.", "hand": "And not every kind of wave can make the trip to the ground."}, {"t": 45, "name": "Two windows in the wall", "color": "#3d5a80", "key": "The air is a wall with two windows, light and radio. Hard-hitting rays get absorbed, radio slips through, so spacecraft use radio bands like S, X and Ka.", "draw": "Hatched blocks with two gaps and an arrow through each.", "hand": "So will the far end actually hear it?"}, {"t": 60, "name": "Shouting across a stadium", "color": "#6a4c93", "key": "The signal isn't eaten, it spreads: twice as far, a quarter the power. What matters is how loud it is compared with the noise, and that sets the bits per second.", "draw": "Zigzag: up, long way down, up, long way down, up.", "hand": "So here's all of it in one line."}, {"t": 30, "name": "Landing", "color": "#0b1437", "key": "Write the message on a wave, aim it, send it through the radio window, and make sure it lands louder than the noise. Then stop and let them ask.", "draw": "", "hand": ""}], "cue": ["1 · RIPPLES — c = λ × f · rod = half a wave · voice → 1,500 km · carrier, AM / FM", "2 · FLASHLIGHT — isotropic / donut / beam · gain aims, adds nothing · 4 m dish, 0.6°, 20 W → 1 PROGRAMS.s6={"name": "Section 6 · Attitude determination and control", "short": "Section 6", "mins": "4¼ min", "opener": "\"How does a spacecraft point at anything? There's nothing up there to hold on to.\"", "blocks": [{"t": 60, "name": "Point, check, nudge", "color": "#283593", "key": "Attitude is which way it faces. It holds it with a loop, like a thermostat: look, compare with the target, nudge, look again.", "draw": "A box with three arrows, then four boxes in a ring.", "hand": "You could also just spin it like a top. But only one way."}, {"t": 45, "name": "Pencils tumble, coins spin", "color": "#283593", "key": "Things only spin steadily the fat way, with their weight far from the axis. America's first satellite was a pencil spun lengthwise and it tumbled.", "draw": "A pencil and a coin with their spin axes.", "hand": "So how does it know which way it's facing?"}, {"t": 60, "name": "Inner ear, eyes, compass", "color": "#00695c", "key": "Gyros feel every turn but drift. The Sun, the stars, the horizon and the magnetic field are its eyes. One direction is never enough, so it blends them.", "draw": "A box with arrows to a Sun, stars, an Earth edge; a sawtooth.", "hand": "And once it knows, how does it turn?"}, {"t": 60, "name": "Spin a wheel, turn the ship", "color": "#ad1457", "key": "Spin a wheel inside one way and the ship turns the other. Wheels fill up, so a small jet or a magnet on Earth's field empties them.", "draw": "A box with a wheel and opposite arrows; a sawtooth hitting a ceiling.", "hand": "So here's the whole section in one line."}, {"t": 30, "name": "Landing", "color": "#0b1437", "key": "Sense it, compare it, twist it, forever. Then stop and let them ask.", "draw": "", "hand": ""}], "cue": ["1 · LOOP — attitude = pointing · roll pitch yaw · sensors → computer → actuators · jitter", "2 · PENCIL / COIN — moment of inertia = mass far from axis · fat way only · Explorer 1 tumbled, Sputnik a ball", "3 · SENSORS — gyro drifts · Sun, stars (0.001°), horizon, compass · one arrow = 2 angles", "4 · ACTUATORS — wheel one way, ship the other · saturation · thrusters + magnets empty them · CMG tilts", "LAND — \"sense, compare, twist, forever\""], "land": "A spacecraft keeps its pointing by sensing which way it faces, comparing that with where it should face, and twisting itself to close the gap, forever."};

c00", "key": "A sunlight sandwich near the Sun, a battery bucket for the shadow, and a warm rock of plutonium where the Sun doesn't reach.", "draw": "Two-layer box; zigzag; finned ring.", "hand": "So here is all of it in one breath."}, {"t": 30, "name": "Landing", "color": "#0b1437", "key": "Nothing is free up there: every job the Earth does for you, the spacecraft must do itself. Then stop and let them ask.", "draw": "", "hand": ""}], "cue": ["HOOK — get there · survive · talk · point · power", "1 · GETTING THERE — fall + miss · 3 shelves · lazy half-ellipse 259 days · flyby", "2 · ENGINES — throw mass back · chemical 450 s · electric 3,000 s · nuclear never flew", "3 · SURVIVING — 5 free jobs · atomic oxygen · clean room", "4 · TALKING — c = λ × f · dish aims · two windows · signal ÷ noise · 20 W from Saturn", "5 · POINTING — loop · gyro drifts, stars fix · wheels swap, jets remove", "6 · POWER — sandwich 30% · ÷ distance² · bucket + depth of discharge · warm rock 88 years", "LAND — \"it has to do everything for itself\""], "land": "A spacecraft has to do for itself every job the Earth does for us: move, survive, talk, point and stay powered."};
